<style>
  .sheet-frame { width: 100%; height: 60vh; min-height: 360px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  .sheet-warn { background: var(--warn-weak); color: var(--warn); border-radius: 10px; padding: 8px 12px; margin: 8px 0; }
  .sheet-link { display: inline-block; margin-top: 8px; }
</style>
<script>
  /** 출석부 화면(C7): 날짜를 고르면 미리보기, 아래 바에서 PDF 받기. */
  function renderScreen(root) {
    var state = { date: '', data: null, busy: false };
    var head = el('div', { class: 'card' });
    var info = el('div');
    var preview = el('div', { class: 'card' });
    root.appendChild(head); root.appendChild(info); root.appendChild(preview);

    var dateField = null;
    var pdfBtn = null;
    var bar = UI.actionBar([
      { text: 'PDF 받기', kind: 'primary', disabled: true, onclick: onPdf }
    ], { mount: true });
    pdfBtn = bar.querySelectorAll('button')[0];

    function addDays(ymd, n) {
      var p = ymd.split('-'); var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + n));
      return d.getUTCFullYear() + '-' + ('0' + (d.getUTCMonth() + 1)).slice(-2) + '-' + ('0' + d.getUTCDate()).slice(-2);
    }

    function buildHead(today) {
      clear(head);
      head.appendChild(el('h2', { text: '출석부' }));
      dateField = UI.dateField({
        label: '날짜', value: today, name: 'date',
        shortcuts: [{ label: '오늘', value: today }, { label: '내일', value: addDays(today, 1) }],
        onchange: function (v) { load(v); }
      });
      head.appendChild(dateField);
    }

    function load(date) {
      state.busy = true; pdfBtn.disabled = true;
      clear(info); clear(preview);
      preview.appendChild(el('div', { class: 'muted', text: '불러오는 중…' }));
      call('getAttendanceSheet', date || '').then(function (r) {
        state.busy = false; state.data = r; clear(preview);
        if (!dateField) buildHead(r.date);
        if (r.warnings && r.warnings.length) r.warnings.forEach(function (w) { info.appendChild(el('div', { class: 'sheet-warn', text: w })); });
        if (!r.ok) { preview.appendChild(el('div', { class: 'error', text: r.error })); return; }
        if (!r.operating) { preview.appendChild(el('div', { class: 'muted', text: r.message })); return; }
        preview.appendChild(kv([
          ['날짜', r.date + '(' + r.weekdayKo + ')'], ['쪽 수', r.pageCount + '쪽'],
          ['자리', r.seatCount + '석 (공석 ' + r.vacantCount + ')'], ['블록', r.blockLabels.join(' · ')]
        ]));
        if (r.unseatedCount) preview.appendChild(el('div', { class: 'sheet-warn', text: '자리가 없는 학생 ' + r.unseatedCount + '명이 있습니다. 좌석 배치를 확인해 주세요.' }));
        var frame = el('iframe', { class: 'sheet-frame', title: '출석부 미리보기' });
        frame.setAttribute('sandbox', '');
        frame.srcdoc = r.html;
        preview.appendChild(frame);
        pdfBtn.disabled = false;
      }).catch(function (err) { state.busy = false; clear(preview); showError(preview, err); });
    }

    function b64Blob(b64) {
      var bin = atob(b64); var arr = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return new Blob([arr], { type: 'application/pdf' });
    }

    function onPdf() {
      if (state.busy || !state.data || !state.data.ok || !state.data.operating) return;
      pdfBtn.disabled = true;
      var old = pdfBtn.textContent; pdfBtn.textContent = 'PDF 만드는 중…';
      call('getAttendanceSheetPdf', state.data.date).then(function (r) {
        pdfBtn.textContent = old; pdfBtn.disabled = false;
        if (!r.ok) { UI.toast(r.error || 'PDF를 만들지 못했습니다.', { kind: 'warn', ms: 5000 }); return; }
        var url = URL.createObjectURL(b64Blob(r.base64));
        var a = el('a', { class: 'btn sheet-link', href: url, download: r.name, text: r.name + ' 열기' });
        var old2 = preview.querySelector('.sheet-link'); if (old2) old2.remove();
        preview.appendChild(a);
        a.click();
        UI.toast('PDF를 만들었습니다. 받아지지 않으면 아래 링크를 누르세요.', { kind: 'ok', ms: 5000 });
      }).catch(function (err) {
        pdfBtn.textContent = old; pdfBtn.disabled = false;
        UI.toast(err.message || String(err), { kind: 'warn', ms: 5000 });
      });
    }

    load(window.SCREEN_DATE || '');
  }
</script>
