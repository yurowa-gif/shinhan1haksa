<script>
  /** 2단계 A 카드(CODING-A: 근무·OUT·면담). 이 함수의 몸통만 고친다(docs/plan/stage2.md 1절) */
  function renderStage2A(d, root) {
    if (d.out && d.out.canRecord) {
      root.appendChild(el('div', { class: UI.cardClass(d.out.targets && (d.out.targets.need + d.out.targets.ready) > 0 ? 'todo' : (d.out.out1 || d.out.out2) ? 'key' : '') }, [
        el('h2', { text: 'OUT 기록' }),
        el('div', { class: 'muted', text: '오늘 적발한 학생의 OUT을 30초 안에 기록합니다.' }),
        el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap;margin:8px 0' }, [
          (d.out.out1 ? UI.statusPill('out1', '1OUT ' + d.out.out1 + '명') : UI.statusPill('mute', '1OUT 0명')), (d.out.out2 ? UI.statusPill('out2', '퇴실 대상 ' + d.out.out2 + '명') : UI.statusPill('mute', '퇴실 대상 0명')), UI.statusPill('mute', '오늘 ' + (d.out.today || 0) + '건')]),
        d.out.targets && (d.out.targets.need + d.out.targets.ready) > 0 ? el('a', { class: 'notice warn', style: 'display:block;margin:8px 0;text-decoration:none', href: d.appUrl + '?page=outs&tab=dismiss',
          text: '2OUT 대상 ' + d.out.targets.n + '명 · 면담 필요 ' + d.out.targets.need + ' · 확정 가능 ' + d.out.targets.ready }) : null,
        UI.rowLink({ href: d.appUrl + '?page=outs&tab=record', text: 'OUT 기록하기' }),
        UI.rowLink({ href: d.appUrl + '?page=outs&tab=term', text: (d.out.periodWord || '이번 학기') + ' 보기' })
      ]));
    }
    var x = d.duty;
    if (!x) return;
    if (x.error) { root.appendChild(el('div', { class: 'card' }, [el('h2', { text: '근무표' }), el('div', { class: 'muted', text: x.error })])); return; }
    // 승인된 시안: "N월 근무표" 카드 — 빈 날·이번 달 교대, 빈 날 2~3개(날짜·조), [근무 편성하기]
    // 라벨은 낱말 중간에서 끊기지 않게 두 줄로 나눠 쓴다
    function emptyBox(n) {
      var b = statBox(n, '');
      var l = b.querySelector('.l'); l.style.wordBreak = 'keep-all'; l.appendChild(el('div', { text: '남은 빈 날' })); l.appendChild(el('div', { text: '(편성이 덜 된 날)' }));
      return b;
    }
    var openText = x.open.map(function (o) { return (+o.date.slice(5, 7)) + '월 ' + (+o.date.slice(8, 10)) + '일(' + o.weekdayKo + ') ' + o.labels.join('·'); }).join(', ');
    var c = el('div', { class: UI.cardClass(x.emptyDays > 0 ? 'todo' : '') }, [
      el('h2', { text: (+x.month.slice(5, 7)) + '월 근무표' }),
      el('div', { class: 'stats', style: 'margin:4px 0 12px' }, [emptyBox(x.emptyDays), statBox(x.swapCount, '이번 달 교대')]),
      el('div', { class: 'muted', text: x.open.length ? '남은 빈 날: ' + openText + (x.emptyDays > x.open.length ? ' 외 ' + (x.emptyDays - x.open.length) + '일' : '') : '비어 있는 날이 없습니다.' }),
      UI.rowLink({ href: d.appUrl + '?page=duty', text: '근무 편성하기' })
    ]);
    root.appendChild(c);
    if (d.duty) root.appendChild(el('div', { class: 'card' }, [
      el('h2', { text: '월말 근무 기록표' }),
      el('div', { class: 'muted', text: '실제 근무자 기준 교사별 합계를 확인하고 PDF·엑셀로 받습니다.' }),
      UI.rowLink({ href: d.appUrl + '?page=duty&tab=record', text: '근무 기록표 열기' })
    ]));
  }

  /** 관리자 '오늘 처리할 것'(D17). 홈 데이터에 있는 숫자만 쓴다 — 없는 숫자(특이사항 확인 대기·오늘 빠지는 학생·복귀 예정일 지남·시간표 확인 대기)는 서버가 주면 자동으로 보인다 */
  function todoCard_(d) {
    var o = d.out || {}, t = o.targets || {}, x = d.exc || {}, dc = d.docs || {}, f = d.food || {}, du = d.duty || {};
    return UI.todoList({ title: '오늘 처리할 것', items: [
      { label: '특이사항 확인 대기', count: x.pending, href: d.appUrl + '?page=exceptions&tab=requests' },
      { label: '2OUT 대상 면담·퇴실 확정', count: (t.need || 0) + (t.ready || 0), hint: '면담 필요 ' + (t.need || 0) + ' · 확정 가능 ' + (t.ready || 0), href: d.appUrl + '?page=outs&tab=dismiss' },
      { label: '복귀 예정일이 지난 임시 퇴실', count: d.moves && d.moves.overdue, href: d.appUrl + '?page=moves' },
      { label: '서류 미제출', count: dc.items, hint: '학생 ' + (dc.students || 0) + '명', href: d.appUrl + '?page=docs' },
      { label: '신청 서류 확인', count: f.docMissing, href: d.appUrl + '?page=moves' },
      { label: '시간표 확인 대기', count: d.timetable && d.timetable.confirmPending, href: d.appUrl + '?page=timetable&role=admin' },
      { label: '근무표 빈 날', count: du.emptyDays, href: d.appUrl + '?page=duty' }
    ] });
  }
  /** 관리자 '전체 기능' 줄 링크(D17): 카드 열 몇 장을 대신한다. 숫자 배지는 위 '처리할 것'과 같은 값 */
  function featureList_(d) {
    var o = d.out || {}, t = o.targets || {}, x = d.exc || {}, dc = d.docs || {}, A = d.appUrl;
    return UI.featureList([
      { title: '출결', items: [
        { text: '사전 특이사항', href: A + '?page=exceptions', badge: x.pending }, { text: '출결 결과 정리', href: A + '?page=results' }, { text: '학사 프로그램', href: A + '?page=programs' },
        { text: '출석부', href: A + '?page=sheet' }, { text: '좌석표', href: A + '?page=seats' }, { text: '떨어뜨릴 짝', href: A + '?page=avoid' }] },
      { title: '학생·생활', items: [
        { text: 'OUT 기록', href: A + '?page=outs&tab=record', badge: (t.need || 0) + (t.ready || 0) }, { text: '서류 체크리스트', href: A + '?page=docs', badge: dc.items },
        { text: '상담일지', href: A + '?page=counsel' }, { text: '상담 신청', href: A + '?page=requests', badge: (d.counselreq || {}).open }, { text: '연락처', href: A + '?page=contacts' }, { text: '시간표', href: A + '?page=timetable&role=admin' }] },
      { title: '운영 설정', items: [
        { text: '운영 기간', href: A + '?page=terms' }, { text: '명단 올리기', href: A + '?page=roster' }, { text: '자습 일정·블록', href: A + '?page=schedule' }] }
    ]);
  }

  /** 관리자 홈: 전체 현황 (PRD 8절) */
  function renderHome(d, root) {
    root.appendChild(el('div', { class: 'card' }, [
      el('h2', { text: '전체 현황' }),
      el('div', { class: 'muted', text: UI.util.formatDateKo(d.today) + ' · ' + d.termName }),
      UI.rowLink({ href: d.appUrl + '?page=inbox', text: '확인함 — 내가 처리할 것 모아 보기' }),
      el('div', { class: 'stats', style: 'margin-top:12px' }, [
        statBox(d.counts.students, '이번 운영 기간 학사생'),
        statBox(d.counts.allStudents, '등록 학생(전체)'),
        statBox(d.counts.guardianLinks, '학부모 연결')
      ])
    ]));
    root.appendChild(todoCard_(d));   // 오늘 처리할 것(D17): 이미 홈 데이터에 있는 숫자만 모아 맨 위에
    var roleStats = el('div', { class: 'stats' });
    Object.keys(d.roleCounts).forEach(function (k) { roleStats.appendChild(statBox(d.roleCounts[k], k)); });
    root.appendChild(el('div', { class: 'card' }, [el('h2', { text: '계정(활성)' }), roleStats]));
    try { renderStage2B(d, root); } catch (e) { showError(root, e); }   // 2단계 카드가 실패해도 나머지 카드는 그린다
    try { renderStage2A(d, root); } catch (e) { showError(root, e); }
    if (d.docs && !d.docs.error) {
      root.appendChild(el('div', { class: UI.cardClass(d.docs.items ? 'todo' : '') }, [
        el('h2', { text: '서류 체크리스트' }),
        el('div', { style: 'margin:8px 0' }, [d.docs.items ? UI.statusPill('todo', '미제출 ' + d.docs.items + '건 · 학생 ' + d.docs.students + '명') : UI.statusPill('confirmed', d.docs.types ? '모두 제출' : '서류 종류 없음')]),
        el('div', { class: 'muted', text: '학기 초 서류(동의서 등)를 냈는지 표시합니다.' }),
        UI.rowLink({ href: d.appUrl + '?page=docs', text: '서류 체크리스트 열기' })
      ]));
    }
    root.appendChild(featureList_(d));
  }

  /** 2단계 B 카드(CODING-B: 입퇴실·급식·서류). 이 함수의 몸통만 고친다(docs/plan/stage2.md 1절) */
  function renderStage2B(d, root) {
    var f = d.food;
    if (!f || f.error) return;
    if (f.noTerm) {
      root.appendChild(el('div', { class: 'card' }, [el('h2', { text: '오늘 급식·인원' }), el('div', { class: 'muted', text: '오늘은 운영 기간이 아닙니다.' }),
        UI.rowLink({ href: d.appUrl + '?page=mealcount', text: '식수 집계 열기' })]));
    } else if (f.counts) {   // 오늘 인원과 빈자리(C19)
      var c = f.counts;
      root.appendChild(el('div', { class: 'card' }, [
        el('h2', { text: '오늘 급식·인원' }),
        el('div', { class: 'muted', style: 'margin-bottom:8px', text: c.dateKo + ' · ' + c.termName }),
        el('div', { class: 'stats', style: 'margin:4px 0 12px' }, [statBox(c.hall, '학사'), statBox(c.dorm, '기숙'), statBox(c.breakfast, '조식'), statBox(c.hallDinner + c.generalDinner, '석식')]),
        el('div', { class: 'muted', style: 'word-break:keep-all', text: '기숙 남 ' + c.dormMale + ' · 여 ' + c.dormFemale + ' / 석식 학사 ' + c.hallDinner + (c.afterLeaveHallDinner > 0 ? '(퇴실 후 석식 유지 ' + c.afterLeaveHallDinner + ' 포함)' : '') + ' · 일반 ' + c.generalDinner }),
        el('div', { style: 'margin-top:8px;word-break:keep-all', text: (f.vacancy || []).map(function (v) { return v.label + ' 빈 좌석 ' + v.vacant + ' (전체 ' + v.total + '석)'; }).join(' · ') }),
        UI.rowLink({ href: d.appUrl + '?page=mealcount', text: '식수 집계 열기' })
      ]));
    }
    if (f.dorm) {   // 기숙사 빈 자리(남·여) — 방 배정·정원 현황으로 들어가는 입구(C23). 학생 이름 없음
      var dm = f.dorm;
      root.appendChild(el('div', { class: 'card' }, [
        el('h2', { text: '기숙사 빈 자리' }),
        el('div', { class: 'stats', style: 'margin:4px 0 12px' }, [statBox(dm.male.vacant, '남 빈 자리(정원 ' + dm.male.capacity + ')'), statBox(dm.female.vacant, '여 빈 자리(정원 ' + dm.female.capacity + ')')]),
        el('div', { class: 'muted', style: 'word-break:keep-all', text: '기숙 ' + dm.dormCount + '명 · 방 배정 안 됨 ' + dm.unassignedCount + '명' }),
        UI.rowLink({ href: d.appUrl + '?page=rooms&tab=stats', text: '정원 현황판 열기' }),
        UI.rowLink({ href: d.appUrl + '?page=rooms', text: '방 배정 열기' })
      ]));
    }
    if (f.tempLeave && f.tempLeave.n) {   // 복귀 예정일이 지난 건강상 임시 퇴실(결정 77④): 담당교사가 [일반 퇴실로 바꾸기]로 정리한다
      var tk = [el('h2', { text: '복귀 예정일 지남' }), el('div', { style: 'word-break:keep-all', text: '임시 퇴실 중인 학생 ' + f.tempLeave.n + '명의 복귀 예정일이 지났습니다.' })];
      f.tempLeave.list.forEach(function (x) {
        tk.push(el('a', { style: 'display:block;padding:10px 0;border-bottom:1px solid var(--line);color:var(--accent)', href: d.appUrl + '?page=moves&tab=history&student=' + encodeURIComponent(x.studentId), text: x.label + ' · 복귀 예정 ' + x.returnKo + ' (' + x.daysLate + '일 지남)' }));
      });
      if (f.tempLeave.n > f.tempLeave.list.length) tk.push(el('div', { class: 'muted', style: 'margin-top:8px', text: '그 밖에 ' + (f.tempLeave.n - f.tempLeave.list.length) + '명이 더 있습니다.' }));
      tk.push(el('div', { class: 'muted', style: 'margin-top:8px;word-break:keep-all', text: '학생을 눌러 기록에서 [일반 퇴실로 바꾸기]를 누를 수 있습니다. 복귀했다면 입퇴실 신청에서 학사 입실을 기록해 주세요.' }));
      root.appendChild(el('div', { class: UI.cardClass('todo') }, tk));
    }
    var n = f.docMissing || 0;
    var kids = [el('h2', { text: '급식·입퇴실 서류' }),
      el('div', { class: n ? '' : 'muted', text: n ? '서류 미제출 ' + n + '건이 남아 있습니다.' : '서류 미제출 기록이 없습니다.' })];
    (f.docList || []).forEach(function (x) {
      kids.push(el('a', { style: 'display:block;padding:10px 0;border-bottom:1px solid var(--line);color:var(--accent)', href: d.appUrl + '?page=moves&tab=history&student=' + encodeURIComponent(x.studentId) + (x.ymd ? '&date=' + x.ymd : ''), text: x.label + ' ' + x.kind }));
    });
    if (f.docMore) kids.push(el('div', { class: 'muted', style: 'margin-top:8px', text: '그 밖에 ' + f.docMore + '건이 더 있습니다.' }));
    kids.push(UI.rowLink({ href: d.appUrl + '?page=moves&tab=meal', text: '급식 변경 신청' }));
    kids.push(UI.rowLink({ href: d.appUrl + '?page=moves', text: '입퇴실 신청' }));
    kids.push(UI.rowLink({ href: d.appUrl + '?page=batch', text: '학년 일괄 퇴실' }));
    root.appendChild(el('div', { class: UI.cardClass(n ? 'todo' : ''), id: 'docs' }, kids));
    // 식수 집계 화면의 '서류 미제출' 링크(#docs)로 들어오면 서류 카드까지 내린다. Apps Script는 앱이 iframe 안이라 바깥 hash를 getLocation으로 읽는다(없으면 건너뜀)
    try { if (window.google && google.script && google.script.url && google.script.url.getLocation) google.script.url.getLocation(function (l) { if (l && l.hash === 'docs') { var t = document.getElementById('docs'); if (t) t.scrollIntoView(); } }); } catch (e) { /* 스크롤만 못 할 뿐 */ }
  }
  /** 월별 일정 카드(C34, 결정 80): 오늘 일정과 다음 일정. 맨 아래에 붙인다 */
  (function () {
    var base = renderHome;
    renderHome = function (d, root) {
      base(d, root);
      var e = d.events;
      if (!e || e.error) return;
      var md = function (ymd) { return (+ymd.slice(5, 7)) + '월 ' + (+ymd.slice(8, 10)) + '일'; };
      var lines = [];
      e.today.forEach(function (x) { lines.push(el('div', {}, [UI.statusPill('mute', '오늘'), ' ' + x.title + ' (' + x.kind + ')'])); });
      e.next.forEach(function (x) { lines.push(el('div', { class: 'muted' }, [md(x.start) + ' ' + x.title + ' (' + x.kind + ')'])); });
      if (!lines.length) lines.push(el('div', { class: 'muted', text: '오늘과 앞으로 2주 안에 등록된 일정이 없습니다.' }));
      root.appendChild(el('div', { class: 'card' }, [el('h2', { text: '월별 일정' })].concat(lines, [
        UI.rowLink({ href: d.appUrl + '?page=calendar', text: '월별 일정 열기' })])));
    };
  })();
  /** 시설 일지 카드(C35, F10): 오늘 일지 수와 링크. 학사 교사는 오늘 근무일 때만(서버가 판정), 이름은 없다 */
  (function () {
    var base = renderHome;
    renderHome = function (d, root) {
      base(d, root);
      var f = d.facility;
      if (!f || f.error || !f.onDuty) return;
      var kids = [el('h2', { text: '시설 일지' }), el('div', { style: 'margin:8px 0' }, [f.count ? UI.statusPill('todo', '오늘 일지 ' + f.count + '건') : UI.statusPill('mute', '오늘 쓴 일지 없음')]),
        el('div', { class: 'muted', style: 'word-break:keep-all', text: f.isAdmin ? '학생이 쓴 시설 사용 일지와 학생 × 날짜 누적표를 봅니다.' : '오늘 학생들이 말씀드리고 쓴 시설 사용 일지입니다.' }),
        UI.rowLink({ href: d.appUrl + '?page=facilityday', text: '오늘 시설 일지 보기' })];
      if (f.isAdmin) kids.push(UI.rowLink({ href: d.appUrl + '?page=facilityday&tab=stats', text: '누적표 보기' }));
      root.appendChild(el('div', { class: UI.cardClass(f.count ? 'key' : '') }, kids));
    };
  })();
  /** 관리자 홈(D18): 숫자·상태 카드(급식·인원, 기숙사, OUT 기록, 근무표, 서류, 일정, 계정…)를 '현황' 한 장으로 접는다. 맨 위 카드·처리할 것·전체 기능은 그대로 */
  (function () {
    var base = renderHome;
    renderHome = function (d, root) {
      base(d, root);
      var kids = Array.prototype.slice.call(root.children), seen = false, moved = [];
      kids.forEach(function (n) {
        var isCard = n.classList && n.classList.contains('card');
        if (!isCard) return;
        if (!seen) { seen = true; return; }   // 맨 위 카드(전체 현황)
        if (n.classList.contains('todo-list') || n.classList.contains('rail')) return;
        moved.push(n);
      });
      if (!moved.length) return;
      var fold = el('details', { class: 'card fold' }, [el('summary', {}, [el('span', {}, ['현황', el('span', { class: 'muted', text: '급식·인원 · 기숙사 · OUT · 근무표 · 서류 · 일정' })])])]);
      moved.forEach(function (n) { fold.appendChild(n); });
      root.appendChild(fold);
    };
  })();
</script>
