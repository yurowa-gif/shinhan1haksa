<script>
  /** 관리자 홈: 전체 현황 (PRD 8절) */
  function renderHome(d, root) {
    root.appendChild(el('div', { class: 'card' }, [
      el('h2', { text: '전체 현황' }),
      el('div', { class: 'muted', text: d.today + ' · ' + d.termName }),
      el('div', { class: 'stats', style: 'margin-top:12px' }, [
        statBox(d.counts.students, '이번 기간 학사생'),
        statBox(d.counts.allStudents, '등록 학생(전체)'),
        statBox(d.counts.guardianLinks, '학부모 연결')
      ])
    ]));
    var roleStats = el('div', { class: 'stats' });
    Object.keys(d.roleCounts).forEach(function (k) { roleStats.appendChild(statBox(d.roleCounts[k], k)); });
    root.appendChild(el('div', { class: 'card' }, [el('h2', { text: '계정(활성)' }), roleStats]));
    root.appendChild(soonCard('학사·기숙·조식·석식 인원, 공석', '2단계(F6·F7)에서 채웁니다.'));
    root.appendChild(soonCard('2OUT 대상', '2단계(F4)에서 채웁니다.'));
    root.appendChild(el('div', { class: 'card' }, [
      el('h2', { text: '운영 기간' }),
      el('div', { class: 'muted', text: '학기·방학 기간을 추가하고 고칩니다.' }),
      el('a', { class: 'btn', style: 'margin-top:12px', href: d.appUrl + '?page=terms', text: '운영 기간 열기' })
    ]));
    root.appendChild(el('div', { class: 'card' }, [
      el('h2', { text: '명단 올리기' }),
      el('div', { class: 'muted', text: '시트에서 복사한 명단(또는 CSV)을 붙여넣어 형식을 확인합니다. 저장은 다음 단계에서 붙습니다.' }),
      el('a', { class: 'btn', style: 'margin-top:12px', href: d.appUrl + '?page=roster', text: '명단 올리기 열기' })
    ]));
    root.appendChild(el('div', { class: 'card' }, [
      el('h2', { text: '자습 일정·블록' }),
      el('div', { class: 'muted', text: '날짜별 운영 여부·시작·종료와 요일 유형별 출석 블록을 정합니다.' }),
      el('a', { class: 'btn', style: 'margin-top:12px', href: d.appUrl + '?page=schedule', text: '자습 일정 열기' })
    ]));
    root.appendChild(el('div', { class: 'card' }, [
      el('h2', { text: '사전 특이사항' }),
      el('div', { class: 'muted', text: '병결·가정사유·학원 등을 입력하고 담임·담당교사의 요청을 확정합니다.' }),
      el('a', { class: 'btn', style: 'margin-top:12px', href: d.appUrl + '?page=exceptions', text: '특이사항 열기' })
    ]));
    root.appendChild(el('div', { class: 'card' }, [
      el('h2', { text: '좌석표' }),
      el('div', { class: 'muted', text: '공간·좌석 격자를 그리고 학생을 자리에 앉힙니다.' }),
      el('a', { class: 'btn', style: 'margin-top:12px', href: d.appUrl + '?page=seats', text: '좌석표 열기' })
    ]));
    root.appendChild(soonCard('계정, 설정', '1단계부터 차례로 추가합니다.'));
  }
</script>
