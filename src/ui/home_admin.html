<script>
  /** 2단계 A 카드(CODING-A: 근무·OUT·면담). 이 함수의 몸통만 고친다(docs/plan/stage2.md 1절) */
  function renderStage2A(d, root) {
    if (d.out && d.out.canRecord) {
      root.appendChild(el('div', { class: 'card' }, [
        el('h2', { text: 'OUT 기록' }),
        el('div', { class: 'muted', text: '오늘 적발한 학생의 OUT을 30초 안에 기록합니다.' }),
        el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap;margin:8px 0' }, [
          UI.statusPill('out1', '1OUT ' + (d.out.out1 || 0) + '명'), UI.statusPill('out2', '퇴실 대상 ' + (d.out.out2 || 0) + '명'), UI.statusPill('mute', '오늘 ' + (d.out.today || 0) + '건')]),
        d.out.targets && d.out.targets.n ? el('a', { class: 'notice warn', style: 'display:block;margin:8px 0;text-decoration:none', href: d.appUrl + '?page=outs&tab=dismiss',
          text: '2OUT 대상 ' + d.out.targets.n + '명 · 면담 필요 ' + d.out.targets.need + ' · 확정 가능 ' + d.out.targets.ready }) : null,
        el('a', { class: 'btn', style: 'margin-top:4px', href: d.appUrl + '?page=outs&tab=record', text: 'OUT 기록하기' }),
        el('a', { class: 'btn secondary', style: 'margin:4px 0 0 8px', href: d.appUrl + '?page=outs&tab=term', text: (d.out.periodWord === '이번 기간' ? '이번 기간 보기' : '이번 학기 보기') })
      ]));
    }
    var x = d.duty;
    if (!x) return;
    if (x.error) { root.appendChild(el('div', { class: 'card' }, [el('h2', { text: '근무표' }), el('div', { class: 'muted', text: x.error })])); return; }
    // 승인된 시안: "N월 근무표" 카드 — 빈 날·이번 달 교대, 빈 날 2~3개(날짜·조), [근무 편성하기]
    // 라벨은 낱말 중간에서 끊기지 않게 두 줄로 나눠 쓴다
    function emptyBox(n) {
      var b = statBox(n, '');
      var l = b.querySelector('.l'); l.style.wordBreak = 'keep-all'; l.appendChild(el('div', { text: '남은 빈 날' })); l.appendChild(el('div', { text: '(편성이 덜 된 날)' }));
      return b;
    }
    var openText = x.open.map(function (o) { return (+o.date.slice(5, 7)) + '월 ' + (+o.date.slice(8, 10)) + '일(' + o.weekdayKo + ') ' + o.labels.join('·'); }).join(', ');
    var c = el('div', { class: 'card' }, [
      el('h2', { text: (+x.month.slice(5, 7)) + '월 근무표' }),
      el('div', { class: 'stats', style: 'margin:4px 0 12px' }, [emptyBox(x.emptyDays), statBox(x.swapCount, '이번 달 교대')]),
      el('div', { class: 'muted', text: x.open.length ? '남은 빈 날: ' + openText + (x.emptyDays > x.open.length ? ' 외 ' + (x.emptyDays - x.open.length) + '일' : '') : '비어 있는 날이 없습니다.' }),
      el('a', { class: 'btn', style: 'margin-top:12px', href: d.appUrl + '?page=duty', text: '근무 편성하기' })
    ]);
    root.appendChild(c);
  }

  /** 관리자 홈: 전체 현황 (PRD 8절) */
  function renderHome(d, root) {
    root.appendChild(el('div', { class: 'card' }, [
      el('h2', { text: '전체 현황' }),
      el('div', { class: 'muted', text: d.today + ' · ' + d.termName }),
      el('div', { class: 'stats', style: 'margin-top:12px' }, [
        statBox(d.counts.students, '이번 기간 학사생'),
        statBox(d.counts.allStudents, '등록 학생(전체)'),
        statBox(d.counts.guardianLinks, '학부모 연결')
      ])
    ]));
    var roleStats = el('div', { class: 'stats' });
    Object.keys(d.roleCounts).forEach(function (k) { roleStats.appendChild(statBox(d.roleCounts[k], k)); });
    root.appendChild(el('div', { class: 'card' }, [el('h2', { text: '계정(활성)' }), roleStats]));
    try { renderStage2B(d, root); } catch (e) { showError(root, e); }   // 2단계 카드가 실패해도 나머지 카드는 그린다
    try { renderStage2A(d, root); } catch (e) { showError(root, e); }
    root.appendChild(el('div', { class: 'card' }, [
      el('h2', { text: '운영 기간' }),
      el('div', { class: 'muted', text: '학기·방학 기간을 추가하고 고칩니다.' }),
      el('a', { class: 'btn', style: 'margin-top:12px', href: d.appUrl + '?page=terms', text: '운영 기간 열기' })
    ]));
    root.appendChild(el('div', { class: 'card' }, [
      el('h2', { text: '명단 올리기' }),
      el('div', { class: 'muted', text: '시트에서 복사한 명단(또는 CSV)을 붙여넣어 형식을 확인합니다. 저장은 다음 단계에서 붙습니다.' }),
      el('a', { class: 'btn', style: 'margin-top:12px', href: d.appUrl + '?page=roster', text: '명단 올리기 열기' })
    ]));
    root.appendChild(el('div', { class: 'card' }, [
      el('h2', { text: '자습 일정·블록' }),
      el('div', { class: 'muted', text: '날짜별 운영 여부·시작·종료와 요일 유형별 출석 블록을 정합니다.' }),
      el('a', { class: 'btn', style: 'margin-top:12px', href: d.appUrl + '?page=schedule', text: '자습 일정 열기' })
    ]));
    root.appendChild(el('div', { class: 'card' }, [
      el('h2', { text: '사전 특이사항' }),
      el('div', { class: 'muted', text: '병결·가정사유·학원 등을 입력하고 담임·담당교사의 요청을 확정합니다.' }),
      el('a', { class: 'btn', style: 'margin-top:12px', href: d.appUrl + '?page=exceptions', text: '특이사항 열기' })
    ]));
    root.appendChild(el('div', { class: 'card' }, [
      el('h2', { text: '출석부' }),
      el('div', { class: 'muted', text: '날짜를 고르면 그날 출석부를 미리 보고 PDF로 받습니다.' }),
      el('a', { class: 'btn', style: 'margin-top:12px', href: d.appUrl + '?page=sheet', text: '출석부 열기' })
    ]));
    root.appendChild(el('div', { class: 'card' }, [
      el('h2', { text: '좌석표' }),
      el('div', { class: 'muted', text: '공간·좌석 격자를 그리고 학생을 자리에 앉힙니다.' }),
      el('a', { class: 'btn', style: 'margin-top:12px', href: d.appUrl + '?page=seats', text: '좌석표 열기' })
    ]));
    root.appendChild(soonCard('계정, 설정', '1단계부터 차례로 추가합니다.'));
  }

  /** 2단계 B 카드(CODING-B: 입퇴실·급식·서류). 이 함수의 몸통만 고친다(docs/plan/stage2.md 1절) */
  function renderStage2B(d, root) {
    return;
  }
</script>
