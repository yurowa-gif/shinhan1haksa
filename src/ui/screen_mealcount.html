<script>
  /** 식수 집계 화면(F7-2, 관리자). 숫자는 서버(getMealCounts)가 센 것만 보인다. 신청 기준 인원이다(결석·외박 반영 안 함). */
  function renderScreen(root) {
    var U = UI.util;
    var date = window.SCREEN_DATE || '', split = false, seq = 0, busy = false, data = null;
    var head = el('div'), tableBox = el('div'), notes = el('div');
    root.appendChild(head); root.appendChild(tableBox); root.appendChild(notes);
    var pdfBtn = null;
    function fail(err) { UI.toast((err && err.message) || String(err), { kind: 'warn', ms: 5000 }); }
    var reqDate = date, loading = true, bar = null, pdfBtn = null, xlsxBtn = null;
    function shift(n) { if (!reqDate) return;   // 첫 불러오기 전(날짜 모름)에는 이동하지 않는다
      var d = new Date(reqDate + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); load(d.toISOString().slice(0, 10)); }
    var XLSX_MIME = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
    function b64Blob(b64, mime) {
      var bin = atob(b64); var arr = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return new Blob([arr], { type: mime || 'application/pdf' });
    }

    function load(d) {
      var mine = ++seq;
      if (d) reqDate = d;
      loading = true; draw();
      call('getMealCounts', reqDate || '').then(function (r) { if (mine !== seq) return; data = r; reqDate = r.date; date = r.date; loading = false; draw(); })
        .catch(function (err) { if (mine !== seq) return; loading = false; data = null; draw(); showError(tableBox, err); if (!/권한/.test((err && err.message) || '')) tableBox.appendChild(el('button', { type: 'button', class: 'btn secondary', style: 'margin-top:8px', text: '다시 불러오기', onclick: function () { load(reqDate); } })); });
    }

    function syncBar() { var off = busy || loading || !data || !data.term; if (pdfBtn) { pdfBtn.disabled = off; pdfBtn.textContent = busy === 'pdf' ? 'PDF 만드는 중…' : '급식실 양식으로 출력'; } if (xlsxBtn) { xlsxBtn.disabled = off; xlsxBtn.textContent = busy === 'xlsx' ? '엑셀 만드는 중…' : '엑셀로 받기'; } }

    function draw() {
      clear(head); clear(tableBox); clear(notes);
      var arrow = function (text, n) { return el('button', { type: 'button', class: 'btn secondary', style: 'flex:0 0 auto', 'aria-label': n < 0 ? '전날' : '다음 날', text: text, onclick: function () { shift(n); } }); };
      var title = loading || !data ? (UI.util.formatDateKo(reqDate, false) || (reqDate ? reqDate : '오늘')) : data.dateKo;
      head.appendChild(el('div', { style: 'display:flex;align-items:center;gap:8px;margin-bottom:4px' }, [arrow('‹', -1),
        el('b', { style: 'flex:1;text-align:center', text: title }), arrow('›', 1)]));
      if (!bar) { bar = UI.actionBar([{ text: '급식실 양식으로 출력', onclick: function () { onFile('getMealCountsPdf', 'application/pdf', 'PDF', 'pdf'); } }, { kind: 'secondary', text: '엑셀로 받기', onclick: function () { onFile('getMealCountsXlsx', XLSX_MIME, '엑셀', 'xlsx'); } }], { mount: true }); var bs = bar.querySelectorAll('button'); pdfBtn = bs[0]; xlsxBtn = bs[1]; }
      syncBar();
      if (loading || !data) { head.appendChild(el('div', { class: 'muted', style: 'text-align:center;margin-bottom:12px', text: loading ? '불러오는 중…' : '' })); return; }
      if (!data.term) {
        head.appendChild(el('div', { class: 'muted', style: 'text-align:center;margin-bottom:12px', text: data.message || '운영 기간이 아닙니다.' }));
        docLines(true);
        return;
      }
      head.appendChild(el('div', { class: 'muted', style: 'text-align:center;margin-bottom:12px', text: data.term.name + ' · ' + (data.operating ? '이 날 자습 운영' : '이 날은 자습 운영 안 함(참고)') }));
      head.appendChild(UI.segmented({ label: '석식', options: [{ value: 'sum', label: '석식 합계' }, { value: 'split', label: '석식 나눠 보기' }], value: split ? 'split' : 'sum',
        onchange: function (v) { split = v === 'split'; draw(); } }));
      // 석식 합계 보기는 360px에서 옆으로 밀지 않도록 비기숙 칸을 뺀다(나눠 보기에서 확인).
      var heads = split ? ['학년·성별', '학사', '기숙', '비기숙', '조식', '석식 학사', '석식 일반'] : ['학년·성별', '학사', '기숙', '조식', '석식'];
      var isTotal = function (k) { return / 합계$|^전체$|학년$/.test(k) && k !== '' && !/^[여남]\d/.test(k); };
      var tbody = el('tbody', {}, data.rows.map(function (r) {
        var vals = [r.hall, r.dorm, r.nonDorm, r.breakfast, r.hallDinner, r.generalDinner].map(Number);
        var show = split ? vals : [vals[0], vals[1], vals[3], vals[4] + vals[5]];
        return el('tr', { class: isTotal(r.key) ? 'total' : '' }, [el('th', { scope: 'row', text: r.key })].concat(show.map(function (v) { return el('td', { text: String(v) }); })));
      }));
      var thead = el('thead', {}, [el('tr', {}, heads.map(function (h) { return el('th', { scope: 'col', text: h }); }))]);
      tableBox.appendChild(el('div', { class: 'tablewrap' }, [el('table', { class: 'data' + (split ? '' : ' compact') }, [thead, tbody])]));
      if (split) notes.appendChild(el('div', { class: 'muted', style: 'margin:-4px 0 12px', text: '표는 옆으로 밀 수 있습니다(첫 열은 고정).' }));
      notes.appendChild(el('div', { class: 'notice info', style: 'word-break:keep-all', text: '신청 기준 인원입니다(결석·외박은 반영하지 않습니다).' }));
      notes.appendChild(el('div', { class: 'card', style: 'word-break:keep-all' }, [
        el('div', { style: 'display:flex;justify-content:space-between;gap:12px' }, [el('span', { text: '퇴실 후 석식 유지' }), el('b', { style: 'flex:0 0 auto', text: data.afterLeaveHallDinner + '명' })]),
        el('div', { class: 'muted', text: '학사 퇴실했지만 석식 중단일 전이라 학사 석식에 포함됩니다.' })
      ]));
      docLines(false);
      if (data.unknown.length) notes.appendChild(el('div', { class: 'notice warn', text: '성별·학년을 알 수 없어 어느 줄에도 넣지 않은 학생 ' + data.unknown.length + '명: ' + data.unknown.map(function (u) { return u.name; }).join(', ') + '. 명단 올리기에서 고쳐 주세요.' }));
      data.warnings.forEach(function (w) { notes.appendChild(el('div', { class: 'notice warn', text: w })); });
    }

    function docLines(onlyDocs) {
      var back = document.querySelector('a.back');
      var n = Number(data.docRows) || 0;
      var box = el('div', { class: 'card', style: 'word-break:keep-all' }, [
        el('div', { style: 'display:flex;justify-content:space-between;gap:12px' }, [el('span', { text: '아직 서류가 없는 신청' }), el('b', { style: 'flex:0 0 auto', text: n + '건' })]),
        el('div', { class: 'muted', text: '전체 기준이며 날짜와 무관합니다. 인원에는 이미 포함되어 있습니다. 이름은 처음 화면의 서류 카드에서 봅니다.' })
      ]);
      if (back && n) box.appendChild(el('a', { href: back.href.split('#')[0] + '#docs', style: 'display:inline-flex;align-items:center;min-height:44px;margin-top:4px;color:var(--accent)', text: '서류 미제출 ' + n + '건 ▸' }));
      notes.appendChild(box);
    }

    function onFile(fn, mime, ko, kind) {
      if (busy || loading || !data || !data.term) return;
      busy = kind; syncBar();
      var mine = seq;
      call(fn, data.date).then(function (r) {
        busy = false; syncBar();
        if (mine !== seq) { UI.toast('날짜가 바뀌어 이 ' + ko + ' 파일은 쓰지 않았습니다. 다시 눌러 주세요.', { kind: 'warn', ms: 5000 }); return; }
        if (!r.ok) { UI.toast(r.error || ko + ' 파일을 만들지 못했습니다.', { kind: 'warn', ms: 5000 }); return; }
        var a = el('a', { class: 'btn', href: URL.createObjectURL(b64Blob(r.base64, mime)), download: r.name, text: r.name + ' 열기' });
        var old = notes.querySelector('a.btn'); if (old) old.remove();
        notes.appendChild(a); a.click();
        UI.toast(ko + ' 파일을 만들었습니다. 받아지지 않으면 아래 링크를 누르세요.', { kind: 'ok', ms: 5000 });
      }).catch(function (err) { busy = false; syncBar(); fail(err); });
    }
    load(date);
  }
</script>
