<style>
  .mv-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .mv-row .mv-text { flex: 1 1 auto; min-width: 0; }
  .mv-row .btn { flex: 0 0 auto; white-space: nowrap; }
  .mv-date { font-size: var(--font-xl); font-weight: 700; }
</style>
<script>
  /**
   * 입퇴실·급식 화면(2단계, CODING-B). [입퇴실](F6-1, C18a) · [급식 변경](F7-1) · [학생 기록](C17b).
   * 날짜·이유·취소할 행은 서버(previewMealChange)가 계산한 것만 보여 준다. docs/design/screens.md F7-1.
   */
  function renderMealTab(root) {
    var U = UI.util;
    var alive = true;   // 탭을 떠난 뒤 늦게 온 응답이 화면·아래 바를 다시 그리지 않게
    var ctx = null, picked = null, chip = '', doc = false, fixing = false, seq = 0, timer = null, last = null, busy = false;
    var body = el('div');
    root.appendChild(body);
    var bar = null;
    function fail(err) { UI.toast((err && err.message) || String(err), { kind: 'warn', ms: 5000 }); }
    function removeBar() { if (bar) { bar.remove(); bar = null; var m = document.querySelector('main'); if (m) m.classList.remove('has-actionbar'); } }

    call('getMealContext').then(function (c) { if (!alive) return; ctx = c; draw(); }).catch(function (err) { if (!alive) return; clear(body); showError(body, err); });
    return function () { alive = false; clearTimeout(timer); removeBar(); };   // 탭을 바꿀 때 아래 바를 치우고 늦은 응답을 버린다

    function draw() {
      resetState();   // 다시 그릴 때마다 이전 선택·서류 체크를 비운다(저장 왕복 중에 누른 것이 새 화면에 몰래 남지 않게)
      clear(body); removeBar();
      body.appendChild(el('h2', { text: (ctx.term ? ctx.term.name + ' · ' : '') + '급식 변경' }));
      if (!ctx.canEdit) {
        body.appendChild(el('div', { class: 'notice info', text: '급식 변경은 담당교사와 관리자만 신청합니다. 이 화면에서는 볼 수만 있습니다.' }));
        return;
      }
      if (!ctx.students.length) { body.appendChild(UI.emptyState('신청할 수 있는 학생이 없습니다. 이번 운영 기간 명단과 담당교사를 확인해 주세요.')); return; }

      var status = el('div', { class: 'muted' });
      var picker = UI.studentPicker({ students: ctx.students, label: '학생', onpick: function (s) {
        picked = s; status.textContent = s ? '지금: ' + ['학사', '기숙사', '조식', '석식'].map(function (k) { return k + ' ' + (s.status[k] || '없음'); }).join(' · ') : '';
        refresh();
      } });
      body.appendChild(el('div', { class: 'card' }, [picker, status]));

      var chips = el('div', { class: 'chips' });
      function drawChips() {
        clear(chips);
        ctx.chips.forEach(function (c) {
          chips.appendChild(el('button', { type: 'button', class: c.id === chip ? 'chip on' : 'chip', text: c.label, onclick: function () { chip = c.id; drawChips(); refresh(); } }));
        });
      }
      drawChips();
      body.appendChild(el('div', { class: 'card' }, [UI.field('무엇을', chips)]));

      var at = el('input', { type: 'datetime-local', value: ctx.now.slice(0, 16), max: ctx.now.slice(0, 16) });
      var atTouched = false;
      at.addEventListener('change', function () { atTouched = true; refresh(); });
      body.appendChild(el('div', { class: 'card' }, [UI.field('신청 일시', at, { hint: '기본값은 지금입니다. ' + ctx.cutoff + ' 규칙에 쓰이므로 서류의 시각과 다르면 고쳐 주세요.' })]));

      var result = el('div');
      var fixBox = el('div');
      var reasonInput = el('input', { type: 'text', maxlength: '100' });
      var reasonField = UI.field('사유(꼭 적어 주세요)', reasonInput);
      var dateField = UI.dateField({ label: '적용일(고침)', value: '', onchange: function () { refresh(); } });
      reasonInput.addEventListener('input', refresh);
      var fixBtn = el('button', { type: 'button', class: 'btn secondary', text: '고치기', onclick: function () {
        fixing = !fixing; fixBtn.textContent = fixing ? '자동으로' : '고치기';
        if (fixing && last && last.date) dateField.setValue(last.date);
        drawFix(); refresh();
      } });
      function drawFix() {
        clear(fixBox);
        if (fixing) { fixBox.appendChild(dateField); fixBox.appendChild(reasonField); }
      }
      var dateText = el('div', { class: 'mv-text' });
      body.appendChild(el('div', { class: 'card' }, [
        el('h2', { text: '적용일' }),
        el('div', { class: 'mv-row' }, [dateText, fixBtn]),
        result, fixBox
      ]));

      var docBox = el('input', { type: 'checkbox' });
      docBox.addEventListener('change', function () { doc = docBox.checked; drawDoc(); });
      var docWarn = el('div');
      function drawDoc() { clear(docWarn); if (!doc) docWarn.appendChild(el('div', { class: 'notice warn', text: '서류 미제출로 기록됩니다. 담당교사 홈에 남습니다.' })); }
      drawDoc();
      body.appendChild(el('div', { class: 'card' }, [el('label', { class: 'check' }, [docBox, el('span', { text: '학교 서류 제출함' })]), docWarn]));

      function payload() {
        return { studentId: picked ? picked.id : '', chip: chip, requestedAt: at.value ? at.value + ':00' : '', effectiveDate: fixing ? dateField.getValue() : '',
          reason: fixing ? reasonInput.value.trim() : '', docSubmitted: doc };
      }
      function drawResult() {
        clear(result); clear(dateText);
        var p = last;
        if (!p) { dateText.appendChild(el('span', { class: 'muted', text: picked && chip ? '적용일을 계산하는 중…' : '학생과 무엇을 바꿀지 고르면 적용일이 나옵니다.' })); return; }
        if (p.errors && p.errors.length) p.errors.forEach(function (e) { result.appendChild(el('div', { class: 'notice warn', text: e.message })); });
        if (p.blocked) { dateText.appendChild(el('span', { class: 'muted', text: '신청할 수 없습니다' })); result.appendChild(el('div', { class: 'notice warn', text: p.blocked })); return; }
        if (!p.date && !p.superseded) { dateText.appendChild(el('span', { class: 'muted', text: '신청할 수 없습니다' })); return; }   // 사유는 아래 안내에 있다
        dateText.appendChild(el('span', { class: 'mv-date', text: p.superseded ? '적용되지 않음' : p.dateKo }));
        if (!p.superseded) result.appendChild(el('div', { class: 'notice info', text: p.reasonText }));
        (p.warnings || []).forEach(function (w) { result.appendChild(el('div', { class: 'notice warn', text: w })); });
        if (p.cancel && p.cancel.length) result.appendChild(el('div', { class: 'muted', text: '대체되어 취소되는 대기 신청: ' + p.cancel.map(function (c) { return U.formatDateKo(c.date, false) + ' ' + c.value; }).join(', ') }));
        if (p.followUps && p.followUps.length) result.appendChild(el('div', { class: 'muted', text: '함께 기록: ' + p.followUps.map(function (f) { return U.formatDateKo(f.date, false) + ' ' + f.item + ' ' + f.value; }).join(', ') }));
      }
      function drawBar() {
        removeBar();
        var p = last;
        var ready = !!(picked && chip && p && !(p.errors && p.errors.length) && !p.blocked && (p.date || p.superseded) && !busy);
        bar = UI.actionBar([
          { text: '비우기', kind: 'secondary', onclick: reset },
          { text: p && p.superseded ? '기록으로 저장' : '변경 신청', disabled: !ready, onclick: confirmSave }
        ], { mount: true });
      }
      function refresh(retried) {
        var mine = ++seq;   // 학생을 비우는 경우에도 진행 중인 미리보기·예약을 무효로 한다
        clearTimeout(timer);
        last = null; drawResult(); drawBar();
        if (!picked || !chip) return;
        timer = setTimeout(function () {
          call('previewMealChange', payload()).then(function (p) {
            if (!alive || mine !== seq) return;
            // 신청 일시를 건드리지 않았으면 서버의 지금으로 맞춘다(화면을 오래 열어 둔 뒤 저장해도 옛 시각이 되지 않게)
            if (!atTouched && p.now && p.now.slice(0, 16) !== at.value && retried !== true) { at.value = p.now.slice(0, 16); at.max = at.value; refresh(true); return; }
            last = p; drawResult(); drawBar();
          }).catch(function (err) { if (alive && mine === seq) fail(err); });
        }, 250);
      }
      function confirmSave() {
        var p = last, label = p.label;
        UI.confirmSheet({
          title: p.superseded ? '신청서를 기록으로 저장합니다' : '급식 변경을 저장합니다',
          lead: p.superseded ? '적용되지 않는 신청서(기록만 남김)' : p.dateKo + '부터 ' + label,
          lines: [U.studentLabel(picked) + ' · ' + label, p.superseded ? '더 새 신청이 먼저 적용되어 값은 바뀌지 않습니다' : p.reasonText]
            .concat((p.cancel || []).length ? ['대체되어 취소되는 대기 신청: ' + p.cancel.map(function (c) { return U.formatDateKo(c.date, false) + ' ' + c.value; }).join(', ')] : [])
            .concat(doc ? [] : ['서류 미제출로 기록됩니다']),
          confirmText: p.superseded ? '기록으로 저장' : '변경 신청',
          onconfirm: function () {
            busy = true; drawBar();
            call('saveMealChange', payload(), p.expect).then(function (r) {
              if (r.ok) UI.toast(r.duplicate ? '이미 저장된 신청서입니다.' : r.superseded ? '기록으로 저장했습니다.' : r.dateKo + '부터 ' + r.label + '(으)로 저장했습니다.');   // 다른 탭으로 옮긴 뒤 와도 결과는 알린다
              if (!alive) return;
              if (r.stale) { busy = false; UI.toast(r.error, { kind: 'warn', ms: 5000 }); refresh(); return; }
              if (!r.ok) { busy = false; UI.toast((r.errors && r.errors[0] && r.errors[0].message) || r.blocked || '저장하지 못했습니다.', { kind: 'warn', ms: 5000 }); refresh(); return; }
              resetState();   // 다음 학생에게 이전 학생의 선택·서류 체크가 남지 않게 모두 비운다
              window.scrollTo(0, 0);
              // 다시 불러오는 동안은 busy를 유지한다(그 사이 눌린 버튼이 빈 학생으로 저장되지 않게)
              call('getMealContext').then(function (c) { if (alive) { busy = false; ctx = c; draw(); } })
                .catch(function (err) { if (alive) { busy = false; draw(); UI.toast('저장했습니다. 화면을 다시 불러오지 못했습니다. 새로고침해 주세요.', { kind: 'warn', ms: 6000 }); } });
            }).catch(function (err) { if (!alive) return; busy = false; drawBar(); fail(err); });
          }
        });
      }
      function resetState() { picked = null; chip = ''; doc = false; fixing = false; last = null; seq++; clearTimeout(timer); }
      function reset() { resetState(); draw(); }
      drawResult(); drawBar();
    }
  }

  /** [학생 기록] 탭: 학생을 고르면 오늘 값·비고·대기·기록. 서류 미제출 행은 그 행의 담당교사·관리자가 [제출 표시] */
  function renderRecordTab(root, wantStudent) {
    var pick = el('div'), out = el('div');
    root.appendChild(pick); root.appendChild(out);
    var alive = true, seq = 0, current = '', currentYmd = '', saving = false;
    function fail(err) { UI.toast((err && err.message) || String(err), { kind: 'warn', ms: 5000 }); }
    call('getMealContext').then(function (ctx) {
      if (!alive) return;
      if (!ctx.viewStudents.length) { pick.appendChild(UI.emptyState('볼 수 있는 학생이 없습니다.')); return; }
      var picker = UI.studentPicker({ students: ctx.viewStudents, label: wantStudent ? '다른 학생 보기' : '학생', onpick: function (s) { if (s) load(s.id, s.ymd || ''); else { seq++; current = ''; currentYmd = ''; clear(out); } } });   // ymd = 다음·막 끝난 기간에만 등록된 학생의 기간 안 날짜
      pick.appendChild(el('div', { class: 'card' }, [picker]));
      if (wantStudent) load(wantStudent, window.SCREEN_DATE || '');   // 홈 카드에서 학생을 눌러 들어오면 그 학생의 기록을 그 기록의 기간 기준으로 바로 연다
    }).catch(function (err) { if (alive) showError(pick, err); });

    function line(h, name) {
      var what = h.what;
      var left = el('div', { class: 'mv-text' }, [
        el('div', { text: (h.status === '취소' ? '(취소) ' : '') + what + ' · ' + h.dateKo + '부터' }),
        el('div', { class: 'muted', text: [h.requestedKo ? '신청 ' + h.requestedKo : '', h.sourceLabel, h.edited ? '적용일 고침' + (h.reason ? '(' + h.reason + ')' : '') : h.reason].filter(function (x) { return x; }).join(' · ') }),
        h.status === '취소' && h.cancelText ? el('div', { class: 'muted', text: h.cancelText }) : null
      ]);
      var right = null;
      if (h.canMarkDoc) {
        right = el('button', { type: 'button', class: 'btn secondary', text: '제출 표시', onclick: function (e) {
          var btn = e.currentTarget;
          UI.confirmSheet({ title: '서류를 받았습니까?', lead: name + ' · ' + what, lines: [h.dateKo + '부터 적용되는 신청의 서류를 제출로 표시합니다(되돌리지 않습니다)'], confirmText: '제출 표시', onconfirm: function () {
            if (saving) { UI.toast('저장 중입니다. 잠시 기다려 주세요.', { kind: 'info' }); return; }
            saving = true; btn.disabled = true;
            call('setDocSubmitted', h.id).then(function (r) { saving = false; if (!alive) return; if (!r.ok) fail(new Error(r.error)); else UI.toast('제출로 표시했습니다.'); if (current) load(current, currentYmd); })
              .catch(function (err) { saving = false; btn.disabled = false; fail(err); });
          } });
        } });
      } else if (h.docState === 'missing') right = UI.statusPill('todo', '서류 미제출');
      else if (h.docState === 'done') right = UI.statusPill('mute', '서류 제출');
      if (h.canCancelMove) {   // 퇴실 취소: 같이 취소·되살아나는 것과 경고를 서버가 계산해 확인 시트에 그대로 보인다
        var cb = el('button', { type: 'button', class: 'btn secondary', style: 'flex:0 0 auto;white-space:nowrap', text: '퇴실 취소', onclick: function (e) { cancelSheet(h, name, e.currentTarget); } });
        right = right ? el('div', { style: 'display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex:0 0 auto' }, [right, cb]) : cb;
      }
      return el('div', { class: 'mv-row', style: 'padding:8px 0;border-bottom:1px solid var(--line)' }, [left, right]);
    }
    function cancelSheet(h, name, btn) {
      if (saving) { UI.toast('저장 중입니다. 잠시 기다려 주세요.', { kind: 'info' }); return; }
      btn.disabled = true;
      call('previewCancelMove', h.id).then(function (p) {
        btn.disabled = false;
        if (!alive) return;
        if (!p.ok) { UI.toast((p.errors && p.errors[0] && p.errors[0].message) || '취소할 수 없습니다.', { kind: 'warn', ms: 5000 }); return; }
        var area = el('textarea', { maxlength: '200' });
        var field = UI.field('취소 사유', area, { hint: '2자 이상 적어 주세요. 사유는 기록에 남습니다.' });
        var body = [el('p', { class: 'sheet-lead', text: p.lead }), el('div', { class: 'muted', text: name })];
        if (p.lines.length) body.push(el('ul', { class: 'list' }, p.lines.map(function (t) { return el('li', { text: t }); })));
        (p.warnings || []).forEach(function (w) { body.push(el('div', { class: 'notice warn', style: 'word-break:keep-all', text: w })); });
        // 퇴실 중이라 막혔던(저장되지 않은) 급식 신청서는 행이 없어 되살아나지 않는다 — 필요하면 다시 입력한다(followups 33)
        body.push(el('div', { class: 'notice info', style: 'word-break:keep-all', text: '퇴실 중이라 막혔던 급식 신청서는 되살아나지 않습니다. 필요하면 다시 입력해 주세요.' }));
        body.push(field);
        var sheet = UI.bottomSheet({ title: '퇴실을 취소합니다', content: el('div', {}, body), actions: [
          { text: '닫기', kind: 'secondary', onclick: function () { sheet.close(); } },
          { text: '퇴실 취소', kind: 'danger', disabled: true, onclick: function () {
            var why = area.value.trim(); if (why.length < 2 || saving) return;
            sheet.close(); saving = true;
            call('cancelMove', h.id, why, p.expect).then(function (r) {
              saving = false;
              if (r.ok) UI.toast(r.already ? '이미 취소된 기록입니다.' : '퇴실을 취소했습니다.');
              else UI.toast((r.stale ? r.error : (r.errors && r.errors[0] && r.errors[0].message)) || '취소하지 못했습니다.', { kind: 'warn', ms: 5000 });
              if (alive && current) load(current, currentYmd);
            }).catch(function (err) { saving = false; fail(err); });
          } }] });
        area.addEventListener('input', function () { sheet.buttons[1].disabled = area.value.trim().length < 2; });
        sheet.open();
      }).catch(function (err) { btn.disabled = false; fail(err); });
    }
    function load(id, ymd) {
      current = id; currentYmd = ymd || '';
      var mine = ++seq;
      clear(out); out.appendChild(el('div', { class: 'muted', text: '기록을 불러오는 중입니다…' }));
      call('listStudentStatus', id, currentYmd).then(function (d) {
        if (!alive || mine !== seq) return;   // 학생을 빨리 바꾸면 늦은 응답은 버린다(다른 학생 기록·버튼이 그려지지 않게)
        var name = UI.util.studentLabel(d.student);
        clear(out);
        out.appendChild(el('div', { class: 'card' }, [
          el('h2', { text: name }),
          el('div', { text: '오늘: ' + ['학사', '기숙사', '조식', '석식'].map(function (k) { return k + ' ' + (d.now[k] || '없음'); }).join(' · ') }),
          d.remark ? el('div', { class: 'muted', style: 'margin-top:8px', text: '비고: ' + d.remark }) : null
        ]));
        out.appendChild(el('div', { class: 'card' }, [el('h2', { text: '대기 중인 변경' })].concat(d.pending.length ? d.pending.map(function (h) { return line(h, name); }) : [el('div', { class: 'muted', text: '없습니다.' })])));
        out.appendChild(el('div', { class: 'card' }, [el('h2', { text: '기록' })].concat(d.history.length ? d.history.map(function (h) { return line(h, name); }) : [el('div', { class: 'muted', text: '기록이 없습니다.' })])));
      }).catch(function (err) { if (!alive || mine !== seq) return; clear(out); showError(out, err); });
    }
    return function () { alive = false; seq++; };
  }

  /**
   * [입퇴실] 탭(F6-1). 학생 → 유형(그 학생 상태로 가능한 것, 기숙사생의 "학사 퇴실"은 꺼 둠) → 신청 일시 → 적용일 → 급식 정리 → 사유·서류.
   * 날짜·바뀌는 것은 서버(previewMove)가 계산한 것만 보여 준다. 필수 선택(유형·석식)이 남으면 저장 버튼이 꺼져 있다.
   */
  function renderMoveTab(root, prefillId) {
    var U = UI.util;
    var alive = true, typeSeq = 0;   // 탭을 떠난 뒤 늦게 온 응답·예약이 화면·아래 바를 다시 만들지 않게
    var ctx = null, picked = null, mctx = null, type = '', dinner = '', doc = false, breakfastOn = true, last = null, seq = 0, timer = null, busy = false, atTouched = false, meals = null;   // meals = 재입실 급식 선택(학사 입실일 때만)
    var dismiss = null, dismissMsg = '';   // 2OUT 퇴실 확정에서 넘어온 신청서(서버가 다시 확인한 값만, 주소 값은 믿지 않는다)
    var body = el('div');
    root.appendChild(body);
    var bar = null;
    function fail(err) { UI.toast((err && err.message) || String(err), { kind: 'warn', ms: 5000 }); }
    function removeBar() { if (bar) { bar.remove(); bar = null; var m = document.querySelector('main'); if (m) m.classList.remove('has-actionbar'); } }
    function plusDay(ymd) { var d = new Date(ymd + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + 1); return d.toISOString().slice(0, 10); }
    function hallLeave() { return type === '학사 퇴실' || type === '학사 및 기숙사 퇴실'; }

    call('getMealContext').then(function (c) {
      if (!alive) return;
      ctx = c;
      if (!prefillId) { draw(); return; }
      var want = prefillId; prefillId = '';
      call('confirmOutDismissal', want).then(function (r) {
        if (!alive) return;
        if (r.ok) dismiss = r.prefill; else dismissMsg = '2OUT 퇴실 확정을 열 수 없습니다: ' + String(r.reason).replace(/\.$/, '') + '. OUT 화면의 [퇴실 대상]에서 확인해 주세요.';
        draw();
      }).catch(function (err) { if (!alive) return; dismissMsg = '2OUT 퇴실 확정을 열 수 없습니다: ' + ((err && err.message) || err); draw(); });
    }).catch(function (err) { if (!alive) return; clear(body); showError(body, err); });

    function draw() {
      resetState();   // 다시 그릴 때마다 이전 선택·서류 체크를 비운다
      clear(body); removeBar();
      if (!ctx.canEdit) { body.appendChild(el('div', { class: 'notice info', text: '입퇴실은 담당교사와 관리자만 신청합니다. 이 화면에서는 볼 수만 있습니다.' })); return; }
      if (!ctx.students.length) { body.appendChild(UI.emptyState('신청할 수 있는 학생이 없습니다. 이번 운영 기간 명단과 담당교사를 확인해 주세요.')); return; }

      if (dismissMsg) body.appendChild(el('div', { class: 'notice warn', text: dismissMsg }));
      var status = el('div', { class: 'muted' });
      var picker = UI.studentPicker({ students: ctx.students, label: '학생', onpick: function (s) {
        picked = s; type = ''; dinner = ''; meals = null; mctx = null; status.textContent = '';
        doc = false; docBox.checked = false; drawDoc(); breakfastOn = true; reason.value = '';   // 이전 학생의 서류 체크·조식 선택·사유가 남지 않게
        drawTypes(); drawExtras();
        if (!s) { refresh(); return; }
        loadTypes(s.id);
      } });
      function loadTypes(id) {   // 유형 칩은 적용일 기준이다(날짜를 바꾸면 다시 불러온다)
        var mine = ++typeSeq;
        call('getMoveContext', id, dateField.getValue()).then(function (m) {
          if (!alive || mine !== typeSeq || !picked || picked.id !== id) return;
          mctx = m;
          var line = function (v) { return ['학사', '기숙사', '조식', '석식'].map(function (k) { return k + ' ' + (v[k] || '없음'); }).join(' · '); };
          status.textContent = '지금 상태: ' + line(m.now) + (m.date !== m.today ? '\n' + U.formatDateKo(m.date, false) + ' 기준: ' + line(m.onDate) : '');
          status.style.whiteSpace = 'pre-line';
          if (type && !m.types.some(function (t) { return t.type === type && t.enabled; })) { type = ''; dinner = ''; meals = null; }
          drawExtras(); drawTypes(); refresh();
        }).catch(function (err) { if (alive) fail(err); });
      }
      var ps = dismiss ? dismiss.student : null;
      if (dismiss) {   // 2OUT 퇴실 확정: 학생은 고정(다른 학생으로 바꾸려면 [비우기])
        body.appendChild(el('div', { class: 'card' }, [
          el('div', { class: 'notice info', style: 'word-break:keep-all', text: '2OUT 퇴실 확정입니다. 면담 기록(' + U.formatDateKo(dismiss.meeting.date, false) + ' · ' + dismiss.meeting.teacher + ')을 확인했습니다. 유형과 석식을 골라 신청해 주세요.' }),
          el('div', { style: 'font-weight:700' }, [el('span', { text: U.studentLabel(ps) + ' ' }), el('span', { class: 'muted', text: ps.grade + '-' + ps.classNo + ' ' + ps.number + '번' })]), status]));
      } else body.appendChild(el('div', { class: 'card' }, [picker, status]));

      var chips = el('div', { class: 'chips' }), hints = el('div');
      var typeField = UI.field('유형', chips);
      function drawTypes() {
        clear(chips); clear(hints);
        if (!mctx) { chips.appendChild(el('span', { class: 'muted', text: '학생을 고르면 가능한 유형이 나옵니다.' })); }
        else mctx.types.filter(function (t) { return !dismiss || t.type === '학사 퇴실' || t.type === '학사 및 기숙사 퇴실'; }).forEach(function (t) {
          var b = el('button', { type: 'button', class: t.type === type ? 'chip on' : 'chip', text: t.type, onclick: function () { type = t.type; dinner = ''; meals = null; breakfastOn = true; drawTypes(); drawExtras(); refresh(); } });
          if (!t.enabled) { b.disabled = true; if (t.hint.indexOf('기숙사생은') === 0) hints.appendChild(el('div', { class: 'hint', text: t.hint })); }
          chips.appendChild(b);
        });
        typeField.setError(mctx && !type ? '유형을 골라 주세요.' : '');
        chips.appendChild(hints);
      }
      drawTypes();
      body.appendChild(el('div', { class: 'card' }, [el('h2', { text: '무엇을' }), typeField]));

      var at = el('input', { type: 'datetime-local', value: ctx.now.slice(0, 16), max: ctx.now.slice(0, 16) });
      at.addEventListener('change', function () { atTouched = true; refresh(); });
      var dateField = UI.dateField({ label: '적용일', value: dismiss ? dismiss.effectiveDate : ctx.today, shortcuts: [{ label: '오늘', value: ctx.today }, { label: '내일', value: plusDay(ctx.today) }], onchange: function () { last = null; drawResult(); drawBar(); if (picked) loadTypes(picked.id); else refresh(); } });   // 날짜가 바뀌는 동안 이전 미리보기와 켜진 버튼을 남기지 않는다
      body.appendChild(el('div', { class: 'card' }, [UI.field('신청 일시', at, { hint: '서류를 받은 날짜·시각입니다. 기본값은 지금입니다.' }), dateField]));

      var extra = el('div');
      var dinnerSeg = null, dinnerField = null;
      function drawExtras() {
        clear(extra);
        if (hallLeave()) {
          dinnerSeg = UI.segmented({ label: '석식', value: dinner, options: [{ value: '중단', label: '중단' }, { value: '일반 석식', label: '일반 석식으로' }], onchange: function (v) { dinner = v; dinnerField.setError(''); refresh(); } });
          dinnerField = UI.field('석식', dinnerSeg, { hint: '"중단"은 미실시 규칙(수~일 신청이면 다다음 주 월요일)을 따릅니다.' });
          if (!dinner) dinnerField.setError('석식을 골라 주세요. 기본값이 없습니다.');
          extra.appendChild(el('div', { class: 'card' }, [el('h2', { text: '급식 정리' }), dinnerField, el('div', { class: 'notice info', text: '조식은 적용일부터 바로 중단됩니다.' })]));
        } else if (type === '학사 입실' && mctx && mctx.reentry) {
          // 재입실 급식: 기본값은 퇴실 전 값. 고른 값은 늘 서버로 명시해서 보낸다(확인 시트에도 보인다)
          if (!meals) meals = { '조식': mctx.reentry.meals['조식'], '석식': mctx.reentry.meals['석식'] };
          var none = function (k) { return mctx.reentry.meals[k] === '' ? [{ value: '', label: '없음' }] : []; };   // 퇴실 전에 값이 없던 급식은 '없음'이 기본(쓰지 않는다)
          var bkSeg = UI.segmented({ label: '조식', value: meals['조식'], options: none('조식').concat([{ value: '실시', label: '실시' }, { value: '미실시', label: '미실시' }]), onchange: function (v) { meals['조식'] = v; refresh(); } });
          var dnSeg = UI.segmented({ label: '석식', value: meals['석식'], options: none('석식').concat([{ value: '학사 석식', label: '학사 석식' }, { value: '일반 석식', label: '일반 석식' }, { value: '미실시', label: '미실시' }]), onchange: function (v) { meals['석식'] = v; refresh(); } });
          extra.appendChild(el('div', { class: 'card' }, [el('h2', { text: '재입실 급식' }),
            el('div', { class: 'muted', style: 'margin-bottom:8px;word-break:keep-all', text: '기본값은 ' + mctx.reentry.leaveKo + ' 퇴실 전날의 값입니다. 재입실일부터 적용됩니다.' }),
            UI.field('조식', bkSeg), UI.field('석식', dnSeg),
            el('div', { class: 'notice info', style: 'word-break:keep-all', text: '옛 자리가 다른 학생에게 넘어갔으면 좌석표에서 자리 배정이 필요합니다.' })]));
        } else if (type === '기숙사 입실' || type === '기숙사 퇴실') {
          var cb = el('input', { type: 'checkbox' }); cb.checked = breakfastOn;
          cb.addEventListener('change', function () { breakfastOn = cb.checked; refresh(); });
          extra.appendChild(el('div', { class: 'card' }, [el('label', { class: 'check' }, [cb, el('span', { text: type === '기숙사 입실' ? '조식도 입실일부터' : '조식도 미실시' })])]));
        }
      }
      drawExtras();
      body.appendChild(extra);

      var reason = el('input', { type: 'text', maxlength: '100' });
      if (dismiss) { reason.value = dismiss.reason; reason.disabled = true; }   // 사유는 서버가 정한다
      reason.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(refresh, 400); });
      var docBox = el('input', { type: 'checkbox' }); var docWarn = el('div');
      function drawDoc() { clear(docWarn); if (!doc) docWarn.appendChild(el('div', { class: 'notice warn', text: '서류 미제출로 기록됩니다. 담당교사 홈에 남습니다.' })); }
      docBox.addEventListener('change', function () { doc = docBox.checked; drawDoc(); });
      drawDoc();
      body.appendChild(el('div', { class: 'card' }, [UI.field('사유', reason), el('label', { class: 'check' }, [docBox, el('span', { text: '학교 서류 제출함' })]), docWarn]));

      var result = el('div');
      body.appendChild(el('div', { class: 'card' }, [el('h2', { text: '확인' }), result]));

      function payload() {
        var pl = { studentId: picked ? picked.id : '', type: type, requestedAt: at.value ? at.value + ':00' : '', effectiveDate: dateField.getValue(), dinner: dinner,
          breakfastWithDorm: type === '기숙사 입실' ? breakfastOn : true, breakfastStopWithDorm: type === '기숙사 퇴실' ? breakfastOn : true,
          reason: dismiss ? '' : reason.value.trim(), docSubmitted: doc, outDismissal: !!dismiss };
        if (type === '학사 입실' && mctx && mctx.reentry && meals) pl.meals = { '조식': meals['조식'], '석식': meals['석식'] };   // 재입실 급식은 늘 명시해서 보낸다
        return pl;
      }
      function ready() { return !!(picked && type && (!hallLeave() || dinner) && last && last.ok && !busy); }
      function drawResult() {
        clear(result);
        if (!last) { result.appendChild(el('div', { class: 'muted', text: picked && type && (!hallLeave() || dinner) ? '바뀌는 내용을 계산하는 중…' : '학생·유형' + (hallLeave() ? '·석식' : '') + '을 고르면 바뀌는 내용이 나옵니다.' })); return; }
        (last.errors || []).forEach(function (e) { result.appendChild(el('div', { class: 'notice warn', text: e.message })); });
        if (last.lead && last.ok) {
          result.appendChild(el('div', { style: 'font-size:var(--font-xl);font-weight:700;margin-bottom:8px', text: last.lead }));
          if (last.lines.length) result.appendChild(el('ul', { class: 'list' }, last.lines.map(function (t) { return el('li', { text: t }); })));
        }
        (last.warnings || []).forEach(function (w) { result.appendChild(el('div', { class: 'notice warn', text: w })); });
      }
      function drawBar() { removeBar(); bar = UI.actionBar([{ text: '비우기', kind: 'secondary', onclick: reset }, { text: '입퇴실 신청', disabled: !ready(), onclick: confirmSave }], { mount: true }); }
      function refresh(retried) {
        var mine = ++seq; clearTimeout(timer);   // 학생을 비우는 경우에도 진행 중인 미리보기를 무효로 한다
        last = null; drawResult(); drawBar();
        if (!picked || !type || (hallLeave() && !dinner)) return;
        timer = setTimeout(function () {
          call('previewMove', payload()).then(function (p) {
            if (!alive || mine !== seq) return;
            if (!atTouched && p.now && p.now.slice(0, 16) !== at.value && retried !== true) { at.value = p.now.slice(0, 16); at.max = at.value; refresh(true); return; }
            if (gateClosed(p)) return;
            last = p; drawResult(); drawBar();
          }).catch(function (err) { if (alive && mine === seq) fail(err); });
        }, 250);
      }
      /** 2OUT 퇴실 확정인데 관문이 닫혔다(면담 취소 등): 옛 '면담 확인' 안내를 남기지 않고 이유를 보이며 일반 입력으로 돌린다 */
      function gateClosed(p) {
        var g = dismiss && (p.errors || []).filter(function (e) { return e.field === 'gate'; })[0];
        if (!g) return false;
        dismiss = null; dismissMsg = '2OUT 퇴실 확정을 열 수 없습니다: ' + String(g.message).replace(/\.$/, '') + '. OUT 화면의 [퇴실 대상]에서 확인해 주세요.';
        draw(); return true;
      }
      function confirmSave() {
        var p = last;
        UI.confirmSheet({ title: '입퇴실을 저장합니다', lead: p.lead, lines: [U.studentLabel(picked) + ' (' + picked.grade + '-' + picked.classNo + ' ' + picked.number + '번)'].concat(dismiss ? ['2OUT 퇴실 확정'] : []).concat(p.lines).concat(type === '학사 입실' ? ['옛 자리가 넘어갔으면 자리 배정이 필요합니다'] : []).concat(doc ? [] : ['서류 미제출로 기록됩니다']).concat(p.warnings || []),
          confirmText: '입퇴실 저장', danger: /퇴실/.test(type), onconfirm: function () {
            busy = true; drawBar();
            call('saveMove', payload(), p.expect).then(function (r) {
              if (r.ok) UI.toast(r.duplicate ? '이미 저장된 신청서입니다.' : r.lead + ' · 저장했습니다.');   // 다른 탭으로 옮긴 뒤 와도 결과는 알린다
              if (!alive) return;
              if (r.stale) { busy = false; UI.toast(r.error, { kind: 'warn', ms: 5000 }); refresh(); return; }
              if (!r.ok && gateClosed(r)) { busy = false; return; }
              if (!r.ok) { busy = false; UI.toast((r.errors && r.errors[0] && r.errors[0].message) || '저장하지 못했습니다.', { kind: 'warn', ms: 5000 }); refresh(); return; }
              resetState(); dismiss = null; dismissMsg = '';
              window.scrollTo(0, 0);
              call('getMealContext').then(function (c) { if (alive) { busy = false; ctx = c; draw(); } })   // 다시 불러오는 동안은 busy 유지
                .catch(function (err) { if (alive) { busy = false; draw(); UI.toast('저장했습니다. 화면을 다시 불러오지 못했습니다. 새로고침해 주세요.', { kind: 'warn', ms: 6000 }); } });
            }).catch(function (err) { if (!alive) return; busy = false; drawBar(); fail(err); });
          } });
      }
      function resetState() { picked = null; mctx = null; type = ''; dinner = ''; meals = null; doc = false; breakfastOn = true; last = null; atTouched = false; seq++; clearTimeout(timer); }
      function reset() { resetState(); dismiss = null; dismissMsg = ''; draw(); }
      drawResult(); drawBar();
      if (dismiss) { picked = { id: dismiss.studentId, name: ps.name, grade: ps.grade, classNo: ps.classNo, number: ps.number }; loadTypes(picked.id); }
    }
    return function () { alive = false; seq++; typeSeq++; clearTimeout(timer); removeBar(); };
  }

  function renderScreen(root) {
    var prefillId = SCREEN_PARAMS.prefill === 'out2' && window.SCREEN_STUDENT ? window.SCREEN_STUDENT : '';   // 값은 서버가 confirmOutDismissal로 다시 받는다
    var tab = prefillId ? 'move' : window.SCREEN_TAB === 'history' || (window.SCREEN_STUDENT && window.SCREEN_TAB !== 'move') ? 'history' : window.SCREEN_TAB === 'meal' ? 'meal' : 'move';
    var holder = el('div'), dispose = null;
    function draw() {
      if (dispose) { dispose(); dispose = null; }
      clear(holder);
      if (tab === 'move') dispose = renderMoveTab(holder, prefillId);
      else if (tab === 'meal') dispose = renderMealTab(holder);
      else dispose = renderRecordTab(holder, window.SCREEN_STUDENT || '');
    }
    root.appendChild(el('div', { class: 'card' }, [UI.segmented({ label: '화면', value: tab, options: [{ value: 'move', label: '입퇴실' }, { value: 'meal', label: '급식 변경' }, { value: 'history', label: '학생 기록' }],
      onchange: function (v) { tab = v; window.SCREEN_STUDENT = ''; prefillId = ''; draw(); } })]));
    root.appendChild(holder);
    draw();
  }
</script>
