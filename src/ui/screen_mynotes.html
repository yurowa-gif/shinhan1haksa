<style>
  .mn-note { padding: 14px 0; border-bottom: 1px solid var(--line); word-break: keep-all; }
  .mn-note:last-child { border-bottom: 0; }
  .mn-agree { margin: 8px 0; padding: 10px 12px; background: var(--muted-weak); border-radius: var(--radius-sm); white-space: pre-wrap; }
  .mn-agree b { display: block; margin-bottom: 2px; }
</style>
<script>
  /**
   * 내 상담 기록(C49-B, F17 학생). docs/design/stage6/screens.md 3절. 학생 본인만(서버가 portalWho_로 판정).
   * 한 건에 날짜·선생님 이름·합의 사항·다음 할 일만 — 상담 유형·내용은 서버가 보내지 않는다(결정 94).
   * 합의 사항은 건마다 "부모님께 보이기"(기본 꺼짐, 결정 90). 켤 때는 바로, 끌 때는 확인 시트(결정 92: 이미 보신 내용은 되돌릴 수 없습니다).
   * 학사에서 나간 뒤에는 보기만 한다(결정 97) — 체크 칸을 그리지 않는다.
   */
  function renderScreen(root) {
    var U = UI.util;
    var body = el('div');
    root.appendChild(body);
    function fail(err) { UI.toast((err && err.message) || String(err), { kind: 'warn', ms: 5000 }); }
    function load() {
      call('getMyCounselNotes', '').then(draw).catch(function (err) { clear(body); showError(body, err); });
    }
    load();

    function draw(d) {
      clear(body);
      if (d.notes.length) body.appendChild(el('div', { class: 'notice info', text: '부모님께는 상담한 날짜와 선생님 이름만 보입니다. 합의 사항은 내가 "보이기"를 켠 것만 보입니다.' }));
      if (!d.canShare && d.notes.length) body.appendChild(el('div', { class: 'notice warn', text: '학사를 나간 뒤에는 고칠 수 없습니다. 기록은 계속 볼 수 있습니다.' }));
      if (!d.notes.length) {
        body.appendChild(el('div', { class: 'card' }, [UI.emptyState('아직 상담 기록이 없습니다.'), el('a', { class: 'btn', style: 'margin-top:8px', href: appHref('page=counselreq&tab=form'), text: '상담 신청하기' })]));
        return;
      }
      var card = el('div', { class: 'card' });
      d.notes.forEach(function (n) { card.appendChild(noteBox(n, d.canShare)); });
      body.appendChild(card);
    }
    function appHref(q) { return ((document.querySelector('a.back') || {}).href || '') + '?' + q; }

    function noteBox(n, canShare) {
      var box = el('div', { class: 'mn-note' }, [el('b', { text: n.dateKo }), el('div', { class: 'muted', text: n.teacher_name ? n.teacher_name + ' 선생님' : '담당 선생님' })]);
      if (!n.agreement) { box.appendChild(el('div', { class: 'muted', style: 'margin-top:6px', text: '적힌 합의 사항이 없습니다.' })); return box; }
      box.appendChild(el('div', { class: 'mn-agree' }, [el('b', { text: '합의 사항·다음 할 일' }), el('span', { text: n.agreement })]));
      if (!canShare) return box;
      if (n.agreement_to_parent === undefined) return box;   // 판정표(R24b)가 학생 칸에 공개 상태를 주므로 늘 온다. 혹시 없으면 켜진 상태를 알 수 없어 체크 칸을 그리지 않는다(틀린 모습을 보이지 않는다)
      var on = /^(true|y|yes|1|예)$/i.test(String(n.agreement_to_parent));
      // 공통 부품 UI.shareCheck(체크하는 순간 저장되는 화면이라 기본 꼬리표 '지금 보이는 중'/'나만 보는 중'). 끄면 확인 시트(결정 92)는 부품이 띄운다
      box.appendChild(UI.shareCheck({ label: '이 합의 사항을 부모님께 보이기', on: on, confirmOff: true, itemName: n.dateKo + ' 상담의 합의 사항',
        onchange: function (next, done) {
          call('setAgreementShare', n.id, next).then(function (r) {
            if (!r.ok) { done(false); UI.toast((r.errors && r.errors[0].message) || '바꾸지 못했습니다.', { kind: 'warn', ms: 5000 }); if (r.stale) load(); return; }
            done(true); UI.toast(next ? '부모님께 보입니다.' : '부모님께 보이지 않습니다.');
          }).catch(function (err) { done(false); fail(err); });
        } }));
      return box;
    }
  }
</script>
