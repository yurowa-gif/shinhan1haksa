<style>
  .cn-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); word-break: keep-all; }
  .cn-row .row-btn { flex: 0 0 auto; white-space: nowrap; }
  .cn-agree { margin: 8px 0; padding: 10px 12px; background: var(--muted-weak); border-radius: var(--radius-sm); white-space: pre-wrap; }
  .cn-agree b { display: block; }
  .cn-note { padding: 12px 0; border-bottom: 1px solid var(--line); word-break: keep-all; }
  .cn-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .cn-head .pill { flex: 0 0 auto; white-space: nowrap; }   /* 글 칸 제목 옆 꼬리표가 글자 단위로 꺾이지 않게 */
  .cn-head h2 { margin: 0; min-width: 0; }
  .cn-body { white-space: pre-wrap; margin: 8px 0; padding: 10px 12px; background: var(--muted-weak); border-radius: var(--radius-sm); }
  .cn-btns { display: flex; gap: 6px; margin-top: 8px; flex-wrap: nowrap; }
  .cn-btns .btn { flex: 0 0 auto; white-space: nowrap; padding-left: 12px; padding-right: 12px; }
</style>
<script>
  /**
   * 상담일지 화면(C32, F12 교사 쪽, 시안 D12 docs/design/stage5-screens.md 2절): 학생 고르기 → [상담 목록 | 새로 쓰기].
   * 내용은 한 학생씩 서버가 권한(담당교사·담임(자기 반)·관리자)을 확인해 주고, 목록에서는 처음에 접혀 있다.
   * 고치기 = 취소 + 새 행(내용을 제자리에서 고치지 않는다, 결정 42).
   */
  function renderScreen(root) {
    var ctx = null, roster = [], seq = 0, data = null, tab = 'list', editing = null, bar = null, picked = null;
    var flash = '';
    var fromRequest = (window.SCREEN_PARAMS || {}).request || '';   // 상담 신청 처리 화면의 [상담일지 쓰기]에서 넘어온 신청 id(C49-B). 그 학생을 열면 바로 쓰기 탭
    var head = el('div', { class: 'card ld-list' }), body = el('div', { class: 'ld-detail' });
    var wrap = el('div', { class: 'ld' }, [head, body]);   // 840px 이상: 목록 | 상세 두 칸(D15 ⑤). 그보다 좁으면 지금처럼 화면이 옮겨 간다
    var wideMq = window.matchMedia ? window.matchMedia('(min-width: 840px)') : { matches: false };
    root.appendChild(wrap);
    var mainEl = document.querySelector('main'); if (mainEl) mainEl.classList.add('wide');
    var hint = function () { return el('div', { class: 'ld-empty muted', text: '왼쪽에서 학생을 고르면 상담 기록이 여기에 나옵니다.' }); };
    body.appendChild(hint());
    var query = el('input', { type: 'search', placeholder: '이름 또는 학번', autocomplete: 'off' });
    var label = function (s) { return s.grade + '-' + s.classNo + ' ' + s.number + '번 ' + s.name; };
    var openFrom = function (s) { if (!wideMq.matches) Nav.go('s:' + s.id); openStudent(s.id, true); };
    function dropBar() { if (bar && bar.parentNode) bar.parentNode.removeChild(bar); bar = null; var m = document.querySelector('main'); if (m) m.classList.remove('has-actionbar'); }

    // 왼쪽 목록은 서버가 '이 교사가 상담을 볼 수 있는 학생만 + 건수·최근 날짜'를 계산한 getCounselRoster(C42)로 그린다. 유형·오늘 날짜는 기존 getCounselContext에서
    Promise.all([call('getCounselContext'), call('getCounselRoster')]).then(function (both) {
      var r = both[0]; ctx = r; roster = (both[1] && both[1].students) || [];
      var info = {}; r.students.forEach(function (x) { info[x.id] = x; });
      roster.forEach(function (x) { var c = info[x.id] || {}; x.studentNo = c.studentNo; x.mine = c.mine; });   // 검색(학번)·'담당 아님' 표시는 기존 목록에서 이어받는다
      drawHead();
      Nav.bind(function (k) { if (String(k).indexOf('s:') === 0) openStudent(String(k).slice(2), true); else toList(); });   // 뒤로 가기(C39): 학생 기록 → 학생 목록
      var want = (window.SCREEN_PARAMS || {}).student;
      if (want && roster.some(function (s) { return s.id === want; })) openStudent(want, true);
    }).catch(function (err) { clear(head); showError(head, err); });

    function drawHead() {
      clear(head);
      head.appendChild(el('h2', { text: '상담일지' }));
      head.appendChild(UI.field('학생 찾기', query, { name: 'q' }));
      query.oninput = drawRows;
      head.appendChild(el('div', { id: 'cn-rows' }));
      drawRows();
    }
    function drawRows() {
      var box = head.querySelector('#cn-rows'); clear(box);
      var q = query.value.trim();
      var rows = roster.filter(function (s) { return !q || s.name.indexOf(q) >= 0 || String(s.studentNo || '').indexOf(q) >= 0; });   // 검색은 이 목록 안에서 거르기
      if (!rows.length) { box.appendChild(UI.emptyState(roster.length ? '찾는 학생이 없습니다.' : '볼 수 있는 학생이 없습니다.')); return; }
      var anyMine = roster.some(function (q2) { return q2.mine; });
      rows.forEach(function (s) {
        // 학생 표기는 앱 표기('1. 이름' + 둘째 줄: 반·번호 · 상담 N건 · 최근 날짜). 건수는 서버가 그 교사가 볼 수 있는 범위 안에서 센 값
        var pick = el('button', { type: 'button', class: 'ld-pick', 'aria-current': picked === s.id ? 'true' : null, onclick: function () { openFrom(s); } }, [
          el('span', { class: 'ld-name', text: UI.util.studentLabel(s) + (s.mine || !anyMine ? '' : ' (담당 아님)') }),
          el('span', { class: 'muted', text: s.grade + '-' + s.classNo + ' ' + s.number + '번 · 상담 ' + s.count + '건' + (s.lastDate ? ' · 최근 ' + UI.util.formatDateKo(s.lastDate) : '') })]);
        box.appendChild(el('div', { class: 'cn-row ld-row' + (picked === s.id ? ' on' : '') }, [
          pick,
          el('button', { type: 'button', class: 'btn secondary row-btn row-open', text: '상담 보기', onclick: function () { openFrom(s); } })
        ]));
      });
    }

    function toList() { seq++; dropBar(); data = null; editing = null; picked = null; clear(body); body.appendChild(hint()); wrap.classList.remove('has-detail'); if (ctx) drawRows(); window.scrollTo(0, 0); }

    function openStudent(id, fromNav) {
      var mine = ++seq; editing = null; tab = 'list'; dropBar(); picked = id; wrap.classList.add('has-detail'); if (ctx) drawRows();
      clear(body); body.appendChild(el('div', { class: 'loading', text: '불러오는 중…' }));
      call('getCounselNotes', id).then(function (r) {
        if (mine !== seq) return;
        data = r;
        if (fromRequest) { if (r.canWrite && r.fixedRequest && r.fixedRequest.id === fromRequest) tab = 'write'; else fromRequest = ''; }   // 맞는 확정 신청이 아니면 연결 없이 평소대로
        draw();
      })
        .catch(function (err) { if (mine !== seq) return; clear(body); showError(body, err); });
    }

    function draw() {
      clear(body); dropBar();
      var status = el('div', { 'aria-live': 'polite' });
      var s = data.student;
      var top = el('div', { class: 'card' }, [
        el('div', { class: 'cn-head' }, [el('div', {}, [el('b', { text: s.grade + '. ' + s.name }), el('span', { class: 'muted', text: ' ' + s.grade + '-' + s.classNo + ' ' + s.number + '번' + (s.teacher ? ' · 담당 ' + s.teacher : '') })]),
          el('button', { type: 'button', class: 'btn secondary row-btn ld-narrow', style: 'flex:0 0 auto;white-space:nowrap', text: '학생 바꾸기', onclick: function () { Nav.back(toList); } })])
      ]);
      if (data.canWrite) top.appendChild(UI.segmented({ label: '상담', value: tab, options: [{ value: 'list', label: '상담 목록' }, { value: 'write', label: editing ? '고치기' : '새로 쓰기' }], onchange: function (v) { tab = v; if (v === 'list') editing = null; draw(); } }));
      body.appendChild(top); body.appendChild(status);
      if (tab === 'write' && data.canWrite) writeCards(status); else listCard(status);
    }

    function listCard(status) {
      if (flash) { body.appendChild(el('div', { class: 'notice warn', text: flash })); flash = ''; }
      body.appendChild(el('div', { class: 'notice info', text: '상담 내용은 이 학생의 담당교사·담임(자기 반)·관리자 선생님만 봅니다. 다른 학사 교사·출결 담당에게는 이 목록이 없습니다.' }));
      var live = data.notes.filter(function (n) { return n.status === '유효'; }).length;
      var card = el('div', { class: 'card' }, [el('h2', { text: '상담 ' + live + '건' })]);
      if (!data.notes.length) card.appendChild(UI.emptyState('아직 상담 기록이 없습니다.'));
      data.notes.forEach(function (n) { card.appendChild(noteRow(n, status)); });
      body.appendChild(card);
    }

    function noteRow(n, status) {
      var canceled = n.status === '취소', open = false;
      var box = el('div', { class: 'cn-note' });
      function paint() {
        clear(box);
        box.appendChild(el('div', { class: 'cn-head' }, [el('b', { text: n.dateKo + ' · ' + n.type }), canceled ? UI.statusPill('canceled') : null]));
        box.appendChild(el('div', { class: 'muted', text: '대상 ' + n.target + ' · ' + n.teacher + (canceled ? '' : ' · 학부모에게 날짜·교사 ' + (n.showToParent ? '보임' : '안 보임')) }));
        if (canceled) box.appendChild(el('div', { class: 'muted', text: '취소 사유: ' + n.cancelReason }));
        if (n.fixed) box.appendChild(el('div', { class: 'muted', text: '2OUT 학부모 면담 — 취소는 OUT 화면에서만 합니다.' }));
        if (n.agreement) box.appendChild(el('div', { class: 'cn-agree' }, [el('b', { text: '합의 사항·다음 할 일' }), el('div', { text: n.agreement }), el('div', { class: 'muted', text: n.agreementToParent ? '학생이 부모님께 보이기를 켰습니다(학부모에게 합의 사항이 보입니다).' : '학생이 부모님께 보이기를 켜지 않았습니다.' })]));
        if (n.profileVersion || n.requestId) box.appendChild(el('div', { class: 'muted', text: (n.profileVersion ? '참고한 진로 프로필 ' + n.profileVersion + '번째 기록' : '') + (n.profileVersion && n.requestId ? ' · ' : '') + (n.requestId ? '상담 신청에서 넘어온 상담' : '') }));
        if (open) box.appendChild(el('div', { class: 'cn-body', text: n.content }));
        var btns = [el('button', { type: 'button', class: 'btn secondary', text: open ? '내용 접기' : '내용 보기', onclick: function () { open = !open; paint(); } })];
        if (n.canEdit) {
          btns.push(el('button', { type: 'button', class: 'btn secondary', text: '고치기', onclick: function () { editing = n; tab = 'write'; draw(); window.scrollTo(0, 0); } }));
          btns.push(el('button', { type: 'button', class: 'btn secondary', text: '취소', onclick: function () {
            UI.confirmWithReason({ title: '상담 기록을 취소합니다', message: '기록은 지우지 않고 "취소됨"으로 남습니다. 내용을 고치려면 [고치기]를 쓰거나 취소한 뒤 새로 써 주세요.', confirmText: '상담 취소', onconfirm: function (reason) {
              call('cancelCounselNote', n.id, reason).then(function (r) { if (r.ok) { UI.toast('취소했습니다.'); openStudent(data.student.id); } else showFail(status, r); }).catch(function (e) { showError(status, e); });
            } });
          } }));
        }
        box.appendChild(el('div', { class: 'cn-btns' }, btns));
      }
      paint();
      return box;
    }
    function showFail(status, r) { clear(status); (r.errors || []).forEach(function (e) { status.appendChild(el('div', { class: 'error', role: 'alert', text: e.message })); }); }

    function writeCards(status) {
      var seed = editing || { date: ctx.today, type: '', target: '학생', content: '', showToParent: true, agreement: '', profileVersion: '' };
      var fr = !editing && data.fixedRequest ? data.fixedRequest : null;   // 이어 쓸 수 있는 확정 신청(쓰는 담당교사에게만 온다)
      var type = seed.type, target = seed.target;
      if (!editing && fr && fromRequest === fr.id && !type && data.types.indexOf(fr.topic) >= 0) type = fr.topic;   // 신청 주제와 같은 이름의 유형이 있으면 미리 고른다(결정 103)
      var date = UI.dateField({ label: '상담 날짜', value: seed.date, max: ctx.today, name: 'date', shortcuts: [{ label: '오늘', value: ctx.today }] });
      var typeNode = el('div', { class: 'chips' });
      function drawChips(node, items, get, set) {
        clear(node);
        items.forEach(function (t) { node.appendChild(el('button', { type: 'button', class: t === get() ? 'chip on' : 'chip', text: t, onclick: function () { set(t); drawChips(node, items, get, set); } })); });
      }
      var profBox = el('div');
      var profVer = seed.profileVersion ? String(seed.profileVersion) : '';
      function drawProf() {   // 참고한 진로 프로필: 유형이 진로·진학일 때만. 기본 = 가장 최근 버전, '참고하지 않음'도 고를 수 있다
        clear(profBox);
        if (type !== '진로' && type !== '진학') return;
        var box = el('div', { class: 'card' }, [el('h2', { text: '참고한 진로 프로필' })]);
        if (!data.profiles.length) box.appendChild(el('div', { class: 'muted', text: '이 학생은 아직 진로 프로필을 내지 않았습니다.' }));
        else {
          var sel = el('select', {}, [el('option', { value: '', text: '참고하지 않음' })].concat(data.profiles.map(function (p) { return el('option', { value: String(p.version), text: p.version + '번째 기록 · ' + UI.util.formatDateKo(p.submittedAt, false) + (p === data.profiles[0] ? ' (가장 최근)' : '') }); })));
          if (profVer === '' && !editing) profVer = String(data.profiles[0].version);
          sel.value = profVer;
          sel.addEventListener('change', function () { profVer = sel.value; });
          box.appendChild(UI.field('상담하면서 본 버전', sel, { name: 'profileVersion', hint: '고르면 이 상담이 그 버전을 보고 한 것으로 기록됩니다.' }));
        }
        profBox.appendChild(box);
      }
      drawChips(typeNode, data.types, function () { return type; }, function (t) { type = t; drawProf(); });
      drawProf();
      var targetNode = el('div', { class: 'chips' });
      drawChips(targetNode, ['학생', '학부모'], function () { return target; }, function (t) { target = t; });
      var typeBox = UI.field('유형', typeNode, { name: 'type' }), targetBox = UI.field('대상', targetNode, { name: 'target' });
      var area = el('textarea', { maxlength: '2000', rows: '7', style: 'min-height:160px' }); area.value = seed.content;
      var contentBox = UI.field('상담 내용', area, { name: 'content', hint: '교사만 봅니다. 학생·학부모에게 보이지 않습니다. 2000자까지, 저장한 뒤에는 고치지 않습니다(취소하고 새로 씁니다).' });
      var agrArea = el('textarea', { maxlength: '1000', rows: '4' }); agrArea.value = seed.agreement || '';
      var agrBox = UI.field('합의 사항·다음 할 일 (선택)', agrArea, { name: 'agreement', hint: '학생에게 보입니다. 학생이 "부모님께 보이기"를 켜면 학부모도 봅니다. 1000자까지.' });
      var linkChk = null;
      if (fr) {   // 날짜가 정해진 신청이 있으면 이 상담이 그 신청에서 이어진 것인지 고른다. 넘어왔을 때는 켜 둔다
        linkChk = el('input', { type: 'checkbox' }); linkChk.checked = fromRequest === fr.id;
      }
      var show = el('input', { type: 'checkbox' }); show.checked = seed.showToParent !== false;
      var check = el('label', { class: 'check' }, [show, el('span', { text: '학부모에게 상담한 날짜·교사를 보입니다(내용은 보이지 않습니다)' })]);
      var errs = { date: date.setError, type: typeBox.setError, target: targetBox.setError, content: contentBox.setError, agreement: agrBox.setError };
      if (fr && fromRequest === fr.id) body.appendChild(el('div', { class: 'notice info', text: UI.util.studentLabel(data.student) + '의 ' + fr.topic + ' 상담 신청(' + fr.decidedKo + ' 확정)에서 넘어왔습니다. ' + (fr.relink ? '앞에 쓴 일지가 취소되어 있어, 저장하면 신청이 이 일지와 새로 이어집니다.' : '저장하면 신청이 "완료"로 바뀝니다.') }));
      body.appendChild(el('div', { class: 'card' }, [el('h2', { text: editing ? '상담 고치기' : '상담' }), date, typeBox, targetBox]));
      body.appendChild(profBox);
      // 두 글 칸이 누구에게 보이는지: 내용은 교사만, 합의 사항은 저장하는 순간 학생에게(학생이 보이기를 켜면 학부모에게도) 보인다
      body.appendChild(el('div', { class: 'card' }, [el('div', { class: 'cn-head' }, [el('h2', { text: '상담 내용 (교사만)' }), UI.statusPill('mute', '교사만 봄')]), contentBox, check]));
      body.appendChild(el('div', { class: 'card' }, [el('div', { class: 'cn-head' }, [el('h2', { text: '합의 사항·다음 할 일 (학생에게 보임)' }), UI.statusPill('requested', '학생에게 보임')]), agrBox].concat(linkChk ? [el('label', { class: 'check' }, [linkChk, el('span', { text: fr.topic + ' 상담 신청(' + fr.decidedKo + (fr.relink ? ' 상담, 앞의 일지는 취소됨)에서 이어진 상담입니다. 저장하면 신청이 이 일지와 새로 이어집니다.' : ' 확정)에서 이어진 상담입니다. 저장하면 신청이 "완료"가 됩니다.') })])] : [])));
      body.appendChild(el('div', { class: 'notice info', text: '내용은 담당교사·담임(자기 반)·관리자 선생님만 봅니다. 감사 기록에는 "(내용 생략, N자)"만 남습니다.' }));
      var send;
      function input() { return { studentId: data.student.id, date: date.getValue(), type: type, target: target, content: area.value, showToParent: show.checked,
        agreement: agrArea.value, profileVersion: (type === '진로' || type === '진학') ? profVer : '', requestId: linkChk && linkChk.checked ? fr.id : '' }; }
      function fail(r) {
        Object.keys(errs).forEach(function (k) { errs[k](''); }); clear(status);
        (r.errors || []).forEach(function (e) { if (errs[e.field]) errs[e.field](e.message); else status.appendChild(el('div', { class: 'error', role: 'alert', text: e.message })); });
      }
      function done(r, msg) {
        send.disabled = false;
        if (!r.ok) { fail(r); return; }
        UI.toast(msg + (r.completedRequest ? ' 상담 신청이 완료되었습니다.' : ''));
        flash = (r.warnings && r.warnings[0]) || '';   // 경고는 토스트(목록의 [취소] 단추를 가린다) 말고 목록 위 한 줄로
        fromRequest = ''; openStudent(data.student.id);
      }
      function agrLen() { return agrArea.value.trim().length; }
      function submit() {
        if (send.disabled) return;
        if (editing) {
          UI.confirmWithReason({ title: '상담을 고칩니다', message: '옛 기록은 "취소됨"으로 남고 새 기록이 생깁니다.' + (agrLen() ? ' 합의 사항 ' + agrLen() + '자는 학생에게 보입니다.' : ''), reasonLabel: '고치는 이유', confirmText: '고쳐서 저장', danger: false, onconfirm: function (reason) {
            send.disabled = true;
            call('reviseCounselNote', editing.id, input(), reason).then(function (r) { done(r, '고쳐서 저장했습니다.'); }).catch(function (e) { send.disabled = false; showError(status, e); });
          } });
          return;
        }
        function save() {
          send.disabled = true;
          call('saveCounselNote', input()).then(function (r) { done(r, r.duplicate ? '이미 같은 기록이 있습니다.' : '저장했습니다.'); }).catch(function (e) { send.disabled = false; showError(status, e); });
        }
        if (!agrLen()) { save(); return; }   // 합의 사항이 비면 시트 없이 저장한다
        // 글자 수만 말하지 않고 쓴 글을 그대로(길면 앞의 세 줄 + …) 보여 준다 — 잘못 적은 것을 그 자리에서 알아채게
        var lines = agrArea.value.trim().split(/\r?\n/).filter(function (x) { return x.trim(); });
        var shown = lines.slice(0, 3).map(function (x) { return x.length > 60 ? x.slice(0, 60) + '…' : x; });
        if (lines.length > 3) shown.push('…');
        UI.confirmSheet({ title: '저장하기', lead: '합의 사항 ' + agrLen() + '자가 학생에게 보입니다.', lines: shown, message: '저장한 뒤에는 고칠 수 없고, 고치려면 취소하고 다시 써야 합니다.', confirmText: '저장하기', cancelText: '돌아가기', onconfirm: save });
      }
      bar = UI.actionBar([{ text: '닫기', kind: 'secondary', onclick: function () { editing = null; tab = 'list'; draw(); } },
        { text: editing ? '고쳐서 저장' : '상담일지 저장', disabled: !area.value.trim(), onclick: submit }], { mount: true });
      send = bar.querySelectorAll('button')[1];
      area.oninput = function () { send.disabled = !area.value.trim(); contentBox.setError(''); };
    }
  }
</script>
