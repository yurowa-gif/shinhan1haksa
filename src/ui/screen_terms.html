<style>
  .term-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%;
    min-height: 56px; padding: 10px 4px; border: 0; border-bottom: 1px solid var(--line); background: transparent;
    color: var(--text); font: inherit; text-align: left; cursor: pointer; }
  .term-row:last-child { border-bottom: 0; }
  .term-tag { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .8rem;
    background: var(--accent-weak); color: var(--accent); border: 1px solid var(--accent); }
  .term-warn { background: var(--warn-weak); color: var(--warn); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }
  .term-ok { color: var(--ok); margin-bottom: 12px; }
  .term-actions { display: flex; gap: 8px; flex-wrap: wrap; }
</style>
<script>
  /** 운영 기간 화면(관리자는 추가·수정, 그 밖의 교사는 보기). C1. */
  function renderScreen(root) {
    // 공통 .field(디자인 D1) 한 칸을 만든다
    function localField(label, input, name) {
      return el('div', { class: 'field' }, [
        el('label', { text: label }), input, el('div', { class: 'fix', 'data-for': name })
      ]);
    }

    var state = { data: null, editing: null, canEdit: true };
    var listBox = el('div', { class: 'card' });
    var formBox = el('div', { class: 'card' });
    var carryBox = el('div', { class: 'card' });
    root.appendChild(listBox);
    root.appendChild(formBox);
    root.appendChild(carryBox);

    function load(note) {
      call('listTerms').then(function (data) {
        state.data = data;
        drawList();
        drawForm(note);
        drawCarry();
      }).catch(function (err) { clear(listBox); showError(listBox, err); });
    }

    function drawList() {
      clear(listBox);
      listBox.appendChild(el('h2', { text: '운영 기간' }));
      listBox.appendChild(el('div', { class: 'muted', text: '오늘은 ' + state.data.today + '입니다.' }));
      if (!state.data.terms.length) {
        listBox.appendChild(el('div', { class: 'muted', text: '아직 기간이 없습니다. 아래에서 첫 기간을 추가해 주세요.' }));
        return;
      }
      var list = el('div', { style: 'margin-top:8px' });
      state.data.terms.forEach(function (t) {
        list.appendChild(el('button', {
          type: 'button', class: 'term-row',
          onclick: function () { state.editing = t; drawForm(); }
        }, [
          el('span', {}, [
            el('b', { text: t.name }), ' ',
            el('span', { class: 'muted', text: t.type }),
            el('div', { class: 'muted', text: t.start_date + ' ~ ' + t.end_date })
          ]),
          t.isCurrent ? el('span', { class: 'term-tag', text: '현재' }) : null
        ]));
      });
      listBox.appendChild(list);
    }

    function drawForm(note) {
      clear(formBox);
      if (!state.data.canEdit) { formBox.style.display = 'none'; return; }
      var t = state.editing;
      formBox.appendChild(el('h2', { text: t ? '기간 수정' : '기간 추가' }));
      if (note) formBox.appendChild(el('div', { class: 'term-ok', text: note }));

      var name = el('input', { type: 'text', maxlength: '40', placeholder: '예: 2027 1학기' });
      var type = el('select', {}, state.data.types.map(function (x) { return el('option', { value: x, text: x }); }));
      var start = el('input', { type: 'date' });
      var end = el('input', { type: 'date' });
      var memo = el('input', { type: 'text', placeholder: '메모(선택)' });
      if (t) { name.value = t.name; type.value = t.type; start.value = t.start_date; end.value = t.end_date; memo.value = t.memo; }

      formBox.appendChild(localField('기간 이름', name, 'name'));
      formBox.appendChild(localField('유형', type, 'type'));
      formBox.appendChild(localField('시작일', start, 'start_date'));
      formBox.appendChild(localField('종료일', end, 'end_date'));
      formBox.appendChild(localField('메모', memo, 'memo'));
      var msg = el('div');
      formBox.appendChild(msg);

      var save = el('button', { type: 'button', class: 'btn', text: '저장' });
      var actions = el('div', { class: 'term-actions' }, [save]);
      if (t) actions.appendChild(el('button', {
        type: 'button', class: 'btn secondary', text: '새 기간으로 돌아가기',
        onclick: function () { state.editing = null; drawForm(); }
      }));
      formBox.appendChild(actions);

      save.addEventListener('click', function () {
        save.disabled = true;
        clear(msg);
        Array.prototype.forEach.call(formBox.querySelectorAll('.fix'), function (n) { n.textContent = ''; });
        call('saveTerm', {
          id: t ? t.id : '', name: name.value, type: type.value,
          start_date: start.value, end_date: end.value, memo: memo.value
        }).then(function (r) {
          save.disabled = false;
          if (!r.ok) {
            r.errors.forEach(function (e) {
              var slot = formBox.querySelector('.fix[data-for="' + e.field + '"]');
              if (slot) slot.textContent = e.message;
            });
            msg.appendChild(el('div', { class: 'error', text: '저장하지 못했습니다. 빨간 글씨를 고쳐 주세요.' }));
            return;
          }
          state.editing = null;
          load(r.warnings.length ? '저장했습니다. 확인: ' + r.warnings.join(' ') : '저장했습니다.');
        }).catch(function (err) { save.disabled = false; clear(msg); showError(msg, err); });
      });
    }

    /** 이전 학기 명단 이어받기(관리자): 학기 기간만. 미리보기로 인원을 확인한 뒤 저장한다. */
    function drawCarry() {
      clear(carryBox);
      if (!state.data.canEdit) { carryBox.style.display = 'none'; return; }
      carryBox.appendChild(el('h2', { text: '이전 학기 명단 이어받기' }));
      var terms = state.data.terms.filter(function (t) { return t.type === '학기'; });
      if (!terms.length) { carryBox.appendChild(el('div', { class: 'muted', text: '학기 기간을 먼저 추가해 주세요. 방학에는 이어받기가 없습니다.' })); return; }
      carryBox.appendChild(el('div', { class: 'muted', text: '직전 학기에 학사생이던 학생(새 학기 시작일 기준)을 새 학기 명단에 등록합니다. 퇴실한 학생은 빠집니다.' }));
      var sel = el('select', {}, terms.map(function (t) { return el('option', { value: t.id, text: t.name + ' (' + t.start_date + ' ~)' }); }));
      sel.value = terms[terms.length - 1].id;
      carryBox.appendChild(UI.field('이어받을 새 학기', sel, { name: 'carry' }));
      var out = el('div');
      var preview = el('button', { type: 'button', class: 'btn secondary', text: '미리보기' });
      var go = el('button', { type: 'button', class: 'btn', text: '이어받기', disabled: 'disabled' });
      go.disabled = true;
      carryBox.appendChild(el('div', { class: 'term-actions' }, [preview, go]));
      carryBox.appendChild(out);
      var shown = null;
      sel.addEventListener('change', function () { shown = null; go.disabled = true; clear(out); });
      preview.addEventListener('click', function () {
        preview.disabled = true; go.disabled = true; clear(out);
        call('previewCarryOver', sel.value).then(function (r) {
          preview.disabled = false;
          if (!r.ok) { out.appendChild(el('div', { class: 'error', text: r.error })); return; }
          if (r.message) out.appendChild(el('div', { class: 'muted', text: r.message }));
          if (!r.count) return;
          shown = r;
          out.appendChild(kv([['이어받을 학기', r.fromTermName], ['새 학기', r.termName], ['이어받는 학생', r.count + '명']]));
          var ul = el('ul', { class: 'list' });
          r.students.slice(0, 30).forEach(function (x) { ul.appendChild(el('li', {}, [el('span', { text: x.student_no + ' ' + x.name })])); });
          if (r.count > 30) ul.appendChild(el('li', {}, [el('span', { class: 'muted', text: '외 ' + (r.count - 30) + '명' })]));
          out.appendChild(ul);
          go.disabled = false;
        }).catch(function (err) { preview.disabled = false; showError(out, err); });
      });
      go.addEventListener('click', function () {
        if (!shown) return;
        UI.confirmSheet({ title: '이어받을까요?', message: shown.fromTermName + ' → ' + shown.termName + ': 학생 ' + shown.count + '명을 등록합니다.',
          confirmText: '이어받기', cancelText: '취소', onconfirm: function () {
            go.disabled = true;
            call('commitCarryOver', sel.value, shown.count).then(function (r) {
              if (!r.ok) { UI.toast(r.error, { kind: 'warn', ms: 5000 }); clear(out); return; }
              UI.toast(r.count + '명을 이어받았습니다.', { kind: 'ok' });
              clear(out); out.appendChild(el('div', { class: 'notice ok', text: r.count + '명을 이어받았습니다. 변경이 필요한 학생은 "명단 올리기"로 고칩니다.' }));
            }).catch(function (err) { go.disabled = false; UI.toast(err.message || String(err), { kind: 'warn', ms: 5000 }); });
          } });
      });
    }

    load();
  }
</script>
