<style>
  .duty-nav { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
  .duty-nav .title { flex: 1; text-align: center; font-weight: 700; word-break: keep-all; }
  .duty-nav .btn { flex: 0 0 auto; white-space: nowrap; }
  .duty-card { cursor: pointer; }
  .duty-card.today { border-color: var(--accent); }
  .duty-head { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 4px; flex-wrap: wrap; }
  .duty-head h2 { margin: 0; }
  ul.list li.duty-slot { display: flex; gap: 8px; align-items: center; justify-content: flex-start; flex-wrap: nowrap; min-height: 32px; }
  .duty-card.readonly { cursor: default; }
  .duty-slot .slot-label { flex: 0 0 5.5em; color: var(--muted-ink); white-space: nowrap; }
  .duty-sheet-slots .field { margin-bottom: 8px; }
  table.data.duty-rec th, table.data.duty-rec td { padding: 10px 2px; white-space: nowrap; }   /* 숫자 열은 좁게: 360px에서 예비 열까지 한 화면에 */
  table.data.duty-rec th[scope=row] { white-space: normal; word-break: keep-all; min-width: 4.6em; max-width: 6.5em; text-align: left; padding-left: 4px; }   /* 이름은 낱말 중간에서 끊기지 않게(긴 이름만 칸 안에서 줄바꿈) */
  .tablewrap.duty-recwrap { overflow-x: auto; }   /* 그래도 넘치면(320px) 상자 안에서 가로로 민다 */
  .row-btn { flex: 0 0 auto; white-space: nowrap; }   /* 줄 끝 버튼(교대·대신 근무)이 줄어들어 글자가 깨지지 않게 */
  .duty-slot .row-btn { margin-left: auto; min-height: var(--tap); }
  .duty-slot .slot-who { display: flex; gap: 8px; align-items: center; flex: 1 1 0; flex-wrap: wrap; min-width: 0; word-break: keep-all; }
  @media (max-width: 480px) {   /* 좁은 화면: 라벨은 윗줄, 이름·칩·버튼은 아랫줄 */
    ul.list li.duty-slot { flex-wrap: wrap; row-gap: 0; }
    .duty-slot .slot-label { flex: 1 0 100%; }
  }
  .duty-gap { word-break: keep-all; }
  .nowrap { white-space: nowrap; }
</style>
<script>
  /** 근무표 화면(C8a): 주 목록(휴대폰 기본)·월 달력(PC 기본), 편성·운영 안 함은 날짜를 눌러 연 시트에서(근무표 담당자·관리자). 교대는 C9. */
  function renderScreen(root) {
    var state = { data: null, month: '', mode: window.innerWidth < 640 ? 'week' : 'month', week: 0, seq: 0 };
    var head = el('div'), body = el('div'), tabsBox = el('div'), recBox = el('div');
    root.appendChild(tabsBox); root.appendChild(head); root.appendChild(body); root.appendChild(recBox);
    state.view = typeof SCREEN_TAB === 'string' && SCREEN_TAB === 'record' ? 'record' : 'duty';   // [근무표 | 기록표]

    function monthShift(m, n) {
      var p = m.split('-'), t = (+p[0]) * 12 + (+p[1] - 1) + n;
      return Math.floor(t / 12) + '-' + ('0' + ((t % 12) + 1)).slice(-2);
    }
    function ymdKo(d) { return (+d.slice(5, 7)) + '월 ' + (+d.slice(8, 10)) + '일'; }
    function dayKo(d) { return ymdKo(d.date) + '(' + d.weekdayKo + ')'; }

    /** 월요일 시작 주로 나눈다(달 경계 안쪽만) */
    function weeksOf(days) {
      var out = [], cur = [];
      days.forEach(function (d) {
        if (d.weekdayKo === '월' && cur.length) { out.push(cur); cur = []; }
        cur.push(d);
      });
      if (cur.length) out.push(cur);
      return out;
    }
    function weekIndexOf(date) {
      var ws = weeksOf(state.data.days);
      for (var i = 0; i < ws.length; i++) if (ws[i].some(function (d) { return d.date === date; })) return i;
      return 0;
    }

    function load(month, opts) {
      opts = opts || {};
      var my = ++state.seq;
      call('getDutyMonth', month || state.month || '').then(function (data) {
        if (my !== state.seq) return;   // 더 나중에 누른 요청이 있으면 이 응답은 버린다
        state.data = data; state.month = data.month;
        var ws = weeksOf(data.days);
        if (opts.week === 'last') state.week = ws.length - 1;
        else if (typeof opts.week === 'number') state.week = opts.week;
        else if (opts.date) state.week = weekIndexOf(opts.date);
        else state.week = data.today.slice(0, 7) === data.month ? weekIndexOf(data.today) : 0;
        state.week = Math.max(0, Math.min(state.week, ws.length - 1));
        draw(opts.note, opts.noteWarn);
        if (opts.scrollTop) window.scrollTo(0, 0);   // 고정 머리말에 첫 줄이 가리지 않게
      }).catch(function (err) { if (my !== state.seq) return; clear(head); clear(body); showError(body, err); });
    }

    function draw(note, noteWarn) {
      var d = state.data, ws = weeksOf(d.days);
      clear(head);
      var weekMode = state.mode === 'week';
      // 제목은 연·월·주 / 날짜 범위 두 덩어리로, 날짜 범위는 중간에서 끊지 않는다
      var titleHead = d.month.slice(0, 4) + '년 ' + (+d.month.slice(5, 7)) + '월' + (weekMode ? ' ' + (state.week + 1) + '주' : '');
      var titleTail = weekMode ? '(' + (+ws[state.week][0].date.slice(8, 10)) + '일–' + (+ws[state.week][ws[state.week].length - 1].date.slice(8, 10)) + '일)' : '';
      function step(n) {
        if (!weekMode) return load(monthShift(d.month, n));
        var w = state.week + n;
        if (w < 0) return load(monthShift(d.month, -1), { week: 'last' });
        if (w >= ws.length) return load(monthShift(d.month, 1), { week: 0 });
        state.week = w; draw();
      }
      head.appendChild(el('div', { class: 'card' }, [
        el('div', { class: 'duty-nav' }, [
          el('button', { type: 'button', class: 'btn secondary', 'aria-label': weekMode ? '이전 주' : '이전 달', text: '‹', onclick: function () { step(-1); } }),
          el('span', { class: 'title' }, [titleHead, titleTail ? ' ' : null, titleTail ? el('span', { class: 'nowrap', text: titleTail }) : null]),
          el('button', { type: 'button', class: 'btn secondary', 'aria-label': weekMode ? '다음 주' : '다음 달', text: '›', onclick: function () { step(1); } })
        ]),
        UI.segmented({ label: '보기 방식', options: [{ value: 'week', label: '주 목록' }, { value: 'month', label: '월 달력' }], value: state.mode,
          onchange: function (v) { state.mode = v; draw(); } }),
        note ? el('div', { class: 'notice ' + (noteWarn ? 'warn' : 'info'), text: note }) : null,
        gapNotice(d),
        d.warnings.length ? el('div', { class: 'notice warn', text: d.warnings.slice(0, 3).join(' / ') }) : null
      ]));
      clear(body);
      if (!d.days.some(function (x) { return x.operating && x.slots.some(function (s) { return s.name; }); }) && !d.canEdit) {
        body.appendChild(UI.emptyState('이 달 근무표가 없습니다.'));
        return;
      }
      if (weekMode) ws[state.week].forEach(function (x) { body.appendChild(dayCard(x)); });
      else body.appendChild(monthTable(d));
    }

    function gapNotice(d) {
      if (!d.canEdit || !d.emptyDays) return null;
      // 오늘 이후의 빈 날만 적는다(지난 날은 근무표 담당자가 못 고치므로 달력·주 목록의 점선으로만 남긴다)
      var open = d.days.filter(function (x) { return x.operating && x.date >= d.today && x.slots.some(function (s) { return !s.name; }); });
      var parts = ['남은 빈 날 ' + d.emptyDays + '일 — '];
      open.slice(0, 3).forEach(function (x, i) { if (i) parts.push('·'); parts.push(el('span', { class: 'nowrap', text: dayKo(x) })); });
      if (open.length > 3) parts.push(' 외 ' + (open.length - 3) + '일');
      parts.push('. ' + (state.mode === 'month' ? '날짜 칸' : '날짜 줄') + '을 누르면 편성할 수 있습니다.');
      return el('div', { class: 'notice warn duty-gap' }, parts);
    }

    /* ───────── 주 목록 ───────── */
    function slotRow(s, x) {
      var who = s.name ? el('b', { text: s.swapped ? s.swappedFrom + ' → ' + s.name : s.name }) : UI.statusPill('requested', '비어 있음');
      var kids = [el('span', { class: 'slot-label', text: s.label }), el('span', { class: 'slot-who' }, [
        who,
        s.swapped ? UI.statusPill('confirmed', '교대') : null,
        s.mine ? UI.statusPill('todo', '내 근무') : null,
        s.slot === '예비' && s.name ? UI.statusPill('mute', '예비') : null
      ])];
      if (s.canSwap) {
        var proxy = state.data.canEdit;
        kids.push(el('button', { type: 'button', class: 'btn secondary row-btn', text: proxy ? '대신 근무' : '교대',
          'aria-label': dayKo(x) + ' ' + s.label + (proxy ? ' 대신 근무 기록' : ' 근무 교대'),
          onclick: function (e) { e.stopPropagation(); openSwap(x, s); } }));
      }
      return el('li', { class: 'duty-slot' }, kids);
    }
    function dayCard(x) {
      var editable = state.data.canEdit || state.data.canOperate;
      var card = el('div', { class: 'card duty-card' + (x.date === state.data.today ? ' today' : '') + (editable ? '' : ' readonly') }, [
        el('div', { class: 'duty-head' }, [
          el('h2', { text: dayKo(x) }),
          x.operating ? null : UI.statusPill('mute', '운영 안 함')
        ])
      ]);
      if (!x.operating) {
        card.appendChild(el('div', { class: 'muted', text: (x.memo ? '메모: ' + x.memo + ' · ' : '') + (state.data.canOperate ? '눌러서 운영으로 바꿀 수 있습니다.' : '근무표 담당자·관리자가 바꿉니다.') }));
      } else {
        if (x.memo) card.appendChild(el('div', { class: 'muted', text: '메모: ' + x.memo }));
        card.appendChild(el('ul', { class: 'list' }, x.slots.map(function (s) { return slotRow(s, x); })));
      }
      if (editable) {
        card.setAttribute('role', 'button'); card.setAttribute('tabindex', '0');
        card.setAttribute('aria-label', dayKo(x) + (state.data.canEdit ? ' 편성' : ' 운영 여부'));
        card.addEventListener('click', function () { openSheet(x); });
        card.addEventListener('keydown', function (e) { if (e.target !== card) return; if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openSheet(x); } });
      }
      return card;
    }

    /* ───────── 월 달력 ───────── */
    function monthTable(d) {
      var table = el('table', { class: 'duty-cal' });
      table.appendChild(el('thead', {}, [el('tr', {}, ['월', '화', '수', '목', '금', '토', '일'].map(function (w) { return el('th', { text: w }); }))]));
      var tb = el('tbody'), order = ['월', '화', '수', '목', '금', '토', '일'];
      var tr = el('tr'), col = 0;
      var lead = order.indexOf(d.days[0].weekdayKo);
      for (; col < lead; col++) tr.appendChild(el('td'));
      d.days.forEach(function (x) {
        if (col === 7) { tb.appendChild(tr); tr = el('tr'); col = 0; }
        var cls = 'duty-day', lines = [];
        var mine = x.slots.some(function (s) { return s.mine; });
        if (!x.operating) { cls += ' off'; lines.push('운영 안 함'); }
        else if (x.slots.every(function (s) { return !s.name; })) lines.push('편성 전');
        else x.slots.forEach(function (s) {
          var short = s.name ? s.name.charAt(0) + (s.swapped ? '*' : '') : '';
          var pre = s.slot === '예비' ? '예 ' : (s.slot === '단독' ? '근무 ' : s.slot.slice(0, 5) + ' ');
          lines.push(s.name ? pre + short : (s.slot === '예비' ? '예 -' : '⚠ 비어 있음'));
        });
        if (x.operating && x.slots.some(function (s) { return !s.name; }) && x.slots.some(function (s) { return s.name; })) cls += ' gap';
        if (mine) cls += ' mine';
        var btn = el('button', { type: 'button', class: cls, 'aria-label': dayKo(x) }, [el('b', { text: (+x.date.slice(8, 10)) + '일' })].concat(lines.map(function (t) { return el('div', { text: t }); })));
        if (mine) btn.appendChild(el('div', { text: '● 내 근무' }));
        btn.addEventListener('click', function () {
          if (state.data.canEdit || state.data.canOperate) openSheet(x);
          else { state.mode = 'week'; state.week = weekIndexOf(x.date); draw(); }   // 보기만 하는 교사는 그날 줄로 이동
        });
        tr.appendChild(el('td', {}, [btn]));
        col++;
      });
      for (; col < 7; col++) tr.appendChild(el('td'));
      tb.appendChild(tr);
      table.appendChild(tb);
      return el('div', {}, [
        el('div', { class: 'tablewrap', style: 'padding:4px' }, [table]),
        el('div', { class: 'muted', text: '칸의 성은 교사 이름(박 = 박선생), * = 교대로 실제 근무자가 바뀐 날, 예 = 예비 감독입니다. 날짜 칸을 누르면 ' + (d.canEdit || d.canOperate ? '편성 시트가 열립니다.' : '그날 줄로 이동합니다.') })
      ]);
    }

    /* ───────── 교대·대신 근무 시트(C9) ───────── */
    function openSwap(x, s) {
      var d = state.data, proxy = d.canEdit, busy = false, sheet = null;
      var standby = x.slots.filter(function (z) { return z.slot === '예비' && z.name; })[0];
      var sel = el('select');
      sel.appendChild(el('option', { value: '', text: '(고르기)' }));
      d.teachers.filter(function (t) { return t.id !== s.userId; }).forEach(function (t) { sel.appendChild(el('option', { value: t.id, text: t.name })); });
      if (proxy && standby && standby.userId !== s.userId) sel.value = standby.userId;   // 예비 감독이 대신 근무하는 경우가 기본
      var reason = proxy ? el('input', { type: 'text', maxlength: '100' }) : null;
      var err = el('div', { class: 'fix' });
      var content = el('div', {}, [
        kv([['날짜', dayKo(x)], ['근무', s.label + ' · ' + s.name]]),
        UI.field(proxy ? '실제 근무자' : '바꿀 선생님', sel),
        reason ? UI.field('이유(선택)', reason, { hint: '예: 병가, 학교 행사' }) : null,
        el('div', { class: 'notice info', text: proxy
          ? '예비 감독이 대신 근무하면 근무표 담당자가 기록합니다. 실제 근무자가 되면 월말 근무 기록표에 근무로 들어가고 예비 지정에서는 빠집니다. 예비 본인에게는 교대 버튼이 없습니다.'
          : '상대 선생님과 근무표 담당자에게 알림이 갑니다. 승인 절차는 없습니다.' }),
        err
      ]);
      function chosenName() { var o = sel.options[sel.selectedIndex]; return o ? o.text : ''; }
      function refresh() { if (sheet) sheet.buttons[1].disabled = busy || !sel.value; }
      sel.addEventListener('change', refresh);
      function doSwap(ack) {
        busy = true; refresh(); err.textContent = '';
        call('swapDuty', s.slotId, sel.value, { acknowledge: !!ack, reason: reason ? reason.value.trim() : '' }).then(function (r) {
          if (r.needsConfirm) {
            busy = false; refresh();
            return UI.confirmSheet({ title: '같은 날 다른 칸에도 있습니다', lead: r.warnings[0], lines: ['그래도 교대하면 한 선생님이 두 칸을 맡습니다'], confirmText: '그대로 교대',
              onconfirm: function () { doSwap(true); } });
          }
          if (!r.ok) { busy = false; refresh(); err.textContent = r.errors.map(function (e) { return e.message; }).join(' '); return; }
          sheet.close();
          var msg = proxy ? '대신 근무로 기록했습니다.' : '교대했습니다.';
          var fail = msg + ' 메일을 보내지 못했습니다. 상대 선생님께 직접 알려 주세요.';
          UI.toast(r.notified ? msg + ' 상대 선생님과 근무표 담당자에게 메일을 보냈습니다.' : fail, r.notified ? undefined : { kind: 'warn', ms: 8000 });
          load(state.month, { week: state.week, note: r.notified ? '' : fail, noteWarn: !r.notified, scrollTop: true });
        }).catch(function (e) { busy = false; refresh(); err.textContent = (e && e.message) || String(e); });
      }
      sheet = UI.bottomSheet({
        title: proxy ? '대신 근무 기록' : '근무 교대', content: content,
        actions: [{ text: '취소', kind: 'secondary', onclick: function () { sheet.close(); } },
          { text: proxy ? '기록하기' : '교대하기', disabled: true, onclick: function () {
            if (busy || !sel.value) return;
            UI.confirmSheet({ title: proxy ? '대신 근무를 기록합니다' : '근무를 교대합니다', lead: dayKo(x) + ' ' + s.label + ': ' + s.name + ' → ' + chosenName(),
              lines: [(proxy ? '실제 근무자로 기록되고 ' : '') + '상대 선생님과 근무표 담당자에게 메일이 갑니다', '승인 절차가 없어 바로 바뀝니다'],
              confirmText: proxy ? '기록하기' : '교대하기', onconfirm: function () { doSwap(false); } });
          } }]
      });
      sheet.open(); refresh();
    }

    /* ───────── 편성·운영 시트 ───────── */
    function openSheet(x) {
      var d = state.data, sheet = null, busy = false;
      var op = x.operating, memo0 = x.memo || '';
      var pastLocked = (d.canOperate || d.canEdit) && x.date < d.today && !d.canEditPast;   // 지난 날짜는 관리자만 편성·운영 여부를 바꾼다(결정 54)
      var opSeg = d.canOperate && !pastLocked ? UI.segmented({ label: '운영 여부', options: [{ value: 'on', label: '운영' }, { value: 'off', label: '운영 안 함' }], value: op ? 'on' : 'off',
        onchange: function () { drawSlots(); refresh(); } }) : null;
      var memoIn = el('input', { type: 'text', maxlength: '60', value: memo0 });
      memoIn.addEventListener('input', refresh);
      var slotBox = el('div', { class: 'duty-sheet-slots' });
      var selects = {}, initial = {};
      x.slots.forEach(function (s) { initial[s.slot] = s.userId || ''; });
      function wantOn() { return opSeg ? opSeg.getValue() === 'on' : x.operating; }
      function drawSlots() {
        clear(slotBox);
        if (!wantOn()) {
          if (opSeg) slotBox.appendChild(el('div', { class: 'notice warn', text: '운영 안 함으로 바꾸면 그날 출석부가 사라지고 편성된 근무 칸은 취소됩니다(기록은 남습니다). 저장할 때 한 번 더 확인합니다.' }));
          return;
        }
        if (!d.canEdit) return;
        if (!x.operating) { slotBox.appendChild(el('div', { class: 'muted', text: '운영으로 바꾼 뒤 저장하면 근무 칸을 편성할 수 있습니다. 앞서 취소된 근무 칸은 되살아나지 않으니 다시 편성해 주세요.' })); return; }
        x.slots.forEach(function (s) {
          var sel = selects[s.slot] || el('select');
          if (!selects[s.slot]) {
            sel.appendChild(el('option', { value: '', text: '(비어 있음)' }));
            d.teachers.forEach(function (t) { sel.appendChild(el('option', { value: t.id, text: t.name })); });
            sel.value = initial[s.slot];
            if (initial[s.slot] && !d.teachers.some(function (t) { return t.id === initial[s.slot]; })) {
              sel.appendChild(el('option', { value: initial[s.slot], text: s.name })); sel.value = initial[s.slot];   // 지금은 목록에 없는 교사(교대·비활성)도 그대로 보인다
            }
            sel.addEventListener('change', refresh);
            selects[s.slot] = sel;
          }
          var label = s.slot === '21:30조' || s.slot === '23:00조' ? (s.end || s.slot.slice(0, 5)) + '까지' : s.label;
          var hint = s.swapped ? '교대된 칸(' + s.swappedFrom + ' → ' + s.name + ')은 편성으로 바꿀 수 없습니다.'
            : (s.slot === '예비' ? '예비로 지정된 날은 근무 기록표에 따로 셉니다. 대신 근무하면 근무로만 셉니다.' : '');
          slotBox.appendChild(UI.field(label, sel, hint ? { hint: hint } : {}));
          sel.disabled = s.swapped || pastLocked;
        });
      }
      function slotChanges() {
        var out = {};
        if (!d.canEdit || pastLocked || !x.operating || !wantOn()) return out;
        x.slots.forEach(function (s) { if (selects[s.slot] && !s.swapped && selects[s.slot].value !== initial[s.slot]) out[s.slot] = selects[s.slot].value; });
        return out;
      }
      function opChanged() { return !!opSeg && (wantOn() !== x.operating || memoIn.value.trim() !== memo0); }
      function dirty() { return opChanged() || Object.keys(slotChanges()).length > 0; }
      function refresh() { if (sheet) sheet.buttons[1].disabled = busy || !dirty(); }

      var content = el('div', {}, [
        pastLocked ? el('div', { class: 'notice warn', text: '지난 날짜는 바꿀 수 없습니다. 실제로 바뀐 근무는 아래 [대신 근무 기록]으로 남겨 주세요. 운영 여부는 필요하면 관리자에게 알려 주세요.' }) : null,
        pastLocked ? el('div', {}, x.slots.filter(function (q) { return q.canSwap; }).map(function (q) {
          return el('button', { type: 'button', class: 'btn secondary row-btn', style: 'margin:4px 8px 8px 0', text: q.label + ' 대신 근무 기록',
            onclick: function () { sheet.close(); openSwap(x, q); } });
        })) : null,
        opSeg ? UI.field('운영 여부', opSeg) : null,
        opSeg ? UI.field('메모(선택)', memoIn, { hint: '예: 수능 전날, 학교 행사' }) : (x.memo ? el('div', { class: 'muted', text: '메모: ' + x.memo }) : null),
        slotBox, el('div', { class: 'fix', id: 'duty-err' })
      ]);
      drawSlots();
      function err(msg) { var n = content.querySelector('#duty-err'); n.textContent = msg || ''; }

      function done(msg) { sheet.close(); load(state.data.month, { week: state.week, note: msg }); }
      function fail(e) { busy = false; refresh(); err((e && e.message) || String(e)); }

      function saveSlots(ack) {
        var ch = slotChanges();
        if (!Object.keys(ch).length) return done('저장했습니다.');
        call('saveDutyDay', { date: x.date, slots: ch, acknowledge: !!ack }).then(function (r) {
          if (r.ok) return done('저장했습니다.');
          if (r.needsConfirm) {
            busy = false; refresh();
            return UI.confirmSheet({ title: dayKo(x) + ' 근무 편성', lead: '같은 선생님이 두 칸에 들어갑니다', lines: r.warnings, confirmText: '그대로 저장',
              onconfirm: function () { busy = true; refresh(); saveSlots(true); } });
          }
          busy = false; refresh(); err(r.errors.map(function (e) { return e.message; }).join(' '));
        }).catch(fail);
      }
      function saveOp(ids) {
        call('setDutyOperating', { date: x.date, operating: wantOn(), memo: memoIn.value.trim(), confirmIds: ids }).then(function (r) {
          if (r.ok) return saveSlots(false);
          if (r.needsConfirm) {
            busy = false; refresh();
            return UI.confirmSheet({ title: dayKo(x) + '을 운영 안 함으로 바꿉니다', lead: '그날 출석부가 사라집니다',
              lines: r.warnings.concat(['특이사항·OUT 기록은 그대로 남습니다', '다시 운영으로 바꾸면 출석부가 다시 만들어집니다']),
              confirmText: '운영 안 함으로 바꾸기', danger: true, onconfirm: function () { busy = true; refresh(); saveOp(r.confirmIds); } });
          }
          busy = false; refresh(); err(r.errors.map(function (e) { return e.message; }).join(' '));
        }).catch(fail);
      }
      function save() {
        if (busy || !dirty()) return;
        busy = true; refresh(); err('');
        if (opChanged() && !wantOn() && x.operating && !d.canOperate) return fail(new Error('권한이 없습니다.'));
        if (opChanged()) saveOp(null); else saveSlots(false);
      }
      sheet = UI.bottomSheet({
        title: dayKo(x) + (d.canEdit ? ' 근무 편성' : ' 운영 여부'), content: content,
        actions: [{ text: '닫기', kind: 'secondary', onclick: function () { sheet.close(); } }, { text: '저장', disabled: true, onclick: save }]
      });
      sheet.open();
      refresh();
    }

    /* ───────── 기록표 탭(C14): 월말 근무 기록, 근무표 담당자·관리자는 PDF(임시 양식), 학사 교사는 본인 행만 ───────── */
    function drawViewTabs() {
      clear(tabsBox);
      tabsBox.appendChild(UI.segmented({ label: '화면', options: [{ value: 'duty', label: '근무표' }, { value: 'record', label: '기록표' }], value: state.view,
        onchange: function (v) { state.view = v; showView(); } }));
      tabsBox.style.marginBottom = '12px';
    }
    function showView() {
      var rec = state.view === 'record';
      head.style.display = rec ? 'none' : ''; body.style.display = rec ? 'none' : ''; recBox.style.display = rec ? '' : 'none';
      if (!rec) recSeq++;   // 기록표를 떠나면 만드는 중이던 PDF는 쓰지 않는다(숨은 링크로 받아지지 않게)
      if (rec) loadRecord(recMonth || state.month || '');
    }
    var recSeq = 0, recMonth = '';   // 기록표가 보는 달은 근무표(state.month)와 따로 둔다
    function loadRecord(month) {
      var my = ++recSeq;
      clear(recBox); recBox.appendChild(el('div', { class: 'loading', text: '불러오는 중…' }));
      call('getDutyRecord', month).then(function (r) {
        if (my !== recSeq) return;
        recMonth = r.month; drawRecord(r);
      }).catch(function (err) { if (my !== recSeq) return; clear(recBox); showError(recBox, err); });
    }
    function koStamp(t) { return (+t.slice(5, 7)) + '월 ' + (+t.slice(8, 10)) + '일 ' + t.slice(11, 16); }
    function drawRecord(r) {
      clear(recBox);
      var nav = el('div', { class: 'card' }, [el('div', { class: 'duty-nav' }, [
        el('button', { type: 'button', class: 'btn secondary', 'aria-label': '이전 달', text: '‹', onclick: function () { loadRecord(monthShift(r.month, -1)); } }),
        el('span', { class: 'title', text: r.month.slice(0, 4) + '년 ' + (+r.month.slice(5, 7)) + '월' }),
        el('button', { type: 'button', class: 'btn secondary', 'aria-label': '다음 달', text: '›', onclick: function () { loadRecord(monthShift(r.month, 1)); } })
      ])]);
      recBox.appendChild(nav);
      if (!r.canFile) nav.appendChild(el('div', { class: 'notice info', text: '본인 근무 기록만 보입니다.' }));
      if (r.warnings && r.warnings.length) nav.appendChild(el('div', { class: 'notice warn', text: r.warnings.slice(0, 3).join(' / ') }));
      if (!r.teachers.length && !r.swaps.length) { recBox.appendChild(UI.emptyState('이 달 근무 기록이 없습니다.')); return; }
      var small = 'color:var(--muted-ink);font-size:var(--font-sm)';
      var table = el('table', { class: 'data compact duty-rec' });
      if (!r.teachers.length) recBox.appendChild(el('div', { class: 'card' }, [el('div', { class: 'muted', text: '이 달 본인 근무는 없습니다(교대로 넘긴 기록만 아래에 보입니다).' })]));
      table.appendChild(el('thead', {}, [el('tr', {}, ['교사', '근무', '21:30', '23:00', '단독', '예비'].map(function (h) { return el('th', { scope: 'col', text: h }); }))]));
      var tb = el('tbody');
      function row(name, total, by, standby, cls) {
        tb.appendChild(el('tr', { class: cls || '' }, [el('th', { scope: 'row', text: name }),
          el('td', { text: total + '회', style: 'font-size:var(--font-lg);font-weight:700' }),
          el('td', { text: String(by['21:30조'] || 0), style: small }), el('td', { text: String(by['23:00조'] || 0), style: small }), el('td', { text: String(by['단독'] || 0), style: small }),
          el('td', { text: String(standby), style: small })]));
      }
      r.teachers.forEach(function (t) { row(t.name, t.total, t.bySlot, t.standby); });
      if (r.totals) row('합계', r.totals.total, r.totals.bySlot, r.totals.standby, 'total');
      table.appendChild(tb);
      if (r.teachers.length) recBox.appendChild(el('div', { class: 'card' }, [
        el('div', { class: 'tablewrap duty-recwrap' }, [table]),
        el('div', { class: 'muted', style: 'margin-top:8px', text: 'ⓘ "근무" 합계가 주 숫자입니다(21:30조·23:00조 수당은 같아 조별 횟수는 참고). "예비 지정"은 따로 세며, 대신 근무한 날은 근무로만 세고 예비 지정에서는 뺍니다.' })
      ]));
      var sw = el('div', { class: 'card' }, [el('h2', { text: '교대 ' + r.swaps.length + '건' })]);
      if (!r.swaps.length) sw.appendChild(el('div', { class: 'muted', text: '이 달 교대는 없습니다.' }));
      else sw.appendChild(el('ul', { class: 'list' }, r.swaps.map(function (x) {
        return el('li', {}, [el('span', { text: (+x.date.slice(5, 7)) + '월 ' + (+x.date.slice(8, 10)) + '일(' + x.weekdayKo + ') ' + x.label + ' ' + x.from + ' → ' + x.to + (x.kind === '대신 근무' ? ' (예비 감독이 대신 근무, 근무로 셈)' : '') })]);
      })));
      recBox.appendChild(sw);
      recBox.appendChild(el('div', { class: 'muted', text: '이 표는 ' + koStamp(r.generatedAt) + '에 만들었고, 근무표는 ' + (r.lastChangedAt ? koStamp(r.lastChangedAt) + '에 마지막으로 바뀌었습니다.' : '바뀐 적이 없습니다.') + ' 출력한 뒤 근무표가 또 바뀌었는지 이 시각으로 확인하세요.' }));
      if (r.canFile) {
        var btn = el('button', { type: 'button', class: 'btn', style: 'margin-top:12px', text: 'PDF 받기(임시 양식)' });
        btn.addEventListener('click', function () {
          var mine = recSeq;   // 만드는 동안 달·탭이 바뀌면 이 PDF는 쓰지 않는다
          btn.disabled = true; btn.textContent = 'PDF 만드는 중…';
          call('getDutyRecordFile', r.month, 'pdf').then(function (f) {
            if (mine !== recSeq || !btn.parentNode) { UI.toast('기록표가 바뀌어 이 PDF는 쓰지 않았습니다. 필요하면 기록표에서 PDF 받기를 다시 눌러 주세요.', { kind: 'warn', ms: 5000 }); return; }
            btn.disabled = false; btn.textContent = 'PDF 받기(임시 양식)';
            if (!f.ok) { UI.toast(f.error || 'PDF를 만들지 못했습니다.', { kind: 'warn', ms: 5000 }); return; }
            var bin = atob(f.base64), arr = new Uint8Array(bin.length);
            for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
            var url = URL.createObjectURL(new Blob([arr], { type: 'application/pdf' }));
            var a = el('a', { class: 'btn secondary', style: 'margin-left:8px', href: url, download: f.name, text: f.name + ' 열기' });
            var old = recBox.querySelector('a.btn.secondary[download]'); if (old) old.remove();
            btn.parentNode.insertBefore(a, btn.nextSibling); a.click();
            UI.toast('PDF를 만들었습니다. 받아지지 않으면 옆 링크를 누르세요.', { kind: 'ok', ms: 5000 });
          }).catch(function (err) { if (mine === recSeq) { btn.disabled = false; btn.textContent = 'PDF 받기(임시 양식)'; } UI.toast((err && err.message) || String(err), { kind: 'warn', ms: 5000 }); });
        });
        recBox.appendChild(btn);
      }
    }

    drawViewTabs();
    // ?date=yyyy-MM-dd가 오면 그 날짜의 달·주로 연다(출석부의 "근무표에서 고치기"·보기)
    var wantDate = typeof SCREEN_DATE === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(SCREEN_DATE) ? SCREEN_DATE : '';
    if (wantDate) load(wantDate.slice(0, 7), { date: wantDate }); else load('');
    showView();   // 기록표로 열리면(?tab=record) 근무표 자료는 뒤에서 불러 두고 기록표를 보인다
  }
</script>
