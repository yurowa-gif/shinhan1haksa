<style>
  /* 신한1학사 공통 스타일. 소유: DESIGN 세션. 규칙·이유는 docs/design/rules.md.
     화면 파일은 색·크기를 var(--…) 토큰으로만 쓴다(새 색을 직접 쓰지 않는다). */

  /* ───────── 토큰 ───────── */
  :root {
    /* 바탕·글자·선 */
    --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #5d6676; --line: #dde1e7;
    /* 주 색(링크·주 버튼·선택됨) */
    --accent: #1f5fbf; --accent-weak: #e8f0fc; --accent-ink: #164a99;
    /* 경고·오류 */
    --warn: #b3261e; --warn-weak: #fdecea;
    /* 상태 색: 글자색(-ink)은 연한 바탕(-weak) 위에서 대비 4.5:1 이상 */
    --ok: #1b7f3b; --ok-ink: #14662e; --ok-weak: #e4f4e9;
    --caution-ink: #7a4300; --caution-weak: #fff1d1; --caution-line: #c98a00;
    --muted-ink: #4b5363; --muted-weak: #eceef2;
    /* 코드 색: 학(학원)·가(가정)·병(병결 계열) */
    --code-hak-ink: #164a99; --code-hak-weak: #e1ecfb;
    --code-ga-ink: #5b2e91; --code-ga-weak: #efe7fa;
    --code-byung-ink: #00586b; --code-byung-weak: #def3f6;
    /* OUT */
    --out1-ink: #8a3200; --out1-weak: #ffe5d2; --out1-line: #d9661a;
    --out2: #b3261e; --out2-ink: #fff;
    /* 크기 */
    --font-base: 18px; --font-sm: .9rem; --font-xs: .8rem; --font-lg: 1.1rem; --font-xl: 1.5rem;
    --tap: 48px;          /* 누르는 칸 최소 높이·너비 */
    --bar-h: 72px;        /* 하단 작업 바 높이(안전 영역 제외) */
    --gap: 12px; --gap-sm: 8px; --gap-lg: 16px;
    --radius: 12px; --radius-sm: 10px; --radius-pill: 999px;
    --shadow: 0 -2px 8px rgba(29, 35, 48, .12);
    --focus: #1f5fbf;
  }

  /* ───────── 바탕 ───────── */
  * { box-sizing: border-box; }
  html { font-size: 18px; -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; line-height: 1.5;
    overflow-wrap: anywhere; }
  img, table { max-width: 100%; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden;
    clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

  /* ───────── 화면 틀: 위 머리 · 본문 · 아래 작업 바 ───────── */
  header.top { position: sticky; top: 0; z-index: 2; background: var(--card); border-bottom: 1px solid var(--line);
    padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  header.top h1 { font-size: 1.1rem; margin: 0; }
  header.top .who { font-size: .85rem; color: var(--muted); text-align: right; }
  .back { display: inline-flex; align-items: center; min-height: var(--tap); color: var(--accent);
    text-decoration: none; white-space: nowrap; }
  main { max-width: 720px; margin: 0 auto; padding: 16px; }
  /* 하단 작업 바가 있는 화면은 main에 has-actionbar를 붙여 바에 가려지지 않게 한다 */
  main.has-actionbar { padding-bottom: calc(var(--bar-h) + 24px + env(safe-area-inset-bottom, 0px)); }
  .actionbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; background: var(--card);
    border-top: 1px solid var(--line); box-shadow: var(--shadow);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; gap: var(--gap-sm);
    justify-content: center; }
  .actionbar > .btn { flex: 1 1 0; max-width: 360px; }
  .tabs { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 12px; }
  .tab { flex: 0 0 auto; padding: 10px 16px; border-radius: var(--radius-pill); border: 1px solid var(--line);
    background: var(--card); color: var(--text); text-decoration: none; font-size: .95rem; cursor: pointer;
    min-height: var(--tap); display: inline-flex; align-items: center; }
  .tab.on { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* ───────── 카드·목록·글자 ───────── */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
  .card h2 { font-size: 1rem; margin: 0 0 8px; }
  .muted { color: var(--muted); font-size: .9rem; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
  .stat { background: var(--accent-weak); border-radius: var(--radius-sm); padding: 12px; }
  .stat .n { font-size: 1.5rem; font-weight: 700; }
  .stat .l { font-size: .85rem; color: var(--muted); }
  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list li { padding: 12px 4px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; }
  ul.list li:last-child { border-bottom: 0; }
  dl.kv { display: grid; grid-template-columns: 7em 1fr; gap: 6px 12px; margin: 0; }
  dl.kv dt { color: var(--muted); }
  dl.kv dd { margin: 0; }
  .soon { border-style: dashed; color: var(--muted); }
  .loading { color: var(--muted); padding: 16px 0; }
  footer { text-align: center; padding: 24px 16px; font-size: .8rem; color: var(--muted); }
  footer a { color: var(--muted); }

  /* ───────── 버튼: 모두 48px 이상, 주 버튼은 한 화면에 하나 ───────── */
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: var(--tap); min-width: var(--tap);
    padding: 12px 18px; border-radius: var(--radius-sm); border: 1px solid var(--accent);
    background: var(--accent); color: #fff; font: inherit; font-size: 1rem; cursor: pointer; text-decoration: none; text-align: center; }
  .btn.secondary { background: var(--card); color: var(--accent); }
  .btn.danger { background: var(--warn); border-color: var(--warn); color: #fff; }
  .btn.block { display: flex; width: 100%; }
  .btn:disabled, .btn[aria-disabled="true"] { background: var(--muted-weak); border-color: var(--line); color: var(--muted-ink); cursor: not-allowed; }

  /* ───────── 입력칸: 라벨 + 입력 + 고칠 점(무엇을 하면 되는지) ───────── */
  .field { margin-bottom: 14px; }
  .field label { display: block; margin-bottom: 4px; color: var(--muted); font-size: .9rem; }
  .field input, .field select, .field textarea { width: 100%; min-height: var(--tap); padding: 8px 12px; font: inherit;
    border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--card); color: var(--text); }
  .field textarea { min-height: 96px; }
  .field .hint { color: var(--muted); font-size: .85rem; margin-top: 4px; }
  .field .fix { color: var(--warn); font-size: .9rem; margin-top: 4px; }
  .field.invalid input, .field.invalid select, .field.invalid textarea { border-color: var(--warn); border-width: 2px; }

  /* ───────── 안내 줄: 글자와 모양(아이콘 글자)을 함께 쓴다 ───────── */
  .notice { border-radius: var(--radius-sm); padding: 12px; margin-bottom: 12px; border: 1px solid transparent; }
  .notice::before { font-weight: 700; margin-right: .4em; }
  .error { background: var(--warn-weak); color: var(--warn); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 12px; }
  .error::before { content: "⚠ "; font-weight: 700; }
  .notice.warn { background: var(--caution-weak); color: var(--caution-ink); border-color: var(--caution-line); }
  .notice.warn::before { content: "⚠"; }
  .notice.ok { background: var(--ok-weak); color: var(--ok-ink); }
  .notice.ok::before { content: "✓"; }
  .notice.info { background: var(--accent-weak); color: var(--accent-ink); }
  .notice.info::before { content: "ⓘ"; }

  /* ───────── 상태 표시(pill): 색만으로 구분하지 않는다 ─────────
     모양: 앞 글자(✓ ◔ ⊘ ⚠ …)와 테두리 모양(실선·점선·이중선)이 다르다. 글자는 항상 함께 쓴다. */
  .pill { display: inline-flex; align-items: center; gap: .25em; padding: 2px 10px; border-radius: var(--radius-pill);
    font-size: var(--font-sm); font-weight: 700; line-height: 1.5; white-space: nowrap; border: 1.5px solid currentColor; }
  .pill.s-confirmed { color: var(--ok-ink); background: var(--ok-weak); border-style: solid; }
  .pill.s-confirmed::before { content: "✓"; }
  .pill.s-requested { color: var(--caution-ink); background: var(--caution-weak); border-style: dashed; }
  .pill.s-requested::before { content: "…"; }
  .pill.s-canceled { color: var(--muted-ink); background: var(--muted-weak); border-style: dotted; text-decoration: line-through; }
  .pill.s-canceled::before { content: "⊘"; text-decoration: none; display: inline-block; }
  .pill.c-hak { color: var(--code-hak-ink); background: var(--code-hak-weak); border-style: solid; }
  .pill.c-ga { color: var(--code-ga-ink); background: var(--code-ga-weak); border-style: double; border-width: 3px; }
  .pill.c-byung { color: var(--code-byung-ink); background: var(--code-byung-weak); border-style: dashed; }
  .pill.out-1 { color: var(--out1-ink); background: var(--out1-weak); border-color: var(--out1-line); border-style: solid; }
  .pill.out-1::before { content: "▲"; }
  .pill.out-2 { color: var(--out2-ink); background: var(--out2); border-color: var(--out2); border-style: solid; }
  .pill.out-2::before { content: "⛔"; }
  .pill.todo { color: var(--accent-ink); background: var(--accent-weak); border-color: var(--accent); }
  .pill.todo::before { content: "●"; font-size: .7em; }
  .pill.mute { color: var(--muted-ink); background: var(--muted-weak); border-color: var(--line); }

  /* 알림 개수 배지(숫자는 글자로 함께 쓴다) */
  .count { display: inline-block; min-width: 1.6em; padding: 0 .45em; border-radius: var(--radius-pill);
    background: var(--warn); color: #fff; font-size: var(--font-sm); font-weight: 700; text-align: center; }

  /* ───────── 공통 컴포넌트(UI.*, src/ui/Components.html) ───────── */
  .chips { display: flex; flex-wrap: wrap; gap: var(--gap-sm); margin: 4px 0 8px; }
  .chip { min-height: var(--tap); min-width: var(--tap); padding: 8px 16px; border-radius: var(--radius-pill); border: 1px solid var(--line);
    background: var(--card); color: var(--text); font: inherit; font-size: 1rem; cursor: pointer; }
  .chip:disabled { background: var(--muted-weak); border-style: dashed; color: var(--muted-ink); cursor: not-allowed; }
  .row-btn { flex: 0 0 auto; white-space: nowrap; }
  .tabs.wrap { flex-wrap: wrap; overflow-x: visible; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .chip.on::before { content: "✓ "; }
  .segmented { display: flex; border: 1px solid var(--accent); border-radius: var(--radius-sm); overflow: hidden; margin-bottom: 12px; }
  .seg { flex: 1 1 0; min-height: var(--tap); padding: 8px 6px; border: 0; border-right: 1px solid var(--accent);
    background: var(--card); color: var(--accent); font: inherit; font-size: 1rem; cursor: pointer; }
  .seg:last-child { border-right: 0; }
  .seg.on { background: var(--accent); color: #fff; font-weight: 700; }
  .seg.on::before { content: "✓ "; }
  .empty { text-align: center; color: var(--muted); padding: 24px 8px; }
  .empty p { margin: 0 0 12px; }
  .check { display: flex; align-items: center; gap: var(--gap-sm); min-height: var(--tap); cursor: pointer; }
  .check input { width: 28px; height: 28px; flex: 0 0 auto; }
  .range { padding-bottom: 8px; }
  .picker { margin-bottom: 12px; }
  .seat-text { word-break: keep-all; }
  .seat-fixed, .seat-gap { cursor: default; }
  .range-summary { color: var(--accent-ink); font-weight: 700; min-height: 1.5em; }
  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(var(--bar-h) + 24px + env(safe-area-inset-bottom, 0px)); z-index: 20;
    max-width: 480px; margin: 0 auto; padding: 12px 16px; border-radius: var(--radius-sm); font-size: 1rem; border: 1px solid transparent; box-shadow: var(--shadow); }
  .toast::before { font-weight: 700; margin-right: .4em; }
  .toast.ok { background: var(--ok-weak); color: var(--ok-ink); border-color: var(--ok); }
  .toast.ok::before { content: "✓"; }
  .toast.warn { background: var(--caution-weak); color: var(--caution-ink); border-color: var(--caution-line); }
  .toast.warn::before { content: "⚠"; }
  .toast.info { background: var(--accent-weak); color: var(--accent-ink); border-color: var(--accent); }
  .toast.info::before { content: "ⓘ"; }
  .sheet-scrim { position: fixed; inset: 0; z-index: 10; background: rgba(29, 35, 48, .5); display: flex; align-items: flex-end; justify-content: center; }
  .sheet { width: 100%; max-width: 720px; max-height: 85vh; overflow-y: auto; background: var(--card); border-radius: var(--radius) var(--radius) 0 0;
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
  .sheet h2 { font-size: var(--font-lg); margin: 0 0 8px; }
  /* 한국어는 낱말 중간에서 끊지 않고 띄어쓰기에서만 줄을 바꾼다(360px). 낱말 하나가 줄보다 길 때(긴 영문·숫자)만 강제로 끊는다 */
  .seg, .sheet h2, .sheet-body, .sheet-lead { word-break: keep-all; overflow-wrap: anywhere; }
  .sheet-body p { margin: 0 0 12px; }
  .sheet-actions { display: flex; gap: var(--gap-sm); margin-top: 8px; }
  .sheet-actions .btn { flex: 1 1 0; }
  .sheet-lead { font-size: var(--font-xl); font-weight: 700; line-height: 1.3; color: var(--accent-ink); }
  .sheet-body ul.list li { padding: 8px 4px; }
  /* 표(식수 집계 등): 화면은 안 밀리고 표 안에서만 가로로 민다. 첫 열 고정, 합계 줄은 굵게+회색 바탕 */
  .tablewrap { overflow-x: auto; max-width: 100%; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--card); margin-bottom: 12px; }
  table.data { border-collapse: collapse; width: 100%; font-size: 1rem; }
  table.data th, table.data td { padding: 10px 12px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.data th:first-child, table.data td:first-child { text-align: left; position: sticky; left: 0; background: var(--card); }
  table.data thead th, table.data thead th:first-child { background: var(--muted-weak); color: var(--muted-ink); font-size: var(--font-sm); }
  table.data.compact th, table.data.compact td { padding: 10px 6px; }
  table.data tr.total th, table.data tr.total td { font-weight: 700; background: var(--muted-weak); }
  /* 월 달력: 날짜 칸 48px 이상, 칸 안에서만 가로로 민다 */
  table.duty-cal { border-collapse: separate; border-spacing: 4px; width: 100%; min-width: 28rem; table-layout: fixed; }
  table.duty-cal th { font-size: var(--font-sm); color: var(--muted-ink); padding: 4px 0; }
  table.duty-cal td { vertical-align: top; padding: 0; }
  .duty-day { word-break: keep-all; display: block; width: 100%; min-height: 72px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--card);
    color: var(--text); font: inherit; font-size: var(--font-xs); line-height: 1.3; text-align: left; cursor: pointer; }
  .duty-day b { display: block; font-size: var(--font-sm); }
  .duty-day.off { background: var(--muted-weak); color: var(--muted-ink); border-style: dotted; }
  .duty-day.gap { border: 2px dashed var(--caution-line); background: var(--caution-weak); color: var(--caution-ink); }
  .duty-day.mine { border: 3px solid var(--accent); background: var(--accent-weak); }
  .picker-list { list-style: none; margin: 0 0 8px; padding: 0; }
  .picker-list li { margin-bottom: 4px; }
  .picker-list li.muted { padding: 8px 4px; }
  .picker-item { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: 8px; min-height: var(--tap); padding: 8px 12px;
    border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--card); color: var(--text); font: inherit; text-align: left; cursor: pointer; }
  .picker-chosen { display: flex; align-items: center; gap: var(--gap-sm); flex-wrap: wrap; }
  .picker-chosen .picker-name { font-weight: 700; }
  .seatgrid-wrap { overflow-x: auto; max-width: 100%; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--card); }
  table.seatgrid { border-collapse: separate; border-spacing: 4px; }
  .seatgrid td { padding: 0; height: var(--tap); min-width: 76px; text-align: center; vertical-align: middle; font-size: var(--font-xs); color: var(--muted-ink); }
  .seatgrid td.pillar { background: var(--muted-weak); }
  .seatgrid td.door, .seatgrid td.window { border: 1px dashed var(--muted-ink); }
  .seat-cell { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; min-height: var(--tap); padding: 2px 4px;
    border: 1px solid var(--muted-ink); border-radius: 8px; background: var(--card); color: var(--text); font: inherit; font-size: var(--font-xs); line-height: 1.2; cursor: pointer; }
  .seat-cell .seat-no { color: var(--muted-ink); }
  .seat-cell.vacant { border-style: dashed; color: var(--muted-ink); background: var(--muted-weak); }
  .seat-cell.sel { border: 3px solid var(--accent); background: var(--accent-weak); font-weight: 700; }
  .seat-cell.sel .seat-no::before { content: "✓ "; }
</style>
