<!-- 웹폰트(결정 88): Pretendard — SIL OFL 1.1, © Kil Hyung-jin. 쓰는 글자 조각만 받는다(dynamic subset). 못 받으면 기기 기본 한글 글꼴로 보인다.
     글꼴 요청에는 쿠키도 출처(Referer)도 보내지 않는다(crossorigin, referrerpolicy) -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
  /* 신한1학사 공통 스타일. 소유: DESIGN 세션. 규칙·이유는 docs/design/rules.md.
     화면 파일은 색·크기를 var(--…) 토큰으로만 쓴다(새 색을 직접 쓰지 않는다).
     색(결정 88, 1차 ③ 감색 면): 감색 머리줄·버튼, 살구색은 처리할 건수에만, 아래는 조용한 흰 바탕. 값을 정한 방법은 docs/design/principles.md. */

  /* ───────── 토큰 ───────── */
  :root {
    /* 바탕·글자·선 */
    --bg: #f6f8fb; --card: #fff; --text: #121826; --muted: #4e5566; --line: #d7dbe3;
    --field-line: #747a8a;   /* 입력칸·테두리 버튼의 테두리: 흰 바탕과 3:1 이상 */
    /* 주 색(감색): 머리줄·주 버튼·선택됨 / 연한 바탕 / 연한 바탕 위 글자 / 감색 면 위 글자 */
    --accent: #1a295d; --accent-weak: #dde4f6; --accent-ink: #1a295d; --on-accent: #f6f8fe; --on-accent-muted: #c7d1e9;
    /* 강조 색(살구): 진짜 할 일(마감·미처리 건수 > 0)의 숫자·알약에만. 글자는 -ink */
    --signal: #ffc07a; --signal-ink: #121826;
    /* 경고·오류 */
    --warn: #b7191c; --warn-weak: #ffebe8;
    /* 상태 색: 글자색(-ink)은 연한 바탕(-weak) 위에서 대비 4.5:1 이상 */
    --ok: #0b5d2a; --ok-ink: #0b5d2a; --ok-weak: #e0f7e4;
    --caution-ink: #6c4300; --caution-weak: #ffeed2; --caution-line: #c68b39;
    --muted-ink: #4e5566; --muted-weak: #e9edf5;
    /* 코드 색: 학(학원)·가(가정)·병(병결 계열) */
    --code-hak-ink: #124a7b; --code-hak-weak: #e4f1ff;
    --code-ga-ink: #563576; --code-ga-weak: #f3ebfd;
    --code-byung-ink: #015259; --code-byung-weak: #ddf4f7;
    /* OUT */
    --out1-ink: #6c4300; --out1-weak: #ffeed2; --out1-line: #c68b39;
    --out2: #b7191c; --out2-ink: #fff;
    /* 크기 */
    --font-base: 18px; --font-sm: .9rem; --font-xs: var(--font-sm); --font-lg: 1.1rem; --font-xl: 1.5rem;
    --tap: 48px;          /* 누르는 칸 최소 높이·너비 */
    --bar-h: 72px;        /* 하단 작업 바 높이(안전 영역 제외) */
    --gap: 12px; --gap-sm: 8px; --gap-lg: 16px;
    --radius: 12px; --radius-sm: 12px; --radius-pill: 999px;
    --shadow: 0 -1px 0 #d7dbe3;   /* 아래 고정 바·토스트의 경계선(번지는 그림자 없음) */
    --focus: #1a295d;
    /* 아이콘(결정 88): Lucide Icons — ISC License, © Lucide Contributors (https://lucide.dev). 선 아이콘 SVG 9개를 바깥 요청 없이 여기 넣는다.
       글자 기호(✓ … ⊘ ▲ ⛔ ● ⚠ ⓘ ↻ ›) 대신 ::before/::after 의 mask 로 그린다(꾸밈 그림 — 뜻은 옆의 낱말이 전한다). 라이선스 전문: design/preview/concepts2/icons/LICENSE */
    --i-check: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2224%22 height=%2224%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22 %3E%3Cpath d=%22M20 6 9 17l-5-5%22 /%3E%3C/svg%3E");
    --i-ellipsis: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2224%22 height=%2224%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22 %3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%221%22 /%3E%3Ccircle cx=%2219%22 cy=%2212%22 r=%221%22 /%3E%3Ccircle cx=%225%22 cy=%2212%22 r=%221%22 /%3E%3C/svg%3E");
    --i-ban: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2224%22 height=%2224%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22 %3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%2210%22 /%3E%3Cpath d=%22M4.929 4.929 19.07 19.071%22 /%3E%3C/svg%3E");
    --i-triangle-alert: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2224%22 height=%2224%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22 %3E%3Cpath d=%22m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3%22 /%3E%3Cpath d=%22M12 9v4%22 /%3E%3Cpath d=%22M12 17h.01%22 /%3E%3C/svg%3E");
    --i-octagon-alert: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2224%22 height=%2224%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22 %3E%3Cpath d=%22M12 16h.01%22 /%3E%3Cpath d=%22M12 8v4%22 /%3E%3Cpath d=%22M15.312 2a2 2 0 0 1 1.414.586l4.688 4.688A2 2 0 0 1 22 8.688v6.624a2 2 0 0 1-.586 1.414l-4.688 4.688a2 2 0 0 1-1.414.586H8.688a2 2 0 0 1-1.414-.586l-4.688-4.688A2 2 0 0 1 2 15.312V8.688a2 2 0 0 1 .586-1.414l4.688-4.688A2 2 0 0 1 8.688 2z%22 /%3E%3C/svg%3E");
    --i-circle-dot: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2224%22 height=%2224%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22 %3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%221%22 /%3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%2210%22 /%3E%3C/svg%3E");
    --i-info: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2224%22 height=%2224%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22 %3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%2210%22 /%3E%3Cpath d=%22M12 16v-4%22 /%3E%3Cpath d=%22M12 8h.01%22 /%3E%3C/svg%3E");
    --i-refresh-cw: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2224%22 height=%2224%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22 %3E%3Cpath d=%22M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8%22 /%3E%3Cpath d=%22M21 3v5h-5%22 /%3E%3Cpath d=%22M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16%22 /%3E%3Cpath d=%22M8 16H3v5%22 /%3E%3C/svg%3E");
    --i-chevron-right: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2224%22 height=%2224%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22 %3E%3Cpath d=%22m9 18 6-6-6-6%22 /%3E%3C/svg%3E");
  }

  /* ───────── 바탕 ───────── */
  * { box-sizing: border-box; }
  html { font-size: 18px; -webkit-text-size-adjust: 100%; scrollbar-gutter: stable; }   /* 윈도우 크롬: 스크롤바가 생겨도 화면이 옆으로 밀리지 않게 */
  /* 글꼴(결정 88): Pretendard 웹폰트. 못 받으면 뒤의 기기 기본 한글 글꼴로 내려간다 */
  body { margin: 0; background: var(--bg); color: var(--text); letter-spacing: 0;
    font-family: "Pretendard Variable", "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; line-height: 1.5;
    overflow-wrap: anywhere; word-break: keep-all; min-height: 100vh; min-height: 100dvh; }   /* 한국어는 낱말 중간에서 끊지 않는다. 휴대폰 주소창이 움직여도 높이가 맞게 dvh */
  img, table { max-width: 100%; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden;
    clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

  /* ───────── 화면 틀: 위 머리 · 본문 · 아래 작업 바 ───────── */
  /* 머리줄(결정 88): 감색 면 + 밝은 글자. 색 면은 여기 한 곳뿐이다 */
  header.top { position: sticky; top: 0; z-index: 2; background: var(--accent); color: var(--on-accent); border-bottom: 0;
    padding: 14px 16px; padding-top: max(14px, env(safe-area-inset-top, 0px)); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  header.top h1 { font-size: var(--font-lg); font-weight: 700; margin: 0; color: var(--on-accent); }
  header.top .who { font-size: var(--font-sm); color: var(--on-accent-muted); text-align: right; word-break: keep-all; white-space: nowrap; }
  header.top :focus-visible { outline-color: var(--on-accent); }
  .back { display: inline-flex; align-items: center; min-height: var(--tap); color: var(--on-accent); font-weight: 700;
    text-decoration: none; white-space: nowrap; }
  main { max-width: 720px; margin: 0 auto; padding: 12px 16px 16px; }
  main.wide { max-width: 1120px; }   /* PC 권장 화면(좌석·방 배정): 넓은 화면에서 격자와 목록을 나란히 */
  /* 하단 작업 바가 있는 화면은 main에 has-actionbar를 붙여 바에 가려지지 않게 한다 */
  main.has-actionbar { padding-bottom: calc(var(--bar-h) + 24px + env(safe-area-inset-bottom, 0px)); }
  .actionbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; background: var(--card);
    border-top: 0; box-shadow: var(--shadow);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; gap: var(--gap-sm);
    justify-content: center; }
  .actionbar > .btn { flex: 1 1 0; max-width: 360px; }
  .tabs { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 12px; }
  .tab { flex: 0 0 auto; padding: 8px 16px; border-radius: var(--radius-sm); border: 1px solid var(--field-line);
    background: var(--card); color: var(--text); text-decoration: none; font-size: 1rem; font-weight: 600; cursor: pointer;
    min-height: var(--tap); display: inline-flex; align-items: center; }
  .tab.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

  /* ───────── 카드·목록·글자 ───────── */
  /* 카드(결정 85 구조 + 결정 88 모양): 참고 정보는 상자 없이 바탕 위에 놓는다. 상자는 '할 일'(.todo)과 '중요'(.key)에만 — 흰 판에 가는 테두리 하나(색 띠·그림자 없음) */
  .card { background: transparent; border: 0; padding: 16px 4px 8px; margin-bottom: 8px; }
  .card h2 { font-size: var(--font-lg); font-weight: 700; line-height: 1.3; margin: 0 0 8px; }
  .card.todo, .card.key { background: var(--card); border-radius: var(--radius); padding: 16px; margin: 8px 0 12px; box-shadow: 0 0 0 1px var(--line); }
  .card.soon, .card.boxed { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
  .card.soon { border: 1px dashed var(--muted); color: var(--muted); }
  .muted { color: var(--muted); font-size: .9rem; }
  /* 숫자 칸: 휴대폰은 한 줄에 숫자 + 설명(세 칸으로 쪼개면 설명이 한 낱말씩 줄바꿈된다), 600px부터 나란히 */
  .stats { display: grid; grid-template-columns: 1fr; gap: 0; }
  .stat { display: flex; align-items: baseline; gap: 12px; padding: 4px 0; }
  .stat .n { font-size: 1.5rem; font-weight: 700; line-height: 1.3; min-width: 2.2em; color: var(--text); }
  .stat .l { font-size: var(--font-sm); color: var(--muted); }
  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list li { padding: 12px 4px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; }
  ul.list li:last-child { border-bottom: 0; }
  ul.list li a { display: inline-flex; align-items: center; min-height: var(--tap); min-width: var(--tap); }   /* 목록 줄 안의 이름 링크도 누르는 칸 48px */
  dl.kv { display: grid; grid-template-columns: 7em 1fr; gap: 6px 12px; margin: 0; }
  dl.kv dt { color: var(--muted); }
  dl.kv dd { margin: 0; }
  .soon { border: 1px dashed var(--muted); color: var(--muted); }
  .loading { color: var(--muted); padding: 16px 0; }
  footer { text-align: center; padding: 24px 16px; font-size: var(--font-sm); color: var(--muted); }
  footer a { color: var(--muted); display: inline-flex; align-items: center; min-height: var(--tap); padding: 0 6px; }   /* 처음으로·접속 진단도 누르는 칸 48px */

  /* ───────── 버튼: 모두 48px 이상, 주 버튼은 한 화면에 하나 ───────── */
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: var(--tap); min-width: var(--tap);
    padding: 12px 16px; border-radius: var(--radius-sm); border: 1px solid var(--accent); font-weight: 700;
    background: var(--accent); color: var(--on-accent); font: inherit; font-size: 1rem; font-weight: 700; cursor: pointer; text-decoration: none; text-align: center; }
  .btn.secondary { background: var(--card); color: var(--accent-ink); border: 1px solid var(--field-line); }
  .btn.danger { background: var(--warn); border-color: var(--warn); color: var(--out2-ink); }
  .btn.block { display: flex; width: 100%; }
  /* 줄 링크(UI.rowLink, 결정 85): 다른 화면으로 가는 한 줄. 48px. 글자는 본문색, 끝의 화살표 아이콘만 흐리게(결정 88). 할 일 카드(.todo)의 첫 줄 링크만 폭 가득 주 버튼 모양 */
  .row-link { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; min-height: var(--tap); padding: 10px 4px; margin: 0;
    border: 0; border-top: 1px solid var(--line); border-radius: 0; background: transparent; color: var(--text);
    font: inherit; font-weight: 400; text-align: left; text-decoration: none; cursor: pointer; word-break: keep-all; }
  .row-link::after { content: ""; flex: 0 0 auto; width: 1.2em; height: 1.2em; background: var(--muted); -webkit-mask: var(--i-chevron-right) center / contain no-repeat; mask: var(--i-chevron-right) center / contain no-repeat; }
  .card.todo > .row-link:not(.row-link ~ .row-link) { background: var(--accent); color: var(--on-accent); border: 0; border-radius: var(--radius-sm); padding: 12px 16px; margin-top: 12px; font-weight: 700; }
  .card.todo > .row-link:not(.row-link ~ .row-link)::after { background: var(--on-accent); }
  .card.todo > .row-link ~ .row-link { border-top-color: var(--line); }
  .btn:disabled, .btn[aria-disabled="true"] { background: var(--muted-weak); border-color: var(--line); color: var(--muted-ink); cursor: not-allowed; }

  /* ───────── 입력칸: 라벨 + 입력 + 고칠 점(무엇을 하면 되는지) ───────── */
  .field { margin-bottom: 16px; }
  .field label { display: block; margin-bottom: 4px; color: var(--text); font-weight: 700; font-size: .9rem; }
  .field input, .field select, .field textarea { width: 100%; min-height: var(--tap); padding: 8px 12px; font: inherit;
    border: 1px solid var(--field-line); border-radius: var(--radius-sm); background: var(--card); color: var(--text); }
  .field textarea { min-height: 96px; }
  .field .hint { color: var(--muted); font-size: var(--font-sm); margin-top: 4px; }
  .field .fix { color: var(--warn); font-size: .9rem; margin-top: 4px; }
  .field.invalid input, .field.invalid select, .field.invalid textarea { border-color: var(--warn); border-width: 2px; }

  /* ───────── 안내 줄: 글자와 모양(아이콘 글자)을 함께 쓴다 ───────── */
  .notice { border-radius: var(--radius-sm); padding: 12px; margin-bottom: 12px; border: 1px solid transparent; }
  .notice::before { font-weight: 700; margin-right: .4em; }
  .error { background: var(--warn-weak); color: var(--warn); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 12px; }
  .error::before { content: ""; display: inline-block; flex: 0 0 auto; width: 1.05em; height: 1.05em; vertical-align: -.16em; background: currentColor; -webkit-mask: var(--i-triangle-alert) center / contain no-repeat; mask: var(--i-triangle-alert) center / contain no-repeat; margin-right: .4em; }
  .notice.warn { background: var(--caution-weak); color: var(--caution-ink); border-color: var(--caution-line); }
  .notice.warn::before { content: ""; display: inline-block; flex: 0 0 auto; width: 1.05em; height: 1.05em; vertical-align: -.16em; background: currentColor; -webkit-mask: var(--i-triangle-alert) center / contain no-repeat; mask: var(--i-triangle-alert) center / contain no-repeat; }
  .notice.ok { background: var(--ok-weak); color: var(--ok-ink); }
  .notice.ok::before { content: ""; display: inline-block; flex: 0 0 auto; width: 1.05em; height: 1.05em; vertical-align: -.16em; background: currentColor; -webkit-mask: var(--i-check) center / contain no-repeat; mask: var(--i-check) center / contain no-repeat; }
  .notice.info { background: var(--accent-weak); color: var(--accent-ink); }
  .notice.info::before { content: ""; display: inline-block; flex: 0 0 auto; width: 1.05em; height: 1.05em; vertical-align: -.16em; background: currentColor; -webkit-mask: var(--i-info) center / contain no-repeat; mask: var(--i-info) center / contain no-repeat; }

  /* ───────── 상태 표시(pill): 색만으로 구분하지 않는다 ─────────
     모양은 하나(테두리 없는 꼬리표, 결정 85). 구분은 앞 아이콘(체크·점 셋·금지·세모 경고·팔각 경고·점 — 결정 88, Lucide)과 낱말과 색이다. 글자는 항상 함께 쓴다. 학·가·병은 글자 자체가 다르다. */
  .pill { display: inline-flex; align-items: center; gap: .3em; padding: 4px 10px; border-radius: 6px; border: 0;
    font-size: var(--font-sm); font-weight: 700; line-height: 1.5; max-width: 100%; white-space: normal; }
  .pill.s-confirmed { color: var(--ok-ink); background: var(--ok-weak); }
  .pill.s-confirmed::before { content: ""; flex: 0 0 auto; width: 1em; height: 1em; background: currentColor; -webkit-mask: var(--i-check) center / contain no-repeat; mask: var(--i-check) center / contain no-repeat; }
  .pill.s-requested { color: var(--caution-ink); background: var(--caution-weak); }
  .pill.s-requested::before { content: ""; flex: 0 0 auto; width: 1em; height: 1em; background: currentColor; -webkit-mask: var(--i-ellipsis) center / contain no-repeat; mask: var(--i-ellipsis) center / contain no-repeat; }
  .pill.s-canceled { color: var(--muted-ink); background: var(--muted-weak); text-decoration: line-through; }
  .pill.s-canceled::before { content: ""; flex: 0 0 auto; width: 1em; height: 1em; background: currentColor; -webkit-mask: var(--i-ban) center / contain no-repeat; mask: var(--i-ban) center / contain no-repeat; }
  .pill.c-hak { color: var(--code-hak-ink); background: var(--code-hak-weak); }
  .pill.c-ga { color: var(--code-ga-ink); background: var(--code-ga-weak); }
  .pill.c-byung { color: var(--code-byung-ink); background: var(--code-byung-weak); }
  .pill.out-1 { color: var(--out1-ink); background: var(--out1-weak); }
  .pill.out-1::before { content: ""; flex: 0 0 auto; width: 1em; height: 1em; background: currentColor; -webkit-mask: var(--i-triangle-alert) center / contain no-repeat; mask: var(--i-triangle-alert) center / contain no-repeat; }
  .pill.out-2 { color: var(--out2-ink); background: var(--out2); }
  .pill.out-2::before { content: ""; flex: 0 0 auto; width: 1em; height: 1em; background: currentColor; -webkit-mask: var(--i-octagon-alert) center / contain no-repeat; mask: var(--i-octagon-alert) center / contain no-repeat; }
  .pill.todo { color: var(--signal-ink); background: var(--signal); }
  .pill.todo::before { content: ""; flex: 0 0 auto; width: 1em; height: 1em; background: currentColor; -webkit-mask: var(--i-circle-dot) center / contain no-repeat; mask: var(--i-circle-dot) center / contain no-repeat; }
  .pill.mute { color: var(--muted-ink); background: var(--muted-weak); }
  /* 중요한 숫자(.key 카드의 OUT)는 크게 */
  .card.key *:not(li) > .pill.out-1, .card.key *:not(li) > .pill.out-2 { font-size: var(--font-lg); padding: 4px 14px; }   /* 교사 화면: 조금 크게 */
  body.tone-soft .card.key *:not(li) > .pill.out-1, body.tone-soft .card.key *:not(li) > .pill.out-2 { font-size: var(--font-xl); padding: 4px 12px; }   /* 학생·학부모 화면: 내 OUT은 크게 */

  /* 알림 개수 배지(숫자는 글자로 함께 쓴다) */
  .count { display: inline-block; min-width: 1.6em; padding: 0 .45em; border-radius: var(--radius-pill);
    background: var(--accent); color: var(--on-accent); font-size: var(--font-sm); font-weight: 700; text-align: center; }

  /* ───────── 공통 컴포넌트(UI.*, src/ui/Components.html) ───────── */
  .chips { display: flex; flex-wrap: wrap; gap: var(--gap-sm); margin: 4px 0 8px; }
  .chip { min-height: var(--tap); min-width: var(--tap); padding: 8px 16px; border-radius: var(--radius-sm); border: 1px solid var(--field-line);
    background: var(--card); color: var(--text); font: inherit; font-size: 1rem; cursor: pointer; }
  .chip:disabled { background: var(--muted-weak); border-style: dashed; color: var(--muted-ink); cursor: not-allowed; }
  .row-btn { flex: 0 0 auto; white-space: nowrap; }
  /* 긴 목록(학생 33명)의 줄마다 테두리 버튼이 반복되면 시끄럽다: 줄 끝 '열기 ›' 글자 버튼(높이는 48px 그대로) */
  .btn.secondary.row-open { border: 0; background: transparent; color: var(--accent-ink); padding: 0 6px 0 12px; min-width: auto; }
  .btn.secondary.row-open::after { content: ""; flex: 0 0 auto; width: 1.2em; height: 1.2em; margin-left: .35em; background: currentColor; -webkit-mask: var(--i-chevron-right) center / contain no-repeat; mask: var(--i-chevron-right) center / contain no-repeat; }
  /* 탭이 다섯 개 이상(OUT 화면)이면 글자를 조금 줄여 "2OUT"이 낱말 중간에서 끊기지 않게 한다 */
  .segmented.dense .seg { font-size: .9rem; padding: 8px 2px; }
  .tabs.wrap { flex-wrap: wrap; overflow-x: visible; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
  .chip.on::before { content: ""; display: inline-block; flex: 0 0 auto; width: 1.05em; height: 1.05em; vertical-align: -.16em; background: currentColor; -webkit-mask: var(--i-check) center / contain no-repeat; mask: var(--i-check) center / contain no-repeat; margin-right: .3em; }
  .segmented { display: flex; gap: 4px; padding: 4px; background: var(--muted-weak); border: 0; border-radius: var(--radius-sm); margin-bottom: 12px; }
  .seg { flex: 1 1 0; min-width: var(--tap); min-height: var(--tap); padding: 8px 6px; border: 0; border-radius: 8px;
    background: transparent; color: var(--text); font: inherit; font-size: 1rem; font-weight: 700; cursor: pointer; }
  .seg.on { background: var(--card); color: var(--accent-ink); box-shadow: 0 0 0 1px var(--line); }
  .seg.on::before { content: ""; display: inline-block; flex: 0 0 auto; width: 1.05em; height: 1.05em; vertical-align: -.16em; background: currentColor; -webkit-mask: var(--i-check) center / contain no-repeat; mask: var(--i-check) center / contain no-repeat; margin-right: .3em; }
  /* 빈 상태: 왼쪽 정렬 한 줄(결정 85). 다음 할 일이 있을 때만 버튼 */
  .empty { text-align: left; color: var(--muted); padding: 4px 0 10px; }
  .empty p { margin: 0 0 4px; }
  .check { display: flex; align-items: center; gap: var(--gap-sm); min-height: var(--tap); cursor: pointer; }
  .check input { width: 28px; height: 28px; flex: 0 0 auto; }
  .range { padding-bottom: 8px; }
  .picker { margin-bottom: 12px; }
  .seat-text { word-break: keep-all; }
  .seat-fixed, .seat-gap { cursor: default; }
  .range-summary { color: var(--text); font-weight: 700; min-height: 1.5em; }
  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(var(--bar-h) + 24px + env(safe-area-inset-bottom, 0px)); z-index: 20;
    max-width: 480px; margin: 0 auto; padding: 12px 16px; border-radius: var(--radius-sm); font-size: 1rem; border: 1px solid transparent; box-shadow: var(--shadow); }
  .toast::before { font-weight: 700; margin-right: .4em; }
  .toast.ok { background: var(--ok-weak); color: var(--ok-ink); border-color: var(--ok); }
  .toast.ok::before { content: ""; display: inline-block; flex: 0 0 auto; width: 1.05em; height: 1.05em; vertical-align: -.16em; background: currentColor; -webkit-mask: var(--i-check) center / contain no-repeat; mask: var(--i-check) center / contain no-repeat; }
  .toast.warn { background: var(--caution-weak); color: var(--caution-ink); border-color: var(--caution-line); }
  .toast.warn::before { content: ""; display: inline-block; flex: 0 0 auto; width: 1.05em; height: 1.05em; vertical-align: -.16em; background: currentColor; -webkit-mask: var(--i-triangle-alert) center / contain no-repeat; mask: var(--i-triangle-alert) center / contain no-repeat; }
  .toast.info { background: var(--accent-weak); color: var(--accent-ink); border-color: var(--accent); }
  .toast.info::before { content: ""; display: inline-block; flex: 0 0 auto; width: 1.05em; height: 1.05em; vertical-align: -.16em; background: currentColor; -webkit-mask: var(--i-info) center / contain no-repeat; mask: var(--i-info) center / contain no-repeat; }
  .sheet-scrim { position: fixed; inset: 0; z-index: 10; background: rgba(18, 24, 38, .5); display: flex; align-items: flex-end; justify-content: center; }
  .sheet { width: 100%; max-width: 720px; max-height: 85vh; max-height: 85dvh; overflow-y: auto; background: var(--card); border-radius: var(--radius) var(--radius) 0 0;
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
  .sheet h2 { font-size: var(--font-lg); margin: 0 0 8px; }
  /* 한국어는 낱말 중간에서 끊지 않고 띄어쓰기에서만 줄을 바꾼다(360px). 낱말 하나가 줄보다 길 때(긴 영문·숫자)만 강제로 끊는다 */
  .seg, .sheet h2, .sheet-body, .sheet-lead { word-break: keep-all; overflow-wrap: anywhere; }
  .sheet-body p { margin: 0 0 12px; }
  .sheet-actions { display: flex; gap: var(--gap-sm); margin-top: 8px; }
  .sheet-actions .btn { flex: 1 1 0; }
  .sheet-lead { font-size: var(--font-xl); font-weight: 700; line-height: 1.3; color: var(--text); }
  .sheet-body ul.list li { padding: 8px 4px; }
  /* 표(식수 집계 등): 화면은 안 밀리고 표 안에서만 가로로 민다. 첫 열 고정, 합계 줄은 굵게+회색 바탕 */
  /* 표·격자: 상자 높이를 제한해 아래쪽 가로 스크롤바가 늘 보이게 하고, 머리 행·이름 열을 고정(불투명 바탕)한다. 가로로 더 있으면 오른쪽 가장자리에 그림자 단서 */
  .tablewrap { overflow: auto; max-width: 100%; max-height: 70vh; max-height: 70dvh; border: 1px solid var(--line); border-radius: var(--radius-sm); margin-bottom: 12px;
    background: linear-gradient(to right, var(--card) 30%, rgba(255, 255, 255, 0)) left center / 36px 100% no-repeat local,
      linear-gradient(to left, var(--card) 30%, rgba(255, 255, 255, 0)) right center / 36px 100% no-repeat local,
      linear-gradient(to right, rgba(18, 24, 38, .22), rgba(18, 24, 38, 0)) left center / 12px 100% no-repeat scroll,
      linear-gradient(to left, rgba(18, 24, 38, .22), rgba(18, 24, 38, 0)) right center / 12px 100% no-repeat scroll,
      var(--card); }
  table.data { border-collapse: collapse; width: 100%; font-size: 1rem; }
  table.data th, table.data td { padding: 10px 12px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.data th:first-child, table.data td:first-child { text-align: left; position: sticky; left: 0; z-index: 1; background: var(--card); }
  table.data thead th, table.data thead th:first-child { background: var(--muted-weak); color: var(--muted-ink); font-size: var(--font-sm); position: sticky; top: 0; z-index: 2; }
  table.data thead th:first-child { left: 0; z-index: 3; }   /* 왼쪽 위 칸은 머리와 이름 열 둘 다에 고정 */
  table.data.compact th, table.data.compact td { padding: 10px 6px; }
  table.data tr.total th, table.data tr.total td { font-weight: 700; background: var(--muted-weak); }
  /* 월 달력: 날짜 칸 48px 이상, 칸 안에서만 가로로 민다 */
  table.duty-cal { border-collapse: separate; border-spacing: 4px; width: 100%; min-width: 28rem; table-layout: fixed; }
  table.duty-cal th { font-size: var(--font-sm); color: var(--muted-ink); padding: 4px 0; }
  table.duty-cal td { vertical-align: top; padding: 0; }
  .duty-day { word-break: keep-all; display: block; width: 100%; min-height: 72px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--card);
    color: var(--text); font: inherit; font-size: var(--font-xs); line-height: 1.3; text-align: left; cursor: pointer; }
  .duty-day b { display: block; font-size: var(--font-sm); }
  .duty-day.off { background: var(--muted-weak); color: var(--muted-ink); border-style: dotted; }
  .duty-day.gap { border: 2px dashed var(--caution-line); background: var(--caution-weak); color: var(--caution-ink); }
  .duty-day.mine { border: 3px solid var(--accent); background: var(--accent-weak); }
  .picker-list { list-style: none; margin: 0 0 8px; padding: 0; }
  .picker-list li { margin-bottom: 4px; }
  .picker-list li.muted { padding: 8px 4px; }
  .picker-item { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: 8px; min-height: var(--tap); padding: 8px 12px;
    border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--card); color: var(--text); font: inherit; text-align: left; cursor: pointer; }
  .picker-chosen { display: flex; align-items: center; gap: var(--gap-sm); flex-wrap: wrap; }
  .picker-chosen .picker-name { font-weight: 700; }
  .seatgrid-wrap { overflow-x: auto; max-width: 100%; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--card); }
  table.seatgrid { border-collapse: separate; border-spacing: 4px; }
  .seatgrid-wrap { max-height: 70vh; max-height: 70dvh; overflow: auto; }
  .seatgrid td { padding: 0; height: var(--tap); min-width: 76px; text-align: center; vertical-align: middle; font-size: var(--font-xs); color: var(--muted-ink); }
  .seatgrid td.pillar { background: var(--muted-weak); }
  .seatgrid td.door, .seatgrid td.window { border: 1px dashed var(--muted-ink); }
  .seat-cell { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; min-height: var(--tap); padding: 2px 4px;
    border: 1px solid var(--muted-ink); border-radius: 8px; background: var(--card); color: var(--text); font: inherit; font-size: var(--font-xs); line-height: 1.2; cursor: pointer; }
  .seat-cell .seat-no { color: var(--muted-ink); }
  .seat-cell.vacant { border-style: dashed; color: var(--muted-ink); background: var(--muted-weak); }
  .seat-cell.sel { border: 3px solid var(--accent); background: var(--accent-weak); font-weight: 700; }
  .seat-cell.sel .seat-no::before { content: ""; display: inline-block; flex: 0 0 auto; width: 1.05em; height: 1.05em; vertical-align: -.16em; background: currentColor; -webkit-mask: var(--i-check) center / contain no-repeat; mask: var(--i-check) center / contain no-repeat; margin-right: .2em; }
  .seat-cell.bad { border: 3px solid var(--warn); background: var(--warn-weak); color: var(--text); }
  .seat-cell.bad .seat-no::before { content: "⚠ "; color: var(--warn); font-weight: 700; }
  .seat-cell.bad.sel { outline: 3px solid var(--accent); outline-offset: 1px; }
  .chip.bad { border: 3px solid var(--warn); background: var(--warn-weak); font-weight: 700; }
  .chip.bad::before { content: "⚠ "; color: var(--warn); }
  /* F11 결과 정리 격자(D12): 학생 × 날짜 표. 칸마다 위 줄 = 사전 특이사항 약어·'학'·'가', 아래 줄 = 결과 기호(×△조). 색만으로 알리지 않는다(기호·⚠·점선 테두리) */
  table.data.rg th, table.data.rg td { text-align: center; padding: 4px; }
  table.data.rg th:first-child, table.data.rg td:first-child { text-align: left; padding: 4px 10px; }
  .rg-cell { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; min-width: 56px; min-height: var(--tap); padding: 2px 4px;
    border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--card); color: var(--text); font: inherit; cursor: pointer; }
  .rg-cell .rg-pre { font-size: var(--font-sm); color: var(--muted-ink); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rg-cell .rg-sym { font-weight: 700; font-size: var(--font-lg); }
  .rg-cell.has { background: var(--accent-weak); border-color: var(--accent); }
  .rg-cell.bad { border: 3px solid var(--warn); background: var(--warn-weak); }
  .rg-cell.bad .rg-sym::before { content: "⚠ "; color: var(--warn); }
  .rg-cell.sel { border: 3px solid var(--accent); }   /* 달력에서 지금 고른 날: 색 + 굵기(아이콘 없음, aria-current="date"). ⚠는 미인정·경고 뜻이라 쓰지 않는다 */
  .rg-cell.off { background: var(--muted-weak); border-style: dashed; color: var(--muted-ink); cursor: not-allowed; }
  /* ───────── 학생·학부모 화면(body.tone-soft, 결정 88): 교사 화면과 같은 안. 달라지는 것은 판 사이 여백과 내 OUT 꼬리표 크기뿐 ───────── */
  body.tone-soft main { margin: 0 auto; padding: 8px 16px 16px; max-width: 720px; }   /* 넓은 화면에서도 한 줄이 720px를 넘지 않는다(넘으면 읽기 힘들다) */
  body.tone-soft main.has-actionbar { padding-bottom: calc(var(--bar-h) + 24px + env(safe-area-inset-bottom, 0px)); }   /* 아래 작업 바에 마지막 내용이 가리지 않게(위 main 규칙보다 우선) */
  body.tone-soft .card { margin: 0 0 12px; }
  body.tone-soft .card.todo, body.tone-soft .card.key { margin: 8px 0 16px; }
  body.tone-soft #home .card:first-child h2 { font-size: var(--font-xl); }   /* 홈 맨 위 카드(이름)만 크게. 화면의 첫 카드는 그대로 */
  body.tone-soft .actionbar > .btn { padding: 12px 16px; }

  /* ───────── 반응형·마우스·키보드(D15 ②, docs/design/refresh/responsive.md) ─────────
     중단점 3개: 휴대폰 ~599px / 태블릿·좁은 창 600~839px / 노트북 840px~. 스타일은 휴대폰 기준으로 쓰고 넓어질 때만 더한다. */
  iframe:focus, iframe:focus-visible, iframe:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }   /* 출석부 미리보기 같은 iframe도 Tab으로 갔을 때 보인다 */
  .tabular, .stat .n, .count, .pill, table.data td { font-variant-numeric: tabular-nums; }
  /* 홈: 맨 위 한 줄(.home-head) + 해야 할 일(.home-main) + 참고(.home-side). 휴대폰은 위에서 아래로 한 줄, 넓은 화면은 두 열 */
  .home-head { margin-bottom: 4px; }
  .home-h { font-size: var(--font-sm); font-weight: 400; color: var(--muted-ink); margin: 24px 4px 8px; }
  .home-none { color: var(--muted); margin: 4px 4px 12px; }
  .home-cols, .pt-cols { display: block; }
  .pt-a, .pt-b { min-width: 0; }   /* 학생·학부모 홈의 왼쪽 열(할 일·OUT·출결)과 오른쪽 열(자리·급식·상담·일정) */
  /* 글 덩어리(설명·안내·힌트)는 넓은 화면에서도 한 줄 45자(45em, 한글 1자 ≈ 1em)를 넘기지 않는다. 표·격자·목록 행(li·td·th 안)은 제외 */
  main p, main .muted:not(li *):not(td *):not(th *), main .hint, main .notice, main .pt-note, main .error { max-width: 45em; }
  @media (hover: hover) {
    .btn:hover { filter: brightness(.94); }
    .btn.secondary:hover { background: var(--accent-weak); filter: none; }
    .row-link:hover { background: var(--accent-weak); }
    .card.todo > .row-link:not(.row-link ~ .row-link):hover { background: var(--accent); filter: brightness(.94); }
    .chip:hover, .tab:hover, .picker-item:hover { background: var(--accent-weak); }
    .chip.on:hover, .tab.on:hover { background: var(--accent); filter: brightness(.94); }
    table.data tbody tr:hover td { background: var(--accent-weak); }
    .back:hover { text-decoration: underline; }
  }
  @media (min-width: 600px) {
    main { max-width: 760px; padding: 16px 24px; }
    .stats { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px 24px; }
    .stat { display: block; }
    .card.todo, .card.key { padding: 18px 20px 16px; }
  }
  @media (min-width: 840px) {
    /* 홈과 넓은 화면용 화면(main.home·main.wide)은 두 칸. 폼 화면은 읽기 좋은 폭(880px)에서 멈춘다 */
    main { max-width: 880px; padding: 20px 32px 24px; }
    main.home, main.wide { max-width: 1180px; }
    /* 머리줄의 글자는 본문 폭에 맞춘다(--hw = 본문 최대 폭): 폼 화면 880px, 홈·넓은 화면 1180px, 학생·학부모 화면 760px */
    header.top { --hw: 880px; padding-left: max(16px, calc((100vw - var(--hw)) / 2 + 32px)); padding-right: max(16px, calc((100vw - var(--hw)) / 2 + 32px)); }
    body:has(main.home) header.top, body:has(main.wide) header.top { --hw: 1180px; }
    body.tone-soft:has(main) header.top { --hw: 760px; }
    body.tone-soft:has(main.home) header.top { --hw: 960px; }
    .home-cols { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 0 28px; align-items: start; }
    .home-main, .home-side { min-width: 0; }
    .home-side { position: sticky; top: 80px; }
    /* 역할이 둘 이상이면 왼쪽에 역할 메뉴(레일). 역할 하나면 만들지 않는다 */
    main.home:has(> nav.tabs) { display: grid; grid-template-columns: 168px minmax(0, 1fr); gap: 0 28px; align-items: start; }
