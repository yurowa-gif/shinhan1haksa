<style>
  .roster-text { width: 100%; min-height: 220px; padding: 12px; font: inherit; border: 1px solid var(--line);
    border-radius: 10px; background: var(--card); color: var(--text); }
  .roster-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .roster-err { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .roster-ok { color: var(--ok); margin-bottom: 8px; }
</style>
<script>
  /** 명단 올리기 화면 1차: 붙여넣기 → 형식 확인(저장 없음). C3. */
  function renderScreen(root) {
    var text = el('textarea', { class: 'roster-text', placeholder: '시트에서 명단을 복사해 여기에 붙여넣으세요.\n열 순서: 학번, 학년, 반, 번호, 이름, 성별, 계열, 학사, 기숙사, 베리타스, 조식, 석식, 통학구분, 담당교사이메일, 학생구글계정, 비고' });
    var out = el('div', { style: 'margin-top:12px' });
    var check = el('button', { type: 'button', class: 'btn', text: '형식 확인' });
    var clearBtn = el('button', { type: 'button', class: 'btn secondary', text: '지우기',
      onclick: function () { text.value = ''; clear(out); } });
    root.appendChild(el('div', { class: 'card' }, [
      el('h2', { text: '학생 명단 붙여넣기' }),
      el('div', { class: 'muted', text: '이 화면은 아직 형식만 확인합니다. 아무것도 저장하지 않습니다.' }),
      el('div', { style: 'margin-top:12px' }, [text]),
      el('div', { class: 'roster-actions' }, [check, clearBtn]),
      out
    ]));

    check.addEventListener('click', function () {
      check.disabled = true;
      clear(out).appendChild(el('div', { class: 'loading', text: '확인하는 중…' }));
      call('previewRoster', text.value).then(function (r) {
        check.disabled = false;
        clear(out);
        out.appendChild(kv([['구분', r.delimiter === 'tab' ? '탭(시트 복사)' : '쉼표(CSV)'],
          ['머리글 줄', r.hasHeader ? '있음' : '없음'], ['학생 줄 수', String(r.rowCount)]]));
        if (r.ok) {
          out.appendChild(el('div', { class: 'roster-ok', text: '형식이 맞습니다.' }));
          return;
        }
        out.appendChild(el('div', { class: 'error', text: '고칠 곳이 ' + r.errorCount + '군데 있습니다.' }));
        r.errors.forEach(function (e) {
          out.appendChild(el('div', { class: 'roster-err', text: (e.line ? e.line + '번째 줄: ' : '') + e.message }));
        });
      }).catch(function (err) { check.disabled = false; clear(out); showError(out, err); });
    });
  }
</script>
