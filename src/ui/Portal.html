<style>
  .pt-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); word-break: keep-all; }
  .pt-row:last-child { border-bottom: 0; }
  .pt-pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .pt-nav { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
  .pt-nav .btn { flex: 0 0 auto; white-space: nowrap; }
</style>
<script>
  /**
   * 학생·학부모 포털 본문(C36, F14 읽기만). 학생 홈은 본인 id, 학부모 홈은 고른 자녀 id로 부른다.
   * 서버(getPortalStudent)가 본인·연결된 자녀인지 다시 확인한다. 내용은 서버가 준 것만 그린다.
   */
  function renderPortal(root, studentId, month) {
    clear(root).appendChild(el('div', { class: 'loading', text: '불러오는 중…' }));
    call('getPortalStudent', studentId, month || '').then(function (p) { draw(p); }).catch(function (err) { clear(root); showError(root, err); });

    function row(left, right) { return el('div', { class: 'pt-row' }, [el('span', { text: left }), right ? (typeof right === 'string' ? el('span', { class: 'muted', text: right }) : right) : null]); }
    function card(title, kids) { return el('div', { class: 'card' }, [el('h2', { text: title })].concat(kids)); }

    function draw(p) {
      clear(root);
      var s = p.student, st = p.status || {};
      var pills = [];
      if (st['학사']) pills.push(UI.statusPill(st['학사'] === '퇴실' ? 'mute' : 'confirmed', '학사 ' + st['학사']));
      if (st['기숙사']) pills.push(UI.statusPill('mute', '기숙사 ' + st['기숙사']));
      root.appendChild(card(s.name, [el('div', { class: 'muted', text: s.grade + '학년 ' + s.classNo + '반 ' + s.number + '번' + (p.term ? ' · ' + p.term.name : '') }), el('div', { class: 'pt-pills' }, pills)]));

      var o = p.outs, outKids = [];
      outKids.push(el('div', { class: 'pt-pills' }, [o.total >= 2 ? UI.statusPill('out2', '퇴실 대상') : o.total === 1 ? UI.statusPill('out1', '1OUT') : UI.statusPill('mute', 'OUT 없음')]));
      o.items.forEach(function (i) { outKids.push(row(UI.util.formatDateKo(i.date) + ' · ' + i.ruleName, i.weight + 'OUT')); });
      root.appendChild(card('이번 기간 OUT', outKids));

      var exKids = [];
      if (!p.exceptions.length) exKids.push(UI.emptyState('이번 기간 출결 특이사항이 없습니다.'));
      p.exceptions.forEach(function (e) {
        exKids.push(row(e.dateKo + ' · ' + e.short + (e.upcoming ? ' (예정)' : ''), UI.statusPill(e.state === '확정' ? 'confirmed' : 'requested', e.state)));
      });
      root.appendChild(card('출결 특이사항', exKids));

      root.appendChild(card('내 자리·방', [
        row('자습 자리', p.seat ? p.seat.space + ' ' + p.seat.label : '아직 정해지지 않았습니다'),
        row('기숙사 방', p.room ? p.room.floor + '층 ' + p.room.roomNo + '호' : '아직 정해지지 않았습니다')
      ]));

      var meal = Object.keys(st).filter(function (k) { return k === '조식' || k === '석식' || k === '중식'; }).map(function (k) { return row(k, st[k] || '없음'); });
      if (meal.length) root.appendChild(card('급식', meal));

      if (p.viewer === 'parent') {
        var cn = p.counsel || [], cnKids = [];
        if (!cn.length) cnKids.push(UI.emptyState('상담 기록이 없습니다.'));
        cn.forEach(function (c) { cnKids.push(row(c.dateKo, c.teacher + ' 선생님')); });
        cnKids.push(el('div', { class: 'muted', style: 'margin-top:8px;word-break:keep-all', text: '상담 내용은 보이지 않고, 상담한 날짜와 선생님만 알려 드립니다.' }));
        root.appendChild(card('상담 여부', cnKids));
      }

      var m = p.month, y = +m.month.slice(0, 4), mo = +m.month.slice(5, 7);
      var shift = function (d) { var t = new Date(y, mo - 1 + d, 1); return t.getFullYear() + '-' + ('0' + (t.getMonth() + 1)).slice(-2); };
      var calKids = [el('div', { class: 'pt-nav' }, [
        el('button', { type: 'button', class: 'btn secondary', text: '← 이전', onclick: function () { renderPortal(root, studentId, shift(-1)); } }),
        el('b', { style: 'white-space:nowrap', text: y + '년 ' + mo + '월' }),
        el('button', { type: 'button', class: 'btn secondary', text: '다음 →', onclick: function () { renderPortal(root, studentId, shift(1)); } })
      ])];
      if (!m.events.length) calKids.push(UI.emptyState('이 달에 등록된 일정이 없습니다.'));
      m.events.forEach(function (e) { calKids.push(row(e.title + ' (' + e.kind + ')', e.start === e.end ? UI.util.formatDateKo(e.start) : UI.util.formatDateKo(e.start) + ' ~ ' + UI.util.formatDateKo(e.end))); });
      var closed = m.days.filter(function (d) { return !d.operating; }).map(function (d) { return +d.date.slice(8) + '일(' + d.weekdayKo + ')'; });
      if (closed.length) calKids.push(row('운영 안 하는 날', closed.join(', ')));
      root.appendChild(card('월별 일정', calKids));
    }
  }
</script>
