<style>
  .pt-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); word-break: keep-all; }
  .pt-row:last-child { border-bottom: 0; }
  .pt-k { font-weight: 700; flex: 0 0 auto; min-width: 5.2em; }
  .pt-v { flex: 1 1 auto; min-width: 0; }
  .pt-pills { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .pt-note { margin: 8px 0; word-break: keep-all; }
  .pt-fb { margin: 4px 0 12px; padding: 10px 12px; background: var(--muted-weak); border-radius: var(--radius-sm); white-space: pre-wrap; word-break: keep-all; }
  .pt-fb b { display: block; margin-bottom: 2px; }
  .pt-nav { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
  .pt-nav .btn, .pt-card .btn { flex: 0 0 auto; white-space: nowrap; }
</style>
<script>
  /**
   * 학생·학부모 포털 본문(C36, F14 읽기만, D13 시안 docs/design/stage7-screens.md 1·2절).
   * 학생 홈은 본인 id, 학부모 홈은 고른 자녀 id로 부른다. 서버(getPortalStudent)가 본인·연결된 자녀인지 다시 확인하고, 이 파일은 서버가 준 것만 그린다.
   * 화면: 홈 → [내 OUT 자세히] · [출결 기록 전체 보기] · [월별 일정 열기](같은 자리에서 바뀌고 [← 돌아가기]로 홈).
   */
  /** 저장 값 → 학부모 화면 표기(writing.md 7절 '학부모 화면 표기'). 급식·기숙사 표기는 이 함수 한 곳에서만 바꾼다 */
  function ptlFoodLabel(item, value) {
    if (!value) return '신청 안 함';
    if (item === '조식' || item === '중식') return value === '실시' ? '먹음' : value === '미실시' ? '먹지 않음' : value;
    if (item === '석식') return value === '미실시' ? '먹지 않음' : value;
    return value;   // 기숙사: 입실·퇴실
  }

  function renderPortal(root, studentId, month, view) {
    var viewerParent = false;
    /** 화면 바꾸기(C39): 기록을 남겨 안드로이드 뒤로 가기가 포털 홈으로 오게 한다. 학부모 홈은 PORTAL_NAV로 자녀 id를 키에 넣는다 */
    var navKey = function (v) { return window.PORTAL_NAV ? window.PORTAL_NAV(studentId, v) : (v === 'home' ? '' : v); };
    function show(v) { Nav.go(navKey(v)); renderPortal(root, studentId, '', v); }
    clear(root).appendChild(el('div', { class: 'loading', text: '불러오는 중…' }));
    call('getPortalStudent', studentId, month || '').then(function (p) { draw(p, view || 'home'); }).catch(function (err) { clear(root); showError(root, err); });

    function row(key, val) {
      return el('div', { class: 'pt-row' }, [el('span', { class: 'pt-k', text: key }), el('span', { class: 'pt-v' }, [typeof val === 'string' ? document.createTextNode(val) : val])]);
    }
    function card(title, kids, kind) { return el('div', { class: UI.cardClass(kind) + (kind === 'side' ? ' side' : '') + ' pt-card' }, [el('h2', { text: title })].concat(kids.filter(Boolean))); }
    function note(text) { return el('div', { class: 'muted pt-note', text: text }); }
    function link(text, fn) { return UI.rowLink({ text: text, onclick: fn }); }
    function pillsOf(list) { return el('div', { class: 'pt-pills' }, list); }
    function typeKind(t) { return /^병/.test(t) ? 'byung' : /^학원/.test(t) ? 'hak' : /^가정/.test(t) ? 'ga' : 'mute'; }
    function stateKind(s) { return s === '확정' ? 'confirmed' : s === '취소' ? 'canceled' : 'requested'; }
    function stateText(s) { return s === '요청' && viewerParent ? '확인 중' : s; }   // 저장 값은 요청·확정·취소 — 학부모에게만 '확인 중'(writing.md 7절)
    function excRow(e) {
      var r = row(e.dateKo, pillsOf([UI.statusPill(typeKind(e.type), e.type.replace(/\s*\(.*$/, '')), UI.statusPill(stateKind(e.state), stateText(e.state))]));
      return e.reason ? el('div', {}, [r, el('div', { class: 'pt-note', text: e.reason })]) : r;   // 왜 이 기록인지 한 줄(서버가 유형·상태로만 만든다)
    }
    function ymd(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
    function weekOf(today) {
      var p = today.split('-'), d = new Date(+p[0], +p[1] - 1, +p[2]);
      var mon = new Date(d.getFullYear(), d.getMonth(), d.getDate() - ((d.getDay() + 6) % 7));
      return [ymd(mon), ymd(new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6))];
    }

    function draw(p, view) {
      clear(root);
      var s = p.student, st = p.status || {}, parent = p.viewer === 'parent';
      viewerParent = parent;
      var back = function () { return el('button', { type: 'button', class: 'btn secondary', style: 'margin-bottom:12px', text: '← 돌아가기', onclick: function () { Nav.back(function () { renderPortal(root, studentId, '', 'home'); }); } }); };
      if (view === 'outs') return outsView(p, back);
      if (view === 'exceptions') return exceptionsView(p, back);
      if (view === 'month') return monthView(p, back);

      var info = s.grade + '학년 ' + s.classNo + '반 ' + s.number + '번' + (st['기숙사'] === '입실' ? ' · 기숙사생' : '') + (p.teacher ? ' · 담당 ' + p.teacher : '');
      root.appendChild(el('div', { class: 'card' }, [el('h2', { text: s.name }), el('div', { class: 'muted', text: info })]));

      var td = p.todo, base = window.PORTAL_APP_URL || '';
      if (td && td.kind === 'submit') {
        root.appendChild(el('div', { class: UI.cardClass('todo') }, [el('h2', { text: '다음 달 시간표를 내 주세요' }), el('div', { class: 'pt-note', text: td.monthKo + ' 시간표 제출 기간입니다. ' + td.endKo + '까지 내 주세요. 낸 뒤에는 부모님이 동의하고 선생님이 확인합니다.' }),
          UI.rowLink({ href: base + '?page=timetable&role=student', text: '시간표 내기' })]));
      } else if (td && td.kind === 'returned') {
        root.appendChild(el('div', { class: 'notice warn', style: 'word-break:keep-all' }, [document.createTextNode(td.monthKo + ' 시간표가 돌려보내졌습니다. 고쳐서 ' + td.endKo + '까지 다시 내 주세요. '), el('a', { href: base + '?page=timetable&role=student', text: '시간표 열기' })]));
      } else if (td && td.kind === 'agree') {
        root.appendChild(el('div', { class: UI.cardClass('todo') }, [el('h2', { text: '시간표에 동의해 주세요' }), el('div', { class: 'pt-note', text: '자녀가 ' + td.monthKo + ' 시간표를 냈습니다. 동의하면 담당 선생님이 확인한 뒤 ' + td.monthKo + ' 1일부터 적용됩니다.' }),
          UI.rowLink({ href: base + '?page=timetable&role=parent&student=' + encodeURIComponent(s.id), text: '시간표 보고 동의하기' })]));
      }
      var o = p.outs, live = o.items.filter(function (i) { return i.status === '유효'; });
      // 할 일 카드 바로 밑 한 줄: 이번 학기 OUT n/2(숫자 하나) — 자세한 것은 아래 OUT 카드
      root.appendChild(el('div', { class: 'card pt-outline' }, [o.total >= 2 ? UI.statusPill('out2', '퇴실 대상') : o.total === 1 ? UI.statusPill('out1', '1OUT') : UI.statusPill('mute', 'OUT 없음'),
        el('span', { text: '이번 학기 OUT ' + Math.min(o.total, 2) + '/2' })]));
      if (o.total >= 2 && !parent) {
        root.appendChild(el('div', { class: 'notice warn', style: 'word-break:keep-all', text: 'OUT이 2번 쌓여 퇴실 대상이 되었습니다. ' + (p.teacher ? '담당 ' + p.teacher + ' 선생님이' : '담당 선생님이') + ' 학부모님과 면담한 뒤 관리자 선생님이 퇴실을 정합니다. 궁금한 점은 담당 선생님께 먼저 물어봐 주세요.' }));
      }
      var outKids = [pillsOf([o.total >= 2 ? UI.statusPill('out2', '퇴실 대상') : o.total === 1 ? UI.statusPill('out1', '1OUT') : UI.statusPill('mute', 'OUT 없음'), el('span', { text: '이번 기간 ' + o.total + '건' })])];
      live.slice(0, 3).forEach(function (i) { outKids.push(el('div', { class: 'pt-note', text: i.dateKo + ' ' + i.ruleName })); });
      outKids.push(note(parent ? 'OUT은 학사 생활 규칙을 어겼을 때 받는 기록입니다. OUT이 2번 쌓이면 학사 퇴실 대상이 되고, 그때는 담당 선생님이 먼저 연락드립니다.' : 'OUT이 2번 쌓이면 퇴실 대상이 됩니다. OUT은 학기마다 처음부터 다시 셉니다.'));
      if (!parent) outKids.push(link('내 OUT 자세히', function () { show('outs'); }));
      root.appendChild(card(parent ? 'OUT' : '내 OUT', outKids, o.total > 0 ? 'key' : ''));   // OUT이 없으면 강조하지 않는다(노란 띠를 건수 > 0에만 주는 것과 같은 원칙)

      var wk = weekOf(p.today), shown = p.exceptions.filter(function (e) { return parent || (e.date >= wk[0] && e.date <= wk[1]); }).filter(function (e) { return e.state !== '취소'; });
      if (parent) shown = shown.slice(0, 5);
      var exKids = shown.length ? shown.map(excRow) : [UI.emptyState(parent ? '출결 기록이 없습니다.' : '이번 주 출결 기록이 없습니다.')];
      // 요청 중인 기록이 하나라도 보일 때만 이 안내를 띄운다(writing.md 2절 7번)
      if (shown.some(function (e) { return stateKind(e.state) === 'requested'; })) exKids.push(note(parent ? '확인 중인 기록은 선생님이 확인하면 확정으로 바뀝니다.' : '요청은 선생님이 확인하면 확정으로 바뀝니다.'));
      if (!parent) exKids.push(link('출결 기록 전체 보기', function () { show('exceptions'); }));
      root.appendChild(card(parent ? '출결 기록' : '이번 주 출결 기록', exKids));

      if (!parent) {
        var ph = [p.seat ? row('자습 자리', p.seat.space + ' ' + p.seat.label) : null, p.room ? row('기숙사', p.room.floor + '층 ' + p.room.roomNo + '호') : null].filter(Boolean);
        root.appendChild(card('내 자리와 방', ph.length ? ph : [note('아직 자습 자리와 기숙사 방이 정해지지 않았습니다.')], 'side'));
      } else {
        var meal = [row('기숙사', ptlFoodLabel('기숙사', st['기숙사'])), row('조식', ptlFoodLabel('조식', st['조식'])), row('석식', ptlFoodLabel('석식', st['석식']))];
        if (st['중식']) meal.push(row('중식', ptlFoodLabel('중식', st['중식'])));
        if ((p.pending || []).length) {
          meal.push(el('div', { class: 'pt-k', style: 'margin-top:8px', text: '바뀌는 것' }));
          p.pending.forEach(function (c) { meal.push(el('div', { class: 'pt-note', text: c.dateKo + '부터 ' + c.item + ': ' + ptlFoodLabel(c.item, c.value) })); });
        }
        root.appendChild(card('급식과 기숙사', meal, 'side'));
        var cn = p.counsel || [], cnKids = [];
        if (!cn.length) cnKids.push(el('div', { class: 'pt-note', text: '보여 드릴 상담 기록이 없습니다.' }));   // 없다고 단정하지 않는다(결정 92)
        cn.slice(0, 5).forEach(function (c) {
          cnKids.push(el('div', { class: 'pt-note', text: c.dateKo + (c.teacher ? ' ' + c.teacher + ' 선생님과' : '') + ' 상담이 있었습니다.' }));
          if (c.agreement) cnKids.push(el('div', { class: 'pt-fb' }, [el('b', { text: '합의 사항·다음 할 일' }), el('span', { text: c.agreement })]));   // 자녀가 "부모님께 보이기"를 켠 것만 온다(서버 규칙)
        });
        if (cn.length) cnKids.push(note('상담 내용은 학교에서만 봅니다. 자세한 이야기는 담당 선생님께 직접 물어봐 주세요.'));
        root.appendChild(card('상담', cnKids, 'side'));
        var iq = p.inquiry || [];   // 자녀가 "부모님께 보이기"를 켠 기록만 온다(서버 규칙) — 없으면 카드 자체를 그리지 않는다
        if (iq.length) {
          var iqKids = [];
          iq.forEach(function (r) {
            iqKids.push(el('div', { class: 'pt-fb' }, [UI.statusPill('mute', 'AI 제안'), ' ', UI.statusPill(r.progress === '완료' ? 'confirmed' : r.progress === '진행 중' ? 'requested' : 'mute', r.progress),
              el('b', { text: r.title, style: 'display:block;margin-top:4px' }), r.question ? el('span', { text: r.question }) : null,
              r.result_link ? el('a', { href: r.result_link, target: '_blank', rel: 'noopener noreferrer', style: 'display:flex;align-items:center;min-height:48px', text: '결과물 보기 (새 창)' }) : null]));
          });
          iqKids.push(note('탐구 주제는 AI가 제안한 것으로, 자녀가 골라 진행하고 있습니다.'));
          root.appendChild(card('탐구 기록', iqKids, 'side'));
        }
      }

      var up = p.upcoming || [];
      var upKids = up.length ? up.map(function (e) { return row(e.dateKo, e.title); }) : [UI.emptyState('앞으로 잡힌 학사 일정이 없습니다.')];
      upKids.push(link('월별 일정 열기', function () { show('month'); }));
      root.appendChild(card('앞으로 일정', upKids, 'side'));
      UI.layoutPortal(root);
      root.insertBefore(UI.refreshStamp(function () { renderPortal(root, studentId, '', ''); }), root.firstChild);   // 불러온 시각 + 다시 불러오기
      // 넓은 화면(840px~)에서 왼쪽 = 할 일·OUT·출결, 오른쪽 = 자리·급식·상담·일정
    }

    function outsView(p, back) {
      root.appendChild(back());
      var kids = p.outs.items.length ? p.outs.items.map(function (i) {
        return row(i.dateKo, pillsOf([el('span', { text: i.ruleName }), i.status === '취소' ? UI.statusPill('canceled', '취소') : UI.statusPill(p.outs.total >= 2 ? 'out2' : 'out1', i.weight + 'OUT')]));
      }) : [UI.emptyState('이번 기간 OUT이 없습니다.')];
      root.appendChild(card('내 OUT' + (p.term ? ' · ' + p.term.name : ''), kids));
      root.appendChild(card('OUT이란', [note('학교 생활 규칙을 어기면 OUT이 하나씩 쌓입니다. OUT이 2번 쌓이면 퇴실 대상이 되고, 담당 선생님과 학부모님이 면담을 한 뒤 관리자가 정합니다. OUT은 학기마다 처음부터 다시 셉니다. 취소된 OUT은 세지 않습니다.')]));
    }

    function exceptionsView(p, back) {
      root.appendChild(back());
      var kids = p.exceptions.length ? p.exceptions.map(excRow) : [UI.emptyState('이번 기간 출결 기록이 없습니다.')];
      kids.push(note('요청은 선생님이 확인하면 확정으로 바뀝니다. 취소된 기록도 취소로 남습니다.'));
      root.appendChild(card('내 출결 기록' + (p.term ? ' · ' + p.term.name : ''), kids));
    }

    function monthView(p, back) {
      root.appendChild(back());
      var m = p.month, y = +m.month.slice(0, 4), mo = +m.month.slice(5, 7);
      var shift = function (d) { var t = new Date(y, mo - 1 + d, 1); return t.getFullYear() + '-' + ('0' + (t.getMonth() + 1)).slice(-2); };
      var kids = [el('div', { class: 'pt-nav' }, [
        el('button', { type: 'button', class: 'btn secondary', text: '← 이전', onclick: function () { renderPortal(root, studentId, shift(-1), 'month'); } }),
        el('b', { style: 'white-space:nowrap', text: y + '년 ' + mo + '월' }),
        el('button', { type: 'button', class: 'btn secondary', text: '다음 →', onclick: function () { renderPortal(root, studentId, shift(1), 'month'); } })
      ])];
      if (!m.events.length) kids.push(UI.emptyState('이 달에 등록된 일정이 없습니다.'));
      m.events.forEach(function (e) { kids.push(row(e.start === e.end ? UI.util.formatDateKo(e.start) : UI.util.formatDateKo(e.start) + ' ~ ' + UI.util.formatDateKo(e.end), e.title + ' (' + e.kind + ')')); });
      var closed = m.days.filter(function (d) { return !d.operating; }).map(function (d) { return +d.date.slice(8) + '일(' + d.weekdayKo + ')'; });
      if (closed.length) kids.push(row('운영 안 하는 날', closed.join(', ')));
      root.appendChild(card('월별 일정', kids));
    }
  }
</script>
