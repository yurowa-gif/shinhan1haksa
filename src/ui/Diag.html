<!DOCTYPE html>
<html lang="ko">
<head><base target="_top"><meta charset="utf-8"><?!= include('ui/Styles') ?></head>
<body>
  <header class="top"><h1>접속 진단 (PRD 6.1)</h1></header>
  <main>
    <div class="card">
      <h2>페이지를 열 때(doGet)</h2>
      <dl class="kv">
        <dt>접속자 이메일</dt><dd><b><?= diag.activeEmail ?></b></dd>
        <dt>실행 계정</dt><dd><?= diag.effectiveUser ?></dd>
        <dt>임시 사용자 키</dt><dd><?= diag.tempKey ?></dd>
        <dt>판정</dt><dd><?= diag.mode ?></dd>
        <dt>등록 여부</dt><dd><?= diag.registered ?></dd>
        <dt>역할</dt><dd><?= diag.roles ?></dd>
        <dt>확인 시각</dt><dd><?= diag.checkedAt ?></dd>
      </dl>
      <? for (var i = 0; i < diag.errors.length; i++) { ?>
        <div class="error" style="margin-top:8px"><?= diag.errors[i] ?></div>
      <? } ?>
    </div>
    <div class="card">
      <h2>서버 호출로 다시 확인(google.script.run)</h2>
      <p class="muted">화면의 버튼이 서버 함수를 부를 때도 이메일이 잡히는지 봅니다.</p>
      <button class="btn" type="button" id="ping">다시 확인</button>
      <div id="pingOut" style="margin-top:12px"></div>
    </div>
    <div class="card muted">
      개인 gmail(학생·학부모 시험 계정)로 열었을 때 "접속자 이메일"이 <b>(빈 값)</b>이면
      PRD 6.1의 2번 대안(학생·학부모용 별도 웹앱 + 신원 토큰)으로 가야 합니다.
      결과 화면을 캡처해 두세요.
    </div>
  </main>
  <?!= include('ui/Client') ?>
  <script>
    document.getElementById('ping').addEventListener('click', function () {
      var out = clear(document.getElementById('pingOut'));
      out.appendChild(el('div', { class: 'loading', text: '확인 중…' }));
      call('diagPing').then(function (d) {
        clear(out).appendChild(kv([
          ['접속자 이메일', d.activeEmail], ['실행 계정', d.effectiveUser], ['판정', d.mode],
          ['등록 여부', d.registered], ['역할', d.roles], ['확인 시각', d.checkedAt]
        ]));
        d.errors.forEach(function (e) { out.appendChild(el('div', { class: 'error', text: e })); });
      }).catch(function (err) { clear(out); showError(out, err); });
    });
  </script>
</body>
</html>
