<style>
  .pl-row { padding: 8px 0; border-bottom: 1px solid var(--line); word-break: keep-all; }
  .pl-row:last-child { border-bottom: 0; }
  .pl-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .pl-name { font-weight: 700; }
  .pl-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .pl-pick { display: flex; align-items: center; gap: var(--gap-sm); min-height: var(--tap); cursor: pointer; border-bottom: 1px solid var(--line); word-break: keep-all; }
  .pl-pick:last-of-type { border-bottom: 0; }
  .pl-pick input { width: 28px; height: 28px; flex: 0 0 auto; }
  .pl-pick .pl-label { flex: 1 1 auto; }
  .pl-pick.off { color: var(--muted-ink); }
  .pl-rec { padding: 8px 0; border-bottom: 1px solid var(--line); word-break: keep-all; }
  .pl-rec:last-child { border-bottom: 0; }
  .pl-list { margin: 0; padding: 0; }
  .pl-tools { display: flex; gap: 8px; flex-wrap: wrap; }
  .pl-text { width: 100%; min-height: 96px; }
</style>
<script>
  /**
   * 이수 계획 화면(C51, F15, 시안 D25 docs/design/stage6/screens.md 10절). ?role=student|parent|hall_teacher|homeroom|admin 으로 열린다.
   * 학생: 학기·선택군별로 과목 고르기, 과목마다 '부모님께 보이기' / 학부모: 자녀가 켠 과목만 / 담당교사: '계획' 줄 확정, 피드백 / 담임·관리자: 보기만.
   * 권한·택N·확정·공개 범위는 모두 서버(CoursePlan.gs)가 정한다. 이 파일은 서버가 준 칸만 그린다.
   */
  function renderScreen(root) {
    var role = (window.SCREEN_PARAMS || {}).role || '';
    var box = el('div');
    root.appendChild(box);
    box.appendChild(el('div', { class: 'loading', text: '불러오는 중입니다…' }));
    call('getCoursePlanContext', role).then(function (ctx) {
      clear(box);
      if (!ctx.ok) { box.appendChild(el('div', { class: 'error', text: ctx.reason })); return; }
      if (ctx.mode === 'student') planStudent(box, ctx);
      else if (ctx.mode === 'parent') planParent(box);
      else planStaff(box, ctx);
    }).catch(function (err) { clear(box); showError(box, err); });
  }

  function plKo(iso) { var d = String(iso || '').slice(0, 10); return UI.util.ymdParse(d) ? UI.util.formatDateKo(d) : ''; }
  function plGroup(g) { return /^선택군/.test(g) ? g : '선택군 ' + g; }
  function plStatePill(state) { return state === '확정' ? UI.statusPill('confirmed', '확정') : UI.statusPill('mute', '계획'); }

  /** 희망 학과가 권하는 과목(참고) 카드. 학생·교사 응답에만 recs가 있다 */
  function plRecsCard(recs, teacher) {
    var card = el('div', { class: 'card' }, [el('h2', { text: '희망 학과가 권하는 과목 (참고)' })]);
    if (!recs.hasTargets) card.appendChild(el('div', { class: 'muted', style: 'word-break:keep-all', text: '진로 프로필에 목표 학과를 적으면 그 학과가 권하는 과목이 여기에 나옵니다.' }));
    else if (!recs.list.length) card.appendChild(el('div', { class: 'muted', style: 'word-break:keep-all', text: '이 학과의 권장 과목 자료가 없습니다.' }));
    recs.list.forEach(function (r) {
      var kids = [el('b', { text: r.university + ' ' + r.unit })];
      if ((r.core || []).length) kids.push(el('div', { text: '핵심 권장: ' + r.core.join(', ') }));
      if ((r.recommended || []).length) kids.push(el('div', { text: '권장: ' + r.recommended.join(', ') }));
      kids.push(el('div', { class: 'muted', text: '출처: ' + (r.sourceTitle || '대학 안내 자료') + ' · 기준 ' + r.baseYear + '학년도' }));
      if (r.note) kids.push(el('div', { class: 'muted', style: 'word-break:keep-all', text: r.note }));
      if (/^https?:\/\//i.test(r.sourceUrl || '')) kids.push(el('a', { class: 'row-link', href: r.sourceUrl, target: '_blank', rel: 'noopener noreferrer', text: '출처 열기' }));
      card.appendChild(el('div', { class: 'pl-rec' }, kids));
    });
    if (recs.hasTargets) card.appendChild(el('div', { class: 'muted', style: 'word-break:keep-all;margin-top:8px', text: teacher ? '참고 자료이며 판정하지 않습니다.' : '참고 자료입니다. 이 과목을 들어야만 지원할 수 있다는 뜻이 아닙니다. 궁금하면 담당 선생님과 이야기해 주세요.' }));
    return card;
  }

  function plFeedbackCard(list, opts) {
    opts = opts || {};
    var card = el('div', { class: 'card' }, [el('h2', { text: opts.title || '선생님 말씀' })]);
    list.forEach(function (f) {
      var who = [f.teacherName ? f.teacherName + (opts.teacher ? '' : ' 선생님') : '', plKo(f.at)].filter(Boolean).join(' · ');
      card.appendChild(el('div', { class: 'fb' }, [el('b', { text: who }), el('span', { text: f.content })]));
      if (opts.oncancel && f.mine) card.appendChild(el('button', { type: 'button', class: 'btn secondary', text: '취소 처리', onclick: function () { opts.oncancel(f); } }));
    });
    return card;
  }

  /* ───────────── 학생 ───────────── */
  function planStudent(box, ctx) {
    var sid = ctx.student.id, bar = null, notice = null;
    var h1 = document.querySelector('header.top h1'); if (h1) h1.textContent = '내 이수 계획';
    Nav.bind(function (k) { if (k === 'edit') openEdit(); else load(); });   // 뒤로 가기(C39): 고르기 → 내 이수 계획
    function dropBar() { if (bar && bar.parentNode) bar.parentNode.removeChild(bar); bar = null; var m = document.querySelector('main'); if (m) m.classList.remove('has-actionbar'); }
    function fetch(then) { dropBar(); clear(box); box.appendChild(el('div', { class: 'loading', text: '불러오는 중입니다…' })); call('getCoursePlanStudent', sid).then(function (r) { clear(box); then(r); }).catch(function (err) { clear(box); showError(box, err); }); }
    function load() { fetch(view); }
    function openEdit() { fetch(edit); }
    load();

    function rowsOf(r, g, s) { var m = r.semesters.filter(function (x) { return x.grade === g && x.semester === s; })[0]; return m ? m.rows : []; }

    function view(r) {
      if (!r.ready) {
        box.appendChild(el('div', { class: 'card' }, [UI.emptyState('아직 우리 학년의 교육과정이 올라오지 않았습니다.'), el('div', { class: 'muted', style: 'word-break:keep-all', text: '올라오면 여기에서 과목을 고를 수 있습니다. 급하면 담당 선생님께 알려 주세요.' })]));
        return;
      }
      if (notice) { box.appendChild(notice); notice = null; }
      box.appendChild(el('div', { class: 'notice info', style: 'word-break:keep-all', text: '"확정"은 담당 선생님이 확인했다는 표시입니다. 확정된 과목을 바꾸면 다시 "계획"이 되고 선생님이 다시 확인합니다.' }));
      if (!r.canWrite) box.appendChild(el('div', { class: 'notice info', text: '학사를 나간 뒤에는 고칠 수 없습니다. 기록은 계속 볼 수 있습니다.' }));
      r.options.forEach(function (o) {
        var rows = rowsOf(r, o.grade, o.semester), card = el('div', { class: 'card' }, [el('h2', { text: o.grade + '학년 ' + o.semester + '학기' })]);
        if (!rows.length) {
          card.appendChild(el('div', { class: 'muted', text: '아직 고른 과목이 없습니다.' }));
          if (r.canWrite) card.appendChild(el('button', { type: 'button', class: 'btn secondary', style: 'margin-top:8px', text: '과목 고르기', onclick: function () { Nav.go('edit'); edit(r, o.grade + '|' + o.semester); } }));
        }
        rows.forEach(function (p) {
          var tags = [plStatePill(p.state)];
          if (p.dropped) tags.push(UI.statusPill('mute', '교육과정에서 빠진 과목'));
          var row = el('div', { class: 'pl-row' }, [el('div', { class: 'pl-top' }, [el('span', { class: 'pl-name', text: p.course }), el('span', { class: 'muted', text: plGroup(p.choice_group) })]), el('div', { class: 'pl-tags' }, tags)]);
          if (p.dropped) row.appendChild(el('div', { class: 'muted', text: '다른 과목으로 바꿔 주세요.' }));
          if (r.canWrite) row.appendChild(UI.shareCheck({ on: p.show_to_parent === 'TRUE' || p.show_to_parent === true, itemName: p.course, confirmOff: true, onchange: function (next, done) {
            call('setCoursePlanPublish', p.id, next).then(function (res) {
              if (!res.ok) { UI.toast(res.errors[0], { kind: 'warn', ms: 6000 }); done(false); return; }
              UI.toast(next ? '부모님께 보입니다.' : '부모님께 보이지 않습니다.', { kind: 'ok' }); done(true);
            }).catch(function (err) { done(false); UI.toast(err && err.message || '저장하지 못했습니다.', { kind: 'warn' }); });
          } }));
          card.appendChild(row);
        });
        box.appendChild(card);
      });
      if (r.feedback.length) {
        box.appendChild(plFeedbackCard(r.feedback));
        box.appendChild(el('div', { class: 'muted', style: 'word-break:keep-all', text: '선생님 말씀은 나와 선생님만 봅니다. 부모님께는 보이지 않습니다.' }));
      }
      box.appendChild(plRecsCard(r.recs, false));
      if (r.canWrite) bar = UI.actionBar([{ text: '과목 고르기', kind: 'primary', onclick: function () { Nav.go('edit'); edit(r); } }], { mount: true });
    }

    function edit(r, startKey) {
      dropBar(); clear(box);
      var errBox = el('div'), tabs = el('nav', { class: 'tabs wrap', 'aria-label': '학기 고르기' }), semBox = el('div'), chosen = {}, orig = {}, cur = '';
      var semKey = function (o) { return o.grade + '|' + o.semester; };
      var keyOf = function (g, s2, grp, c) { return [g, s2, grp, c].join('|'); };
      r.semesters.forEach(function (s2) { s2.rows.forEach(function (p) { if (!p.dropped) { chosen[keyOf(p.grade, p.semester, p.choice_group, p.course)] = true; orig[keyOf(p.grade, p.semester, p.choice_group, p.course)] = true; } }); });
      box.appendChild(el('div', { class: 'notice info', style: 'word-break:keep-all', text: '선택군마다 정해진 수까지 고를 수 있습니다. 덜 고른 채로 저장해도 됩니다(나중에 이어서). 학기를 바꿔도 고른 것은 그대로이고, 저장은 한 번에 모두 됩니다.' }));
      box.appendChild(tabs); box.appendChild(errBox); box.appendChild(semBox);
      // 학기마다 바꾼 것이 있는지(저장 전 표시): 처음 저장된 선택과 지금 선택이 다른 학기
      function changedIn(o) {
        var pre = o.grade + '|' + o.semester + '|';
        var keys = {}; Object.keys(chosen).concat(Object.keys(orig)).forEach(function (k) { if (k.indexOf(pre) === 0) keys[k] = true; });
        return Object.keys(keys).some(function (k) { return !!chosen[k] !== !!orig[k]; });
      }
      function dirty() { return r.options.some(changedIn); }
      function drawTabs() {
        clear(tabs);
        r.options.forEach(function (o) {
          var k = semKey(o), ch = changedIn(o);
          var b = el('button', { class: 'tab' + (k === cur ? ' on' : ''), type: 'button', 'aria-label': o.grade + '학년 ' + o.semester + '학기' + (ch ? ' (바꾼 것 있음)' : ''), text: o.grade + '학년 ' + o.semester + '학기' + (ch ? ' ●' : '') });
          b.addEventListener('click', function () { cur = k; drawTabs(); drawSem(); });
          tabs.appendChild(b);
        });
      }
      function drawSem() {
        clear(semBox);
        var o = r.options.filter(function (x) { return semKey(x) === cur; })[0];
        if (!o) return;
        var semCard = el('div', { class: 'card' }, [el('h2', { text: o.grade + '학년 ' + o.semester + '학기' })]);
        if (o.required.length) semCard.appendChild(el('div', { class: 'muted', style: 'word-break:keep-all', text: '꼭 듣는 과목: ' + o.required.join(', ') }));
        if (!o.groups.length) semCard.appendChild(el('div', { class: 'muted', text: '이 학기에는 고를 과목이 없습니다.' }));
        semBox.appendChild(semCard);
        o.groups.forEach(function (g) {
          var count = el('span'), full = el('div', { class: 'muted', style: 'word-break:keep-all;display:none' }), inputs = [];
          var card = el('div', { class: 'card' }, [el('div', { class: 'pl-top' }, [el('h2', { text: plGroup(g.choiceGroup) + (g.pickN ? ' · ' + g.pickN + '과목 고르기' : '') }), count])]);
          function refresh() {
            var n = inputs.filter(function (x) { return x.input.checked; }).length;
            var pill = g.pickN ? UI.statusPill(n >= g.pickN ? 'confirmed' : 'mute', n + '/' + g.pickN + ' 고름') : UI.statusPill('mute', n + '과목 고름');
            count.replaceWith(pill); count = pill;
            var lock = g.pickN > 0 && n >= g.pickN;
            inputs.forEach(function (x) { x.input.disabled = lock && !x.input.checked; x.label.classList.toggle('off', x.input.disabled); });
            full.style.display = lock ? 'block' : 'none';
            if (lock) full.textContent = g.pickN + '과목을 모두 골랐습니다. 바꾸려면 고른 과목 하나를 먼저 빼 주세요.';
          }
          g.courses.forEach(function (c, i) {
            var k = keyOf(o.grade, o.semester, g.choiceGroup, c), input = el('input', { type: 'checkbox' });
            input.checked = !!chosen[k];
            input.addEventListener('change', function () { if (input.checked) chosen[k] = true; else delete chosen[k]; refresh(); drawTabs(); });
            var kids = [input, el('span', { class: 'pl-label', text: c })];
            if (g.tags[i]) kids.push(UI.statusPill('mute', g.tags[i]));
            var label = el('label', { class: 'pl-pick' }, kids);
            inputs.push({ input: input, label: label, course: c });
            card.appendChild(label);
          });
          card.appendChild(full);
          semBox.appendChild(card);
          refresh();
        });
      }
      cur = startKey && r.options.some(function (o) { return semKey(o) === startKey; }) ? startKey : (r.options[0] ? semKey(r.options[0]) : '');
      drawTabs(); drawSem();
      function gather() {
        var out = [];
        r.options.forEach(function (o) { o.groups.forEach(function (g) { g.courses.forEach(function (c) { if (chosen[keyOf(o.grade, o.semester, g.choiceGroup, c)]) out.push({ grade: o.grade, semester: o.semester, choice_group: g.choiceGroup, course: c }); }); }); });
        return out;
      }
      function leave() {
        if (!dirty()) { Nav.back(function () { load(); }); return; }
        UI.confirmSheet({ title: '돌아가기', message: '저장하지 않은 바뀐 곳이 있습니다. 돌아가면 사라집니다.', confirmText: '돌아가기', cancelText: '계속 고르기', danger: true, onconfirm: function () { Nav.back(function () { load(); }); } });
      }
      bar = UI.actionBar([{ text: '저장', kind: 'primary', onclick: function () {
        clear(errBox);
        call('saveCoursePlan', gather()).then(function (res) {
          if (!res.ok) {
            errBox.appendChild(el('div', { class: 'card' }, [el('h2', { text: '고칠 곳이 ' + res.errors.length + '군데 있습니다' }), el('div', { class: 'muted', text: '저장하지 않았습니다.' })].concat(res.errors.map(function (m) { return el('div', { class: 'error', text: m }); }))));
            errBox.scrollIntoView && errBox.scrollIntoView({ block: 'start' });
            return;
          }
          if (res.warnings && res.warnings.length) notice = el('div', { class: 'notice warn', style: 'word-break:keep-all', text: res.warnings.join(' ') });
          UI.toast('저장했습니다.', { kind: 'ok' });
          Nav.back(function () { load(); });
        }).catch(function (err) { showError(errBox, err); });
      } }, { text: '돌아가기', kind: 'secondary', onclick: leave }], { mount: true });
    }
  }

  /* ───────────── 학부모 ───────────── */
  /** 학부모는 이수 계획을 '진로' 화면의 카드로 본다(시안 p-plan: 진로와 상담 화면 한 곳). 이 주소로 열면 그곳으로 안내한다 */
  function planParent(box) {
    box.appendChild(el('div', { class: 'card' }, [el('h2', { text: '이수 계획' }), el('div', { class: 'muted', style: 'word-break:keep-all', text: '자녀가 학부모님께 보여 주기로 한 이수 계획은 "진로" 화면에서 볼 수 있습니다.' }),
      UI.rowLink({ href: (document.querySelector('a.back') || { href: '' }).href + '?page=career&role=parent', text: '진로 화면 열기' })]));
  }

  /* ───────────── 담당교사·담임·관리자 ───────────── */
  function planStaff(box, ctx) {
    var want = (window.SCREEN_PARAMS || {}).student || '', tab = ctx.pending ? 'pending' : 'all', picked = '', seq = 0;
    var head = el('div', { class: 'card ld-list' }), body = el('div', { class: 'ld-detail' });
    var wrap = el('div', { class: 'ld' }, [head, body]);
    var wideMq = window.matchMedia ? window.matchMedia('(min-width: 840px)') : { matches: false };
    box.appendChild(wrap);
    var mainEl = document.querySelector('main'); if (mainEl) mainEl.classList.add('wide');
    var hint = function () { return el('div', { class: 'ld-empty muted', text: '왼쪽에서 학생을 고르면 이수 계획이 여기에 나옵니다.' }); };
    body.appendChild(hint());
    Nav.bind(function (k) { if (String(k).indexOf('s:') === 0) detail(String(k).slice(2)); else toList(); });
    drawList();
    if (want && ctx.list.some(function (s) { return s.id === want; })) detail(want);

    function toList() { seq++; picked = ''; clear(body); body.appendChild(hint()); wrap.classList.remove('has-detail'); drawList(); window.scrollTo(0, 0); }
    function drawList() {
      clear(head);
      head.appendChild(el('h2', { text: '이수 계획' }));
      if (!ctx.total) { head.appendChild(UI.emptyState(ctx.role === 'homeroom' ? '우리 반 학사생이 없습니다.' : '이번 운영 기간에 담당하는 학생이 없습니다.')); return; }
      head.appendChild(UI.segmented({ label: '보기', value: tab, options: [{ value: 'pending', label: '확인할 것 ' + ctx.pending }, { value: 'all', label: '전체 ' + ctx.total }], onchange: function (v) { tab = v; drawList(); } }));
      var rows = ctx.list.filter(function (s) { return tab === 'all' || s.state === '확인'; });
      if (!rows.length) head.appendChild(UI.emptyState('확인할 이수 계획이 없습니다.'));
      rows.forEach(function (s) {
        var pill = s.state === '확인' ? UI.statusPill('todo', '확인 ' + s.pending) : s.state === '확정' ? UI.statusPill('confirmed', '확정') : UI.statusPill('mute', '안 고름');
        head.appendChild(el('div', { class: 'ld-row' }, [
          el('button', { type: 'button', class: 'ld-pick', 'aria-current': picked === s.id ? 'true' : null, onclick: function () { if (!wideMq.matches) Nav.go('s:' + s.id); detail(s.id); } }, [
            el('span', { class: 'ld-name', text: s.label }), el('span', { class: 'muted', text: s.line })]), pill]));
      });
    }
    function detail(sid) {
      var mine = ++seq; picked = sid; wrap.classList.add('has-detail'); drawList();
      clear(body); body.appendChild(el('div', { class: 'loading', text: '불러오는 중입니다…' }));
      call('getCoursePlanStudent', sid).then(function (r) { if (mine === seq) { clear(body); drawDetail(r, sid); } }).catch(function (err) { if (mine === seq) { clear(body); showError(body, err); } });
    }
    function drawDetail(r, sid) {
      body.appendChild(el('div', { class: 'card' }, [el('h2', { text: r.student.title }), el('div', { class: 'muted', text: r.student.label + ' · ' + r.entryYear + '학년도 입학' }),
        el('div', { class: 'pl-tools', style: 'margin-top:8px' }, [el('button', { type: 'button', class: 'btn secondary ld-narrow', text: '학생 바꾸기', onclick: function () { Nav.back(toList); } })])]));
      var checks = [];
      var confirmBtn = el('button', { type: 'button', class: 'btn', text: '고른 0과목 확정', disabled: 'disabled' });
      function selected() { return checks.filter(function (c) { return c.input.checked; }); }
      function refresh() { var n = selected().length; confirmBtn.textContent = '고른 ' + n + '과목 확정'; confirmBtn.disabled = !n; }
      if (!r.semesters.length) body.appendChild(el('div', { class: 'card' }, [el('div', { text: '아직 고른 과목이 없습니다.' }), el('div', { class: 'muted', style: 'word-break:keep-all', text: '학생이 자기 화면에서 고릅니다. 선생님이 대신 고를 수 없습니다.' })]));
      r.semesters.forEach(function (s) {
        var card = el('div', { class: 'card' }, [el('h2', { text: s.grade + '학년 ' + s.semester + '학기' })]);
        s.rows.forEach(function (p) {
          var tags = [plStatePill(p.state)];
          if (p.show_to_parent === 'TRUE' || p.show_to_parent === true) tags.push(UI.statusPill('mute', '학부모에게 보임'));
          if (p.dropped) tags.push(UI.statusPill('mute', '교육과정에서 빠진 과목'));
          var kids = [];
          if (r.canConfirm && p.state === '계획') {
            var input = el('input', { type: 'checkbox' });
            input.addEventListener('change', refresh);
            checks.push({ input: input, id: p.id, course: p.course, sem: s.grade + '학년 ' + s.semester + '학기' });
            kids.push(el('label', { class: 'pl-pick', style: 'border-bottom:0' }, [input, el('span', { class: 'pl-label pl-name', text: p.course })]));
          } else kids.push(el('div', { class: 'pl-name', text: p.course }));
          kids.push(el('div', { class: 'muted', text: plGroup(p.choice_group) + (p.pickN ? ' (' + p.pickN + '과목 고르기)' : '') }));
          kids.push(el('div', { class: 'pl-tags' }, tags));
          card.appendChild(el('div', { class: 'pl-row' }, kids));
        });
        body.appendChild(card);
      });
      if (r.canConfirm && checks.length >= 3) {
        var allBtn = el('button', { type: 'button', class: 'btn secondary', text: '계획 ' + checks.length + '과목 모두 고르기' });
        allBtn.addEventListener('click', function () { checks.forEach(function (c) { c.input.checked = true; }); refresh(); });
        body.appendChild(el('div', { class: 'pl-tools' }, [allBtn]));
      }
      if (r.canConfirm && r.semesters.length) {
        confirmBtn.addEventListener('click', function () {
          var sel = selected(); if (!sel.length) return;
          UI.confirmSheet({ title: '확정', lead: r.student.title + ' · ' + sel.length + '과목', lines: sel.map(function (c) { return c.sem + ' ' + c.course; }).concat(['학생 화면에 "확정"으로 보입니다.', '학생이 과목을 바꾸면 다시 "계획"이 됩니다.']),
            message: '확정할까요?', confirmText: '확정', onconfirm: function () {
              confirmBtn.disabled = true;
              call('confirmCoursePlan', sid, sel.map(function (c) { return c.id; })).then(function (x) {
                if (!x.ok) { UI.toast(x.errors[0], { kind: 'warn', ms: 6000 }); detail(sid); return; }
                UI.toast(x.count + '과목을 확정했습니다.', { kind: 'ok' }); detail(sid); refreshCtx();
              }).catch(function (e) { UI.toast(e.message, { kind: 'warn' }); refresh(); });
            } });
        });
        body.appendChild(el('div', { class: 'card' }, [confirmBtn, el('div', { class: 'muted', style: 'word-break:keep-all;margin-top:8px', text: '확정은 선생님이 확인했다는 표시입니다. 학생이 과목을 바꾸면 그 줄은 다시 "계획"이 됩니다.' })]));
      }
      body.appendChild(plRecsCard(r.recs, true));
      var fbCard = plFeedbackCard(r.feedback, { title: '피드백', teacher: true, oncancel: r.canConfirm ? function (f) {
        UI.confirmWithReason({ title: '피드백 취소 처리', message: '취소해도 기록은 지워지지 않고 "취소"로 남습니다. 학생 화면에서는 사라집니다.', reasonLabel: '취소 사유', confirmText: '취소 처리',
          onconfirm: function (reason) { call('cancelCareerFeedback', f.id, reason).then(function (x) { if (!x.ok) { UI.toast(x.errors[0], { kind: 'warn' }); return; } UI.toast('취소 처리했습니다.', { kind: 'ok' }); detail(sid); }).catch(function (e) { UI.toast(e.message, { kind: 'warn' }); }); } });
      } : null });
      body.appendChild(fbCard);
      if (r.canConfirm && r.semesters.length) {
        var ta = el('textarea', { class: 'pl-text', maxlength: '1200' }), fld = UI.field('피드백 쓰기 (학생에게 보임)', ta, { hint: '학부모에게는 보이지 않습니다. 학생이 보면 안 되는 내용은 상담일지에 써 주세요.' });
        var btn = el('button', { type: 'button', class: 'btn', text: '피드백 남기기' });
        btn.addEventListener('click', function () {
          if (!ta.value.trim()) { fld.setError('피드백 내용을 적어 주세요.'); return; }
          fld.setError(''); btn.disabled = true;
          call('addPlanFeedback', sid, ta.value).then(function (x) {
            btn.disabled = false;
            if (!x.ok) { fld.setError(x.errors[0]); return; }
            UI.toast('피드백을 남겼습니다.', { kind: 'ok' }); detail(sid);
          }).catch(function (e) { btn.disabled = false; showError(fbCard, e); });
        });
        fbCard.appendChild(fld); fbCard.appendChild(btn);
      }
    }
    function refreshCtx() {   // 확정 뒤 목록의 숫자·꼬리표를 새로
      call('getCoursePlanContext', ctx.role).then(function (c) { if (c.ok) { ctx.list = c.list; ctx.pending = c.pending; ctx.total = c.total; drawList(); } });
    }
  }
</script>
