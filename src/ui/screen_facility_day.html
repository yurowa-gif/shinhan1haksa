<style>
  .fd-item { padding: 10px 0; border-bottom: 1px solid var(--line); word-break: keep-all; }
  .fd-item:last-child { border-bottom: 0; }
  .fd-line { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .fd-cancelled { color: var(--muted); }
  .fd-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius-sm); }
  .fd-table { border-collapse: collapse; width: 100%; }
  .fd-table th, .fd-table td { border: 1px solid var(--line); padding: 6px 4px; text-align: center; font-size: .85rem; }
  .fd-table th { background: var(--muted-weak); font-weight: 600; min-width: 48px; }
  .fd-table th.name, .fd-table td.name { position: sticky; left: 0; background: var(--card); text-align: left; padding: 6px 8px; white-space: nowrap; min-width: 6em; }
  .fd-nav { display: flex; gap: 8px; justify-content: space-between; align-items: center; margin-top: 8px; }
  .fd-cell { min-height: var(--tap); width: 100%; border: 0; background: transparent; color: var(--text); font: inherit; cursor: pointer; }
</style>
<script>
  /**
   * 시설 일지 보기(C35, F10): 그날 일지(근무교사는 그날만, 관리자는 어느 날이든) · 누적표(관리자만, 학생 × 날짜).
   * 서버가 근무 여부(dutyWindow 0)와 역할을 판정한다. docs/design/stage7-screens.md 3-3.
   */
  function renderScreen(root) {
    var U = UI.util;
    var state = { tab: window.SCREEN_TAB === 'stats' ? 'stats' : 'day', date: window.SCREEN_DATE || '', range: 'week', day: null, rep: null, openStudent: '', openDay: '', isAdmin: false };
    var head = el('div', { class: 'card' }), body = el('div');
    root.appendChild(head); root.appendChild(body);
    function fail(err) { UI.toast((err && err.message) || String(err), { kind: 'warn', ms: 5000 }); }
    function addDays(ymd, n) { var p = U.ymdParse(ymd); return new Date(Date.UTC(p.y, p.m - 1, p.d + n)).toISOString().slice(0, 10); }
    function weekFrom(ymd) { var p = U.ymdParse(ymd); return addDays(ymd, -((p.wd + 6) % 7)); }
    function hm(min) { var h = Math.floor(min / 60), m = min % 60; return h ? h + '시간' + (m ? ' ' + m + '분' : '') : m + '분'; }
    function who(s) { return s.grade + '학년 ' + s.classNo + '반 ' + s.number + '번 ' + s.name; }

    function drawHead() {
      clear(head);
      head.appendChild(el('h2', { text: '시설 일지' }));
      if (state.isAdmin) head.appendChild(UI.segmented({ label: '화면', value: state.tab, options: [{ value: 'day', label: '그날 일지' }, { value: 'stats', label: '누적표' }], onchange: function (v) { state.tab = v; load(); } }));
    }
    function load() {
      clear(body); body.appendChild(el('div', { class: 'muted', text: '불러오는 중…' }));
      if (state.tab === 'stats') {
        var to = state.range === 'week' ? addDays(weekFrom(state.date || todayGuess()), 6) : monthEnd(state.date || todayGuess());
        var from = state.range === 'week' ? weekFrom(state.date || todayGuess()) : (state.date || todayGuess()).slice(0, 8) + '01';
        call('getFacilityReport', { from: from, to: to }).then(function (r) { state.rep = r; state.isAdmin = true; drawHead(); drawStats(); })
          .catch(function (err) { clear(body); drawHead(); body.appendChild(el('div', { class: 'notice warn', text: /권한/.test((err && err.message) || '') ? '누적표는 관리자 선생님만 볼 수 있습니다.' : ((err && err.message) || String(err)) })); });   // 누적표는 관리자만 열린다(서버 판정)
      } else {
        call('getFacilityDay', state.date).then(function (r) { state.day = r; if (r.ok) { state.date = r.date; state.isAdmin = r.isAdmin; } drawHead(); drawDay(); }).catch(function (err) { clear(body); showError(body, err); });
      }
    }
    function todayGuess() { var n = new Date(); return n.getFullYear() + '-' + ('0' + (n.getMonth() + 1)).slice(-2) + '-' + ('0' + n.getDate()).slice(-2); }
    function monthEnd(ymd) { return addDays(new Date(Date.UTC(+ymd.slice(0, 4), +ymd.slice(5, 7), 1)).toISOString().slice(0, 10), -1); }

    /* ───────── 그날 일지 ───────── */
    function drawDay() {
      clear(body);
      var r = state.day;
      if (!r.ok) { body.appendChild(el('div', { class: 'notice warn', text: r.error })); return; }
      var nav = el('div', { class: 'card' });
      nav.appendChild(el('h2', { text: U.formatDateKo(r.date, true) }));
      if (r.isAdmin) {
        var dateF = UI.dateField({ label: '날짜 바꾸기', value: r.date, max: r.today, shortcuts: [{ label: '오늘', value: r.today }], onchange: function (v) { if (v) { state.date = v; load(); } } });
        nav.appendChild(dateF);
      } else nav.appendChild(el('div', { class: 'muted', text: '오늘 근무 선생님께 보이는 일지입니다.' }));
      body.appendChild(nav);
      if (!r.facilities.length) { body.appendChild(el('div', { class: 'card' }, [UI.emptyState('이날 쓴 시설 일지가 없습니다.')])); return; }
      r.facilities.forEach(function (f) {
        var card = el('div', { class: 'card' }, [el('h2', { text: f.facility })]);
        f.items.forEach(function (i) {
          var cancelled = i.status === '취소';
          var names = [i.student ? who(i.student) : '(알 수 없음)'].concat(i.companions.map(who));
          card.appendChild(el('div', { class: 'fd-item' + (cancelled ? ' fd-cancelled' : '') }, [
            el('div', { class: 'fd-line' }, [el('b', { text: i.start + '–' + i.end }), cancelled ? UI.statusPill('canceled', '취소') : null]),
            el('div', { text: names.join(' · ') }),
            i.purpose ? el('div', { class: 'muted', text: i.purpose }) : null
          ]));
        });
        body.appendChild(card);
      });
    }

    /* ───────── 누적표(관리자) ───────── */
    function drawStats() {
      clear(body);
      var r = state.rep;
      var ctl = el('div', { class: 'card' }, [UI.segmented({ label: '범위', value: state.range, options: [{ value: 'week', label: '이 주' }, { value: 'month', label: '이번 달' }], onchange: function (v) { state.range = v; load(); } })]);
      if (!r.ok) { body.appendChild(ctl); body.appendChild(el('div', { class: 'error', text: r.error })); return; }
      ctl.appendChild(el('div', { class: 'fd-nav' }, [
        el('button', { type: 'button', class: 'btn secondary', 'aria-label': '이전', text: '‹', onclick: function () { state.date = state.range === 'week' ? addDays(r.from, -7) : addDays(r.from, -1); load(); } }),
        el('b', { text: U.formatRangeKo(r.from, r.to) }),
        el('button', { type: 'button', class: 'btn secondary', 'aria-label': '다음', text: '›', onclick: function () { state.date = addDays(r.to, 1); load(); } })
      ]));
      ctl.appendChild(el('div', { class: 'muted', style: 'margin-top:8px', text: r.students.length + '명 · 합계 ' + hm(r.totalMinutes) }));
      body.appendChild(ctl);
      if (!r.students.length) { body.appendChild(el('div', { class: 'card' }, [UI.emptyState('이 운영 기간에 쓴 시설 일지가 없습니다.')])); return; }
      var table = el('table', { class: 'fd-table' });
      table.appendChild(el('thead', {}, [el('tr', {}, [el('th', { class: 'name', text: '학생' })].concat(r.dates.map(function (x) { return el('th', { text: x.date.slice(8).replace(/^0/, '') + '(' + x.weekdayKo + ')' }); })).concat([el('th', { text: '합계' })]))]));
      var tb = el('tbody');
      r.students.forEach(function (s) {
        var tr = el('tr', {}, [el('td', { class: 'name', text: s.grade + '-' + s.classNo + ' ' + s.number + '번 ' + s.name })]);
        r.dates.forEach(function (x) {
          var m = s.days[x.date];
          tr.appendChild(el('td', {}, [m ? el('button', { type: 'button', class: 'fd-cell', 'aria-label': s.name + ' ' + x.date + ' ' + hm(m), text: hm(m), onclick: function () { state.openStudent = s.id; state.openDay = x.date; drawStats(); showDayRows(s, x.date); } }) : el('span', { class: 'muted', text: '–' })]));
        });
        tr.appendChild(el('td', { text: hm(s.total) }));
        tb.appendChild(tr);
      });
      table.appendChild(tb);
      body.appendChild(el('div', { class: 'card' }, [el('div', { class: 'fd-wrap' }, [table]), el('div', { class: 'muted', style: 'margin-top:8px', text: '칸 = 그날 시설을 쓴 시간 합(함께 쓴 학생도 같은 시간으로 셉니다). 칸을 누르면 그날 기록이 아래에 나옵니다.' })]));
      var detail = el('div', { id: 'fd-detail' });
      body.appendChild(detail);
    }
    function showDayRows(s, date) {
      call('getFacilityDay', date).then(function (r) {
        var box = document.getElementById('fd-detail');
        if (!box) return;
        clear(box);
        if (!r.ok) { box.appendChild(el('div', { class: 'error', text: r.error })); return; }
        var card = el('div', { class: 'card' }, [el('h2', { text: s.name + ' · ' + U.formatDateKo(date, false) })]);
        r.facilities.forEach(function (f) {
          f.items.filter(function (i) { return i.status !== '취소' && ((i.student && i.student.id === s.id) || i.companions.some(function (c) { return c.id === s.id; })); }).forEach(function (i) {
            card.appendChild(el('div', { class: 'fd-item' }, [el('b', { text: f.facility + ' ' + i.start + '–' + i.end }), i.purpose ? el('div', { class: 'muted', text: i.purpose }) : null]));
          });
        });
        box.appendChild(card);
        box.scrollIntoView();
      }).catch(fail);
    }

    load();
  }
</script>
