<style>
  .out-chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .out-chips .chip { flex: 0 1 auto; max-width: 100%; white-space: normal; text-align: left; height: auto; min-height: var(--tap); line-height: 1.3; }
  .out-time { max-width: 12rem; }
  .out-err { margin-top: 8px; }
  ul.list li.out-item { display: block; }
  .out-item .out-line { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .out-item .out-cancelled { text-decoration: line-through; color: var(--muted-ink); }
  .out-item .row-btn { margin-top: 8px; min-height: var(--tap); }
  .out-who { word-break: keep-all; }
</style>
<script>
  /** OUT 화면: [기록](C11a: 학생 → 항목 → 일시·적발 교사 → 메모 → 저장) · [이번 학기](C11b: 학생별 요약·기록, 관리자 취소) · [오늘 현황]. 면담은 C13. */
  function renderScreen(root) {
    var state = { tab: '', termId: '', listStudent: '', list: null, ctx: null, student: null, ruleId: '', date: '', time: '', detectedBy: '', memo: '', busy: false, seq: 0 };
    var tabsBox = el('div');
    var body = el('div');
    var listBox = el('div');
    root.appendChild(tabsBox);
    root.appendChild(body);
    root.appendChild(listBox);
    var bar = null, saveBtn = null, noticeBox = null, statusBox = null, errHolders = {};

    function pad(n) { return (n < 10 ? '0' : '') + n; }
    
    function load(date, note) {
      var my = ++state.seq;
      call('getOutContext', date || '').then(function (ctx) {
        if (my !== state.seq) return;   // 더 나중에 누른 날짜의 응답만 쓴다
        state.ctx = ctx;
        if (!state.tab) {   // 처음: 주소의 tab, 없으면 기록할 수 있는 사람은 [기록], 아니면 [이번 학기]
          var want = window.SCREEN_TAB;
          state.tab = want === 'term' || want === 'today' ? want : (want === 'record' && ctx.canRecord) || (!want && ctx.canRecord) ? 'record' : 'term';
          if (state.tab === 'record' && !ctx.canRecord) state.tab = 'term';
          if (window.SCREEN_STUDENT && state.tab !== 'record') { state.tab = 'term'; state.listStudent = window.SCREEN_STUDENT; }
          drawTabs(); setVisible();
          if (state.tab !== 'record') loadList();
        }
        if (!state.date) state.date = ctx.today;
        if (!state.time) state.time = ctx.now;   // 기본 시각은 서버 시계(휴대폰 시계가 아님). 저장·비우기 뒤에는 비워서 다시 채운다
        if (state.student && !ctx.students.some(function (s) { return s.id === state.student.id; })) state.student = null;   // 이 날짜에 기록할 수 없는 학생이면 비운다
        draw(note);
      }).catch(function (err) { if (my !== state.seq) return; clear(body); showError(body, err); });
    }

    /** 이름 뒤 조사 은/는 */
    function eunNeun(name) { var c = String(name).charCodeAt(String(name).length - 1); return c >= 0xac00 && c <= 0xd7a3 && (c - 0xac00) % 28 !== 0 ? '은' : '는'; }
    function updateNotice() { if (!noticeBox) return; clear(noticeBox); var w = levelNotice(); if (w) noticeBox.appendChild(w); }
    function levelNotice() {
      if (!state.student) return null;
      var n = state.ctx.levels[state.student.id] || 0;
      if (n === 1) return el('div', { class: 'notice warn', text: UI.util.studentLabel(state.student) + eunNeun(state.student.name) + ' ' + state.ctx.periodWord + ' 이미 1OUT입니다. 저장하면 2OUT — 퇴실 대상이 됩니다.' });
      if (n >= 2) return el('div', { class: 'notice warn', text: UI.util.studentLabel(state.student) + eunNeun(state.student.name) + ' ' + state.ctx.periodWord + ' 이미 퇴실 대상(' + n + 'OUT)입니다.' });
      return null;
    }

    function canSave() { return !state.busy && !!state.student && !!state.ruleId && !!state.date && !!state.time; }
    function refresh() { if (saveBtn) saveBtn.disabled = !canSave(); }

    function draw(note) {
      var c = state.ctx;
      if (state.tab !== 'record') return;
      clear(body);
      if (bar && bar.parentNode) bar.parentNode.removeChild(bar);
      bar = null; saveBtn = null; noticeBox = null; errHolders = {};
      statusBox = el('div');   // 오류·결과는 이 상자 하나에만(쌓이지 않게)
      body.appendChild(statusBox);
      if (note) statusBox.appendChild(el('div', { class: 'notice info', text: note }));
      if (!c.term) { body.appendChild(UI.emptyState('운영 기간이 없습니다. 관리자에게 운영 기간을 만들어 달라고 요청해 주세요.')); return; }
      if (!c.canRecord) {
        body.appendChild(el('div', { class: 'card' }, [el('h2', { text: 'OUT 기록' }), el('div', { class: 'muted', text: 'OUT은 담당교사·근무교사·관리자가 기록합니다. 이 계정은 보기만 할 수 있습니다.' })]));
        return;
      }
      if (c.dutyYesterday && c.date === c.today) body.appendChild(el('div', { class: 'notice info', text: '어제 근무하셨습니다. 어제 밤 적발한 OUT은 날짜를 [어제]로 바꾸면 학사생 전체에서 고를 수 있습니다.' }));
      var studentCard = el('div', { class: 'card' }, [el('h2', { text: '학생' })]);
      errHolders.studentId = studentCard;
      studentCard.appendChild(UI.studentPicker({ students: c.students, label: '학생', placeholder: '이름·초성(ㅂㄷㅅ)·학번',
        onpick: function (s) { state.student = s; updateNotice(); refresh(); } }));   // 입력 중인 폼은 다시 그리지 않는다(고른 학생·글자가 사라지지 않게)
      if (!c.students.length) studentCard.appendChild(el('div', { class: 'muted', text: '이 날짜에 OUT을 기록할 수 있는 학생이 없습니다. 담당 학생이 없거나, 근무한 날(어제 밤까지)이 아닙니다.' }));
      body.appendChild(studentCard);
      noticeBox = el('div');
      body.appendChild(noticeBox);
      updateNotice();

      var chips = el('div', { class: 'out-chips', role: 'radiogroup', 'aria-label': '무엇을' });
      c.rules.forEach(function (r) {
        chips.appendChild(el('button', { type: 'button', class: 'chip' + (state.ruleId === r.id ? ' on' : ''), role: 'radio', 'aria-checked': state.ruleId === r.id ? 'true' : 'false', text: r.name,
          onclick: function (e) {
            state.ruleId = r.id;
            Array.prototype.forEach.call(chips.querySelectorAll('.chip'), function (b) { b.classList.remove('on'); b.setAttribute('aria-checked', 'false'); });
            e.currentTarget.classList.add('on'); e.currentTarget.setAttribute('aria-checked', 'true');
            refresh();
          } }));
      });
      var ruleCard = el('div', { class: 'card' }, [el('h2', { text: '무엇을' }), chips,
        el('div', { class: 'hint muted', style: 'margin-top:8px', text: '무단 지각·결석·이탈은 출결 담당이 미인정 특이사항으로 입력하면 자동으로 기록됩니다.' })]);
      errHolders.ruleId = ruleCard;
      body.appendChild(ruleCard);

      var dateField = UI.dateField({ label: '날짜', value: state.date, name: 'date', max: c.today,
        shortcuts: [{ label: '오늘', value: c.today }, { label: '어제', value: addDaysYmd(c.today, -1) }],
        onchange: function (v) { if (!v) return; state.date = v; state.student = null; load(v); } });   // 날짜가 바뀌면 고를 수 있는 학생이 달라져 다시 고른다
      var time = el('input', { type: 'time', class: 'out-time', value: state.time });
      time.addEventListener('input', function () { state.time = time.value; refresh(); });
      var who = el('select');
      who.appendChild(el('option', { value: '', text: '(모름)' }));
      c.teachers.forEach(function (t) { who.appendChild(el('option', { value: t.id, text: t.name + (t.me ? '(나)' : '') })); });
      who.value = state.detectedBy || (c.teachers.filter(function (t) { return t.me; })[0] || {}).id || '';
      state.detectedBy = who.value;
      who.addEventListener('change', function () { state.detectedBy = who.value; });
      var memo = el('textarea', { maxlength: '200' });
      memo.value = state.memo;
      memo.addEventListener('input', function () { state.memo = memo.value; });
      var whenCard = el('div', { class: 'card' }, [el('h2', { text: '언제·누가' }), dateField, UI.field('시각', time), UI.field('적발 교사', who),
        UI.field('상황 메모(선택)', memo, { hint: '200자까지. 길게 쓰지 않습니다.' })]);
      errHolders.occurredAt = errHolders.detectedBy = errHolders.memo = whenCard;
      body.appendChild(whenCard);

      bar = UI.actionBar([
        { text: '저장', kind: 'primary', disabled: true, onclick: onSave },
        { text: '비우기', kind: 'secondary', onclick: function () { reset(); load(state.date); } }
      ], { mount: true });
      saveBtn = bar.querySelectorAll('button')[0];
      refresh();
    }

    function addDaysYmd(ymd, n) {
      var d = new Date(Date.UTC(+ymd.slice(0, 4), +ymd.slice(5, 7) - 1, +ymd.slice(8, 10) + n));
      return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
    }
    function reset() { state.student = null; state.ruleId = ''; state.memo = ''; state.time = ''; }

    function inputValue() {
      return { studentId: state.student.id, occurredAt: state.date + 'T' + state.time, ruleId: state.ruleId, detectedBy: state.detectedBy, memo: state.memo.trim() };
    }

    /** 오류는 해당 칸 아래에(없으면 맨 위 상자에), 이전 오류는 지우고 첫 오류로 스크롤 */
    function showErrors(errors) {
      Array.prototype.forEach.call(body.querySelectorAll('.out-err'), function (n) { n.parentNode.removeChild(n); });
      if (statusBox) clear(statusBox);
      var first = null;
      errors.forEach(function (e) {
        var h = errHolders[e.field] || statusBox;
        var n = el('div', { class: 'fix out-err', role: 'alert', text: e.message });
        h.appendChild(n); if (!first) first = n;
      });
      if (first) first.scrollIntoView({ block: 'center' });
    }
    function showFailure(message) { showErrors([{ field: '', message: message }]); window.scrollTo(0, 0); }

    function onSave() { if (canSave()) doSave(false); }
    function doSave(ack) {
      state.busy = true; refresh();
      showErrors([]);
      var v = inputValue(); if (ack) v.acknowledge = true;
      call('saveOut', v).then(function (r) {
        state.busy = false;
        if (r.needsConfirm) {
          refresh();
          return UI.confirmSheet({ title: '이미 비슷한 OUT이 있습니다', lead: r.warnings.join(' '),
            lines: ['그래도 저장하면 OUT이 한 건 더 늘어납니다' + (r.before && r.before.count >= 2 ? '(이미 퇴실 대상입니다)' : r.after && r.after.level >= 2 ? '(저장하면 퇴실 대상)' : '')], confirmText: '그래도 저장', cancelText: '돌아가기', danger: true,
            onconfirm: function () { doSave(true); } });
        }
        if (!r.ok) {
          refresh();
          showErrors(r.errors);
          return;
        }
        var msg = '저장했습니다. ' + state.ctx.periodWord + ' ' + r.after.label + '입니다.';
        var warn = r.notifyWarn ? ' 알림 메일이 가지 않았습니다. 필요하면 담당 선생님께 직접 알려 주세요.' : '';
        UI.toast(msg + warn, r.notifyWarn ? { kind: 'warn', ms: 8000 } : undefined);
        reset();
        load(state.date, msg + warn);
        window.scrollTo(0, 0);
      }).catch(function (err) {
        state.busy = false; refresh();
        showFailure((err && err.message) || String(err));
      });
    }

    /* ───────── 탭 ───────── */
    function drawTabs() {
      clear(tabsBox);
      var opts = [];
      if (state.ctx && state.ctx.canRecord) opts.push({ value: 'record', label: '기록' });
      opts.push({ value: 'term', label: state.ctx && state.ctx.periodWord === '이번 기간' ? '기간' : '학기' }, { value: 'today', label: '오늘' });
      tabsBox.appendChild(UI.segmented({ label: '화면', value: state.tab, options: opts, onchange: function (v) { state.tab = v; state.listStudent = ''; showTab(); } }));
    }
    function setVisible() {
      var rec = state.tab === 'record';
      body.style.display = rec ? '' : 'none';
      listBox.style.display = rec ? 'none' : '';
    }
    function showTab() {
      var rec = state.tab === 'record';
      setVisible();
      if (!rec) { if (bar && bar.parentNode) bar.parentNode.removeChild(bar); bar = null; saveBtn = null; loadList(); }
      else if (state.ctx) { load(state.date); }   // 다시 열면 서버 값으로 새로 그린다
    }

    /* ───────── 목록(C11b) ───────── */
    function hm(at) { return (+at.slice(5, 7)) + '월 ' + (+at.slice(8, 10)) + '일 ' + at.slice(11, 16); }
    function loadList(note) {
      var my = ++state.seq;
      var filter = state.tab === 'today' ? { scope: 'today', termId: state.termId } : state.listStudent ? { scope: 'student', studentId: state.listStudent, termId: state.termId } : { scope: 'term', termId: state.termId };
      call('listOuts', filter).then(function (r) {
        if (my !== state.seq || state.tab === 'record') return;
        state.list = r; drawList(note);
      }).catch(function (err) { if (my !== state.seq) return; clear(listBox); showError(listBox, err); });
    }
    function drawList(note) {
      var r = state.list;
      clear(listBox);
      if (note) listBox.appendChild(el('div', { class: 'notice info', text: note }));
      if (!r.term) { listBox.appendChild(UI.emptyState('운영 기간이 없습니다.')); return; }
      var head = el('div', { class: 'card' }, [el('h2', { text: r.term.name }),
        el('div', { class: 'muted', text: r.term.start_date + ' ~ ' + r.term.end_date + (r.term.closed ? ' · 끝난 기간(조회만)' : '') })]);
      if (r.terms.length > 1 && state.tab === 'term') {
        var sel = el('select', { 'aria-label': '운영 기간' }, r.terms.map(function (t) { return el('option', { value: t.id, text: t.name }); }));
        sel.value = r.term.id;
        sel.addEventListener('change', function () { state.termId = sel.value; state.listStudent = ''; loadList(); });
        head.appendChild(UI.field('기간', sel));
      }
      listBox.appendChild(head);
      if (state.tab === 'term' && !state.listStudent) {
        var sum = el('div', { class: 'card' }, [el('h2', { text: '학생별' })]);
        if (!r.summary.length) sum.appendChild(UI.emptyState('이 기간에 기록된 OUT이 없습니다.'));
        else {
          var ul = el('ul', { class: 'list' });
          r.summary.forEach(function (x) {
            ul.appendChild(el('li', {}, [
              el('a', { href: '#', text: UI.util.studentLabel(x.student), onclick: function (e) { e.preventDefault(); state.listStudent = x.studentId; loadList(); } }),
              el('span', { class: 'muted' }, [x.student.grade + '-' + x.student.classNo + ' ' + x.student.number + '번 ', x.count >= 2 ? UI.statusPill('out2') : x.count === 1 ? UI.statusPill('out1') : UI.statusPill('mute', '취소만 있음')])
            ]));
          });
          sum.appendChild(ul);
        }
        listBox.appendChild(sum);
      }
      var title = state.tab === 'today' ? '오늘 기록' : state.listStudent ? '이 학생의 기록' : '전체 기록';
      var card = el('div', { class: 'card' }, [el('h2', { text: title })]);
      if (state.listStudent) card.appendChild(el('a', { href: '#', class: 'muted', text: '← 전체 보기', onclick: function (e) { e.preventDefault(); state.listStudent = ''; loadList(); } }));
      if (!r.items.length) card.appendChild(UI.emptyState(state.tab === 'today' ? '오늘 기록된 OUT이 없습니다.' : '기록이 없습니다.'));
      else {
        var list = el('ul', { class: 'list' });
        r.items.forEach(function (i) { list.appendChild(itemRow(i)); });
        card.appendChild(list);
      }
      listBox.appendChild(card);
    }
    function itemRow(i) {
      var gone = i.status === '취소';
      var li = el('li', { class: 'out-item' }, [
        el('div', { class: 'out-line' }, [
          el('b', { class: 'out-who' + (gone ? ' out-cancelled' : ''), text: UI.util.studentLabel(i.student) }),
          el('span', { class: 'muted', text: hm(i.occurredAt) }),
          gone ? UI.statusPill('canceled') : (i.level === '퇴실 대상' ? UI.statusPill('out2') : UI.statusPill('out1')),
          i.source === 'F1자동' ? UI.statusPill('mute', '자동') : null
        ]),
        el('div', { class: gone ? 'out-cancelled' : '', text: i.ruleName }),
        i.memo ? el('div', { class: 'muted', text: '메모: ' + i.memo }) : null,
        el('div', { class: 'muted', text: '적발 ' + i.detectedBy + ' · 입력 ' + i.enteredBy }),
        gone ? el('div', { class: 'muted', text: '취소 사유: ' + (i.cancelReason || '') }) : null
      ]);
      if (i.canCancel) li.appendChild(el('button', { type: 'button', class: 'btn secondary row-btn', text: '이 OUT 취소', 'aria-label': UI.util.studentLabel(i.student) + ' ' + hm(i.occurredAt) + ' OUT 취소', onclick: function () { openCancel(i); } }));
      return li;
    }
    function openCancel(i) {
      var sheet = null, busy = false;
      var reason = el('textarea', { maxlength: '200', 'aria-label': '취소 사유' });
      var err = el('div', { class: 'fix', role: 'alert' });
      var content = el('div', {}, [
        el('div', { text: UI.util.studentLabel(i.student) + ' · ' + hm(i.occurredAt) + ' · ' + i.ruleName }),
        el('div', { class: 'muted', style: 'margin:8px 0', text: '기록은 지워지지 않고 취소로 남으며, OUT 수에서만 빠집니다.' }),
        UI.field('취소 사유(2~200자)', reason), err
      ]);
      function refresh() { if (sheet) sheet.buttons[1].disabled = busy || reason.value.trim().length < 2; }
      reason.addEventListener('input', refresh);
      sheet = UI.bottomSheet({ title: 'OUT 취소', content: content, actions: [
        { text: '돌아가기', kind: 'secondary', onclick: function () { sheet.close(); } },
        { text: '취소하기', kind: 'primary', disabled: true, onclick: function () {
          if (busy) return; busy = true; refresh(); err.textContent = '';
          call('cancelOut', i.termId, i.id, reason.value.trim()).then(function (r) {
            busy = false;
            if (!r.ok) { refresh(); err.textContent = r.errors.map(function (e) { return e.message; }).join(' '); return; }
            sheet.close(); UI.toast('취소했습니다.');
            loadList('취소했습니다. 이 학생은 ' + (r.after.label ? '지금 ' + r.after.label + '입니다.' : '이제 OUT이 없습니다.'));
            window.scrollTo(0, 0);
          }).catch(function (e) { busy = false; refresh(); err.textContent = (e && e.message) || String(e); });
        } }] });
      sheet.open(); refresh();
    }

    load('');
  }
</script>
