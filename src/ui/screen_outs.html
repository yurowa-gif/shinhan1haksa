<style>
  .out-chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .out-chips .chip { flex: 0 1 auto; max-width: 100%; white-space: normal; text-align: left; height: auto; min-height: var(--tap); line-height: 1.3; }
  .out-time { max-width: 12rem; }
  ul.list li.out-item { display: block; }
  .out-item .out-line { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .out-item .out-cancelled { text-decoration: line-through; color: var(--muted-ink); }
  .out-item .row-btn { margin-top: 8px; min-height: var(--tap); }
  .out-who { word-break: keep-all; }
  .out-rowbtn { all: unset; display: flex; flex-direction: column; gap: 4px; width: 100%; cursor: pointer; min-height: var(--tap); box-sizing: border-box; }
  .out-rowbtn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  ul.out-sub { margin-top: 8px; padding-left: 12px; border-left: 3px solid var(--line); }
</style>
<script>
  /** OUT 화면: [기록](C11a: 학생 → 항목 → 일시·적발 교사 → 메모 → 저장) · [이번 학기](C11b: 학생별 요약·기록, 관리자 취소) · [오늘 현황]. 면담은 C13. */
  function renderScreen(root) {
    var state = { dateTouched: false, timeTouched: false, skewMs: 0, tab: '', termId: '', listStudent: '', list: null, ctx: null, student: null, ruleId: '', date: '', time: '', detectedBy: '', memo: '', busy: false, seq: 0, listSeq: 0, scope: 'mine', open: {} };
    var tabsBox = el('div');
    var body = el('div');
    var listBox = el('div');
    root.appendChild(tabsBox);
    root.appendChild(body);
    root.appendChild(listBox);
    var bar = null, saveBtn = null, noticeBox = null, statusBox = null, errSetters = {};

    function pad(n) { return (n < 10 ? '0' : '') + n; }
    /** 서버 시계 기준 지금(휴대폰 시계가 어긋나도 서버와 같게): 불러올 때 서버 now와 휴대폰 시계의 차이를 기억해 둔다 */
    function defaultTime() { var d = new Date(Date.now() + state.skewMs); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
    function serverYmd() { var d = new Date(Date.now() + state.skewMs); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
    /** 자정을 넘겼는데 날짜·시각을 건드리지 않았으면(기본값 그대로) 날짜를 오늘로 옮겨 다시 불러온다 — 어제 날짜에 새벽 시각이 저장되지 않게. 옮겼으면 true */
    function dayRolled() {
      if (!state.ctx || state.dateTouched || state.timeTouched || state.date !== state.ctx.today || serverYmd() === state.ctx.today) return false;
      state.date = serverYmd(); state.student = null; state.time = '';
      load(state.date, '날짜가 바뀌어 오늘 날짜로 옮겼습니다. 학생을 다시 골라 주세요.');
      window.scrollTo(0, 0);   // 고정 머리말 밑에 안내가 가리지 않게
      return true;
    }
    /** 시각을 사용자가 건드리지 않았고 날짜가 오늘이면 지금 시각으로(저장 직전·학생을 고를 때) */
    function refreshTime() {
      if (state.timeTouched || !state.ctx) return;
      // 고른 날짜가 서버의 오늘일 때만 지금 시각을 채운다(자정을 넘겨 날짜와 시각이 어긋난 채 저장되지 않게). 아니면 비워 직접 입력하게 한다
      state.time = serverYmd() === state.date ? defaultTime() : '';
      var t = body.querySelector('input.out-time'); if (t) t.value = state.time;
      refresh();
    }

    function load(date, note, noteWarn) {
      var my = ++state.seq;
      call('getOutContext', date || '').then(function (ctx) {
        if (my !== state.seq) return;   // 더 나중에 누른 날짜의 응답만 쓴다
        state.ctx = ctx;
        if (!state.tab) {   // 처음: 주소의 tab, 없으면 기록할 수 있는 사람은 [기록], 아니면 [이번 학기]
          var want = window.SCREEN_TAB;
          state.tab = want === 'term' || want === 'today' || want === 'dismiss' ? want : (want === 'record' && ctx.canRecord) || (!want && ctx.canRecord) ? 'record' : 'term';
          if (state.tab === 'record' && !ctx.canRecord) state.tab = 'term';
          if (window.SCREEN_STUDENT && state.tab !== 'record') { state.tab = 'term'; state.scope = 'all'; state.open[window.SCREEN_STUDENT] = true; }
          drawTabs(); setVisible();
          if (state.tab !== 'record') loadList();
        }
        if (!state.date) state.date = ctx.today;
        state.skewMs = Date.parse(ctx.today + 'T' + ctx.now + ':00') - Date.now();
        refreshTime();   // 기본 시각은 서버 시계(휴대폰 시계가 아님). 오늘이 아닌 날(어제 밤 일)은 사용자가 입력
        if (state.student && !ctx.students.some(function (s) { return s.id === state.student.id; })) state.student = null;   // 이 날짜에 기록할 수 없는 학생이면 비운다
        draw(note, noteWarn);
      }).catch(function (err) { if (my !== state.seq) return; clear(body); showError(body, err); });
    }

    /** 이름 뒤 조사 은/는 */
    function eunNeun(name) { var c = String(name).charCodeAt(String(name).length - 1); return c >= 0xac00 && c <= 0xd7a3 && (c - 0xac00) % 28 !== 0 ? '은' : '는'; }
    function updateNotice() { if (!noticeBox) return; clear(noticeBox); var w = levelNotice(); if (w) noticeBox.appendChild(w); }
    function levelNotice() {
      if (!state.student) return null;
      var n = state.ctx.levels[state.student.id] || 0;
      if (n === 1) return el('div', { class: 'notice warn', text: UI.util.studentLabel(state.student) + eunNeun(state.student.name) + ' ' + state.ctx.periodWord + ' 이미 1OUT입니다. 저장하면 2OUT — 퇴실 대상이 됩니다.' });
      if (n >= 2) return el('div', { class: 'notice warn', text: UI.util.studentLabel(state.student) + eunNeun(state.student.name) + ' ' + state.ctx.periodWord + ' 이미 퇴실 대상(' + n + 'OUT)입니다.' });
      return null;
    }

    function canSave() { return !state.busy && !!state.student && !!state.ruleId && !!state.date && !!state.time; }
    function refresh() { if (saveBtn) saveBtn.disabled = !canSave(); }

    function draw(note, noteWarn) {
      var c = state.ctx;
      if (state.tab !== 'record') return;
      clear(body);
      if (bar && bar.parentNode) bar.parentNode.removeChild(bar);
      bar = null; saveBtn = null; noticeBox = null; errSetters = {};
      statusBox = el('div');   // 오류·결과는 이 상자 하나에만(쌓이지 않게)
      body.appendChild(statusBox);
      if (note) statusBox.appendChild(el('div', { class: 'notice ' + (noteWarn ? 'warn' : 'info'), text: note }));
      if (!c.term) { body.appendChild(UI.emptyState('운영 기간이 없습니다. 관리자에게 운영 기간을 만들어 달라고 요청해 주세요.')); return; }
      if (!c.canRecord) {
        body.appendChild(el('div', { class: 'card' }, [el('h2', { text: 'OUT 기록' }), el('div', { class: 'muted', text: 'OUT은 담당교사·근무교사·관리자가 기록합니다. 이 계정은 보기만 할 수 있습니다.' })]));
        return;
      }
      if (c.dutyYesterday && c.date === c.today) body.appendChild(el('div', { class: 'notice info', text: '어제 근무하셨습니다. 어제 밤 적발한 OUT은 날짜를 [어제]로 바꾸면 학사생 전체에서 고를 수 있습니다.' }));
      var dateField = UI.dateField({ label: '날짜', value: state.date, name: 'date', max: c.today,
        shortcuts: [{ label: '오늘', value: c.today }, { label: '어제', value: addDaysYmd(c.today, -1) }],
        onchange: function (v) {
          if (!v) return;
          state.date = v; state.student = null; state.dateTouched = true;
          if (!state.timeTouched) state.time = '';   // 날짜를 바꾸면 기본 시각은 비운다(오늘로 돌아오면 서버 시각, 어제 밤 일은 직접 입력)
          load(v);   // 날짜가 바뀌면 고를 수 있는 학생이 달라져 다시 고른다
        } });
      errSetters.occurredAt = dateField.setError;
      if (!c.dateOk) {   // 역할은 되는데 이 날짜는 안 되는 경우: 날짜 칸은 남겨 다른 날로 갈 수 있게
        body.appendChild(el('div', { class: 'card' }, [el('h2', { text: '언제' }), dateField,
          el('div', { class: 'notice warn', style: 'margin-top:12px', text: '이 날짜는 기록할 수 없습니다(' + (c.dateReason || '운영 기간 밖·끝난 기간').replace(/\.$/, '') + '). ' + (state.date === addDaysYmd(c.today, -1) ? '다른 날짜를 골라 주세요.' : '날짜를 [어제]나 다른 날로 바꿔 주세요.') })]));
        return;
      }
      var studentCard = el('div', { class: 'card' }, [el('h2', { text: '학생' })]);
      errSetters.studentId = cardError(studentCard);
      studentCard.appendChild(UI.studentPicker({ students: c.students, label: '학생', placeholder: '이름·초성(ㅂㄷㅅ)·학번',
        onpick: function (s) { if (dayRolled()) return; state.student = s; refreshTime(); updateNotice(); refresh(); } }));   // 입력 중인 폼은 다시 그리지 않는다(고른 학생·글자가 사라지지 않게)
      if (!c.students.length) studentCard.appendChild(el('div', { class: 'muted', text: '이 날짜에 OUT을 기록할 수 있는 학생이 없습니다. 담당 학생이 없거나, 근무한 날(어제 밤까지)이 아닙니다.' }));
      body.appendChild(studentCard);
      noticeBox = el('div');
      body.appendChild(noticeBox);
      updateNotice();

      var chips = el('div', { class: 'out-chips', role: 'radiogroup', 'aria-label': '무엇을' });
      c.rules.forEach(function (r) {
        chips.appendChild(el('button', { type: 'button', class: 'chip' + (state.ruleId === r.id ? ' on' : ''), role: 'radio', 'aria-checked': state.ruleId === r.id ? 'true' : 'false', text: r.name,
          onclick: function (e) {
            state.ruleId = r.id;
            Array.prototype.forEach.call(chips.querySelectorAll('.chip'), function (b) { b.classList.remove('on'); b.setAttribute('aria-checked', 'false'); });
            e.currentTarget.classList.add('on'); e.currentTarget.setAttribute('aria-checked', 'true');
            refresh();
          } }));
      });
      var ruleCard = el('div', { class: 'card' }, [el('h2', { text: '무엇을' }), chips,
        el('div', { class: 'hint muted', style: 'margin-top:8px', text: '무단 지각·결석·이탈은 출결 담당이 미인정 특이사항으로 입력하면 자동으로 기록됩니다.' })]);
      errSetters.ruleId = cardError(ruleCard);
      body.appendChild(ruleCard);

      var time = el('input', { type: 'time', class: 'out-time', value: state.time });
      time.addEventListener('input', function () { state.time = time.value; state.timeTouched = true; refresh(); });
      var who = el('select');
      who.appendChild(el('option', { value: '', text: '(모름)' }));
      c.teachers.forEach(function (t) { who.appendChild(el('option', { value: t.id, text: t.name + (t.me ? '(나)' : '') })); });
      who.value = state.detectedBy || (c.teachers.filter(function (t) { return t.me; })[0] || {}).id || '';
      state.detectedBy = who.value;
      who.addEventListener('change', function () { state.detectedBy = who.value; });
      var memo = el('textarea', { maxlength: '200' });
      memo.value = state.memo;
      memo.addEventListener('input', function () { state.memo = memo.value; });
      var whoField = UI.field('적발 교사', who), memoField = UI.field('상황 메모(선택)', memo, { hint: '200자까지. 길게 쓰지 않습니다.' });
      var timeField = UI.field('시각', time, { hint: !state.time ? '시각을 입력해 주세요(어제 밤 일이라면 그 시각).' : '' });
      errSetters.occurredAt = timeField.setError;   // 날짜는 위 카드가 먼저 막으므로 이 단계의 날짜·시각 오류는 시각 칸 아래에
      errSetters.detectedBy = whoField.setError; errSetters.memo = memoField.setError;
      var whenCard = el('div', { class: 'card' }, [el('h2', { text: '언제·누가' }), dateField, timeField, whoField, memoField]);
      body.appendChild(whenCard);

      bar = UI.actionBar([
        { text: '저장', kind: 'primary', disabled: true, onclick: onSave },
        { text: '비우기', kind: 'secondary', onclick: function () { resetForm(); load(state.date); } }
      ], { mount: true });
      saveBtn = bar.querySelectorAll('button')[0];
      refresh();
    }

    function addDaysYmd(ymd, n) {
      var d = new Date(Date.UTC(+ymd.slice(0, 4), +ymd.slice(5, 7) - 1, +ymd.slice(8, 10) + n));
      return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
    }
    /** 비우기·저장 뒤: 손으로 고른 과거 날짜(어젯밤 일)는 그대로 두고, 오늘 날짜를 보고 있었다면 서버의 오늘로(자정을 넘겼어도 맞게) */
    function resetForm() { var wasToday = state.ctx && state.date === state.ctx.today; reset(); if (wasToday) state.date = serverYmd(); }
    function reset() { state.student = null; state.ruleId = ''; state.memo = ''; state.time = ''; state.timeTouched = false; state.dateTouched = false; }
    /** 카드 안 오류 칸(빨간 글씨·테두리): 학생·항목 오류용 */
    function cardError(card) {
      var box = null, fix = null;   // 오류가 있을 때만 칸을 만든다(빈 칸이 카드 아래 여백을 차지하지 않게)
      return function (msg) {
        if (!msg) { if (box) { box.parentNode.removeChild(box); box = fix = null; } return; }
        if (!box) { fix = el('div', { class: 'fix' }); box = el('div', { class: 'field invalid' }, [fix]); card.appendChild(box); }
        fix.textContent = msg;
      };
    }

    function inputValue() {
      refreshTime();
      return { studentId: state.student.id, occurredAt: state.date + 'T' + state.time, ruleId: state.ruleId, detectedBy: state.detectedBy, memo: state.memo.trim() };
    }

    /** 오류는 해당 칸 아래에 빨갛게(없는 칸이면 맨 위 상자), 이전 오류는 지우고 화면에서 가장 위 오류로 스크롤 */
    function showErrors(errors) {
      Object.keys(errSetters).forEach(function (k) { errSetters[k](''); });
      if (statusBox) clear(statusBox);
      errors.forEach(function (e) {
        if (errSetters[e.field]) { errSetters[e.field](e.message); return; }
        statusBox.appendChild(el('div', { class: 'error', role: 'alert', text: e.message }));
      });
      var top = null;
      Array.prototype.forEach.call(body.querySelectorAll('.field.invalid, .error'), function (n) { if (!top || n.getBoundingClientRect().top < top.getBoundingClientRect().top) top = n; });
      if (top) top.scrollIntoView({ block: 'center' });
    }
    function showFailure(message) { showErrors([{ field: '', message: message }]); }

    function onSave() { if (canSave()) doSave(false); }
    function doSave(ack) {
      if (dayRolled()) return;   // [그래도 저장] 확인 뒤에 자정을 넘긴 경우에도
      showErrors([]);
      if (!state.time) { showErrors([{ field: 'occurredAt', message: '시각을 입력해 주세요.' }]); return; }   // 시각이 비면 서버를 부르지 않는다(빈 시각으로 권한 판정이 거짓 거부 기록을 남기지 않게)
      state.busy = true; refresh();
      var v = inputValue(); if (ack) v.acknowledge = true;
      call('saveOut', v).then(function (r) {
        state.busy = false;
        if (r.needsConfirm) {
          refresh();
          return UI.confirmSheet({ title: '이미 비슷한 OUT이 있습니다', lead: r.warnings.join(' '),
            lines: ['그래도 저장하면 OUT이 한 건 더 늘어납니다' + (r.before && r.before.count >= 2 ? '(이미 퇴실 대상입니다)' : r.after && r.after.level >= 2 ? '(저장하면 퇴실 대상)' : '')], confirmText: '그래도 저장', cancelText: '돌아가기', danger: true,
            onconfirm: function () { doSave(true); } });
        }
        if (!r.ok) {
          refresh();
          showErrors(r.errors);
          return;
        }
        var msg = '저장했습니다. ' + state.ctx.periodWord + ' ' + r.after.label + '입니다.';
        var warn = r.notifyWarn ? ' 알림 메일이 가지 않았습니다. 필요하면 담당 선생님께 직접 알려 주세요.' : '';
        UI.toast(msg + warn, r.notifyWarn ? { kind: 'warn', ms: 8000 } : undefined);
        resetForm();
        if (state.tab === 'record') load(state.date, msg + warn, !!r.notifyWarn); else loadList(msg + warn, !!r.notifyWarn);
        window.scrollTo(0, 0);
      }).catch(function (err) {
        state.busy = false; refresh();
        showFailure((err && err.message) || String(err));
      });
    }

    /* ───────── 탭 ───────── */
    function drawTabs() {
      clear(tabsBox);
      var opts = [];
      if (state.ctx && state.ctx.canRecord) opts.push({ value: 'record', label: '기록' });
      opts.push({ value: 'term', label: state.ctx && state.ctx.periodWord === '이번 기간' ? '기간' : '학기' }, { value: 'today', label: '오늘' }, { value: 'dismiss', label: '2OUT' });
      tabsBox.appendChild(UI.segmented({ label: '화면', value: state.tab, options: opts, onchange: function (v) { state.tab = v; state.afterConfirm = null; showTab(); } }));
    }
    function setVisible() {
      var rec = state.tab === 'record';
      body.style.display = rec ? '' : 'none';
      listBox.style.display = rec ? 'none' : '';
    }
    function showTab() {
      var rec = state.tab === 'record';
      setVisible();
      if (!rec) { if (bar && bar.parentNode) bar.parentNode.removeChild(bar); bar = null; saveBtn = null; loadList(); }
      else if (state.ctx) { load(state.date); }   // 다시 열면 서버 값으로 새로 그린다
    }

    /* ───────── 목록(C11b): [학기] 학생별 현황(펼치면 기록), [오늘] 그날 기록 ───────── */
    function dayKo(ymd) { return (+ymd.slice(5, 7)) + '월 ' + (+ymd.slice(8, 10)) + '일(' + '일월화수목금토'.charAt(new Date(+ymd.slice(0, 4), +ymd.slice(5, 7) - 1, +ymd.slice(8, 10)).getDay()) + ')'; }
    function hm(at) { return dayKo(at) + ' ' + at.slice(11, 16); }
    function loadList(note, noteWarn) {
      var my = ++state.listSeq;   // 기록 탭의 load()와 따로 센다(저장 직후 탭을 바꿔도 목록 응답이 버려지지 않게)
      var filter = state.tab === 'dismiss' ? { scope: 'targets' } :   // 2OUT 탭은 늘 현재 기간(학기 탭에서 고른 지난 기간에 묶이지 않는다)
         state.tab === 'today' ? { scope: 'today' } : { scope: 'term', termId: state.termId };   // 오늘 탭은 고른 기간과 상관없다
      call('listOuts', filter).then(function (r) {
        if (my !== state.listSeq || state.tab === 'record') return;
        state.list = r; drawList(note, noteWarn);
      }).catch(function (err) { if (my !== state.listSeq) return; clear(listBox); showError(listBox, err); });
    }
    function toggleRow(id) { state.open[id] = !state.open[id]; drawList(); }
    function drawList(note, noteWarn) {
      var r = state.list;
      clear(listBox);
      if (note) listBox.appendChild(el('div', { class: 'notice ' + (noteWarn ? 'warn' : 'info'), text: note }));
      if (!r.term) { listBox.appendChild(UI.emptyState('운영 기간이 없습니다.')); return; }
      var head = el('div', { class: 'card' }, [el('h2', { text: r.term.name }),
        el('div', { class: 'muted', text: dayKo(r.term.start_date) + ' ~ ' + dayKo(r.term.end_date) + (r.term.closed ? ' · 끝난 기간(조회만)' : '') })]);
      if (r.terms.length > 1 && state.tab === 'term') {
        var sel = el('select', { 'aria-label': '운영 기간' }, r.terms.map(function (t) { return el('option', { value: t.id, text: t.name }); }));
        sel.value = r.term.id;
        sel.addEventListener('change', function () { state.termId = sel.value; loadList(); });
        head.appendChild(UI.field('기간', sel));
      }
      listBox.appendChild(head);
      if (state.tab === 'today') { drawToday(r); return; }
      if (state.tab === 'dismiss') { drawTargets(r); return; }
      // [학기]: 숫자 3개 → (내 담당 | 전체) → 학생 줄(펼치면 기록)
      listBox.appendChild(el('div', { class: 'stats', style: 'margin-bottom:12px;grid-template-columns:repeat(3,1fr)' }, [statBox(r.stats.records, 'OUT 기록'), statBox(r.stats.out1Students, '1OUT 학생'), statBox(r.stats.out2Students, '퇴실 대상')]));
      var hasMine = !!r.hasMine;   // 내 담당 학생이 있으면(OUT이 0건이어도) 내 담당/전체를 보인다
      if (hasMine) {
        listBox.appendChild(UI.segmented({ label: '보기', value: state.scope, options: [{ value: 'mine', label: '내 담당' }, { value: 'all', label: '전체' }],
          onchange: function (v) { state.scope = v; drawList(); } }));
      }
      var rows = r.summary.filter(function (x) { return !hasMine || state.scope === 'all' || x.isMine; });
      var card = el('div', { class: 'card' });
      if (!rows.length) card.appendChild(UI.emptyState(hasMine && state.scope === 'mine' ? '내 담당 학생 중 OUT이 기록된 학생이 없습니다.' : '이 기간에 기록된 OUT이 없습니다.'));
      else {
        var ul = el('ul', { class: 'list' });
        rows.forEach(function (x) { ul.appendChild(studentRow(x, r)); });
        card.appendChild(ul);
      }
      listBox.appendChild(card);
    }
    /* ───────── 2OUT 퇴실 대상(C13, F4-3): 면담 필요 → 면담 기록됨(관리자는 퇴실 확정 가능) → 퇴실 처리됨 ───────── */
    function targetCard(x, r) {
      var st = x.state;
      var who = UI.util.studentLabel(x.student) + (x.isMine ? ' (내 담당)' : '');
      var pill = x.left ? UI.statusPill('mute', '퇴실 처리됨') : st === 'need' ? UI.statusPill('todo', '면담 필요') : st === 'recorded' ? (x.canConfirm ? UI.statusPill('confirmed', '퇴실 확정 가능') : UI.statusPill('confirmed', '면담 기록됨')) : st === 'left' ? UI.statusPill('mute', '퇴실 처리됨') : UI.statusPill('out2');
      var outs = r.items.filter(function (i) { return i.studentId === x.studentId; }).slice().reverse().map(function (i) { return dayKo(i.occurredAt) + ' ' + i.ruleName; }).join(' / ');
      var card = el('div', { class: 'card' }, [
        el('div', { style: 'display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:4px;flex-wrap:wrap' }, [el('h2', { style: 'margin:0', text: who }), pill]),
        el('div', { class: 'muted', text: '2OUT · ' + (outs || 'OUT ' + x.count + '건') })
      ]);
      var msg = '';
      if (!st) msg = '면담 기록은 담당교사·담임·관리자만 봅니다.';
      else if (x.staleMeeting) msg = '이전 면담은 연결된 OUT이 취소되어 인정되지 않습니다. ' + (x.canMeeting ? '면담을 새로 기록해 주세요.' : '담당교사가 면담을 새로 기록해야 합니다.');
      else if (st === 'need') msg = x.canMeeting ? '학부모 면담을 하고 기록해 주세요. 기록이 있어야 관리자가 퇴실을 확정할 수 있습니다.' : '담당교사가 학부모 면담을 기록하면 관리자가 퇴실을 확정합니다.';
      else if (st === 'recorded') msg = '면담 ' + dayKo(x.meeting.date) + ' · ' + x.meeting.teacher + (x.canConfirm ? '' : ' — 관리자가 퇴실을 확정합니다.');
      if (msg) card.appendChild(el('div', { style: 'margin:8px 0', text: msg }));
      if (x.prevExit) card.appendChild(el('div', { class: 'muted', text: '이전 퇴실 처리됨(' + dayKo(x.prevExit) + ')' }));
      if (x.canMeeting) card.appendChild(el('button', { type: 'button', class: 'btn block', text: '면담 기록하기', onclick: function () { openMeeting(x); } }));
      if (x.canConfirm) card.appendChild(el('button', { type: 'button', class: 'btn block', text: '퇴실 확정', onclick: function () { confirmDismissal(x); } }));
      else if (st === 'need' && r.isAdmin) card.appendChild(el('button', { type: 'button', class: 'btn block', 'aria-disabled': 'true', text: '퇴실 확정 — 면담 기록 필요', onclick: function (e) { e.preventDefault(); } }));
      if (x.meeting && x.meeting.noteId && st === 'recorded') card.appendChild(el('button', { type: 'button', class: 'btn secondary block', style: 'margin-top:8px', text: '면담 취소', onclick: function () { openMeetingCancel(x); } }));
      return card;
    }
    function drawTargets(r) {
      if (state.afterConfirm) {
        var ac = state.afterConfirm;
        listBox.appendChild(el('div', { class: 'card' }, [el('h2', { text: ac.who + ' 퇴실 확정 관문을 통과했습니다' }),
          el('div', { class: 'muted', style: 'margin:4px 0 12px', text: '다음에 할 일: 입퇴실 화면에서 학사 퇴실 신청서를 마무리해 주세요(사유 \'2OUT 퇴실\', 적용일은 내일이 기본).' }),
          el('a', { class: 'btn', target: '_top', href: ac.href, text: '입퇴실 신청서 열기' })]));
      }
      var hasMine = r.summary.some(function (x) { return x.isMine; });
      if (hasMine) listBox.appendChild(UI.segmented({ label: '보기', value: state.scope, options: [{ value: 'mine', label: '내 담당' }, { value: 'all', label: '전체' }], onchange: function (v) { state.scope = v; drawList(); } }));
      var rows = r.summary.filter(function (x) { return !hasMine || state.scope === 'all' || x.isMine; });
      var active = rows.filter(function (x) { return !x.left; }), left = rows.filter(function (x) { return x.left; });
      if (!active.length) listBox.appendChild(el('div', { class: 'card' }, [UI.emptyState('지금 퇴실 대상인 학생이 없습니다.')]));
      active.forEach(function (x) { listBox.appendChild(targetCard(x, r)); });
      if (left.length) {
        var d = el('details', { class: 'card' }, [el('summary', { text: '퇴실 처리됨 (' + left.length + ')' })]);
        left.forEach(function (x) { d.appendChild(el('div', { style: 'padding:8px 0', text: UI.util.studentLabel(x.student) })); });
        listBox.appendChild(d);
      }
      listBox.appendChild(el('div', { class: 'muted', text: '2OUT이 되면 담당교사가 학부모 면담을 기록하고, 그 뒤 관리자가 퇴실을 확정합니다(유예 없음).' }));
    }
    function openMeeting(x) {
      var sheet = null, busy = false;
      var dateIn = UI.dateField({ label: '면담 날짜', value: state.ctx ? state.ctx.today : '', max: state.ctx ? state.ctx.today : undefined, name: 'mdate',
        shortcuts: state.ctx ? [{ label: '오늘', value: state.ctx.today }] : [] });
      var minYmd = x.trigger ? x.trigger.occurredAt.slice(0, 10) : '';
      if (x.prevExit) { var pe = addDaysYmd(x.prevExit, 1); if (pe > minYmd) minYmd = pe; }   // 둘째 OUT 날과 이전 퇴실 다음 날 중 늦은 날
      var content = el('textarea', { maxlength: '2000', rows: '5', 'aria-label': '면담 내용' });
      var fc = UI.field('면담 내용', content, { hint: '면담 내용은 담당교사와 관리자만 볼 수 있습니다. 입퇴실 기록에는 면담 날짜도 쓰이지 않습니다.' });
      var trig = x.trigger ? dayKo(x.trigger.occurredAt) + ' ' + x.trigger.ruleName : '';
      if (minYmd) { var mn = dateIn.querySelector('input[type=date]'); if (mn) mn.min = minYmd; }
      var body = el('div', {}, [el('div', { text: UI.util.studentLabel(x.student) + ' 학부모 면담' }), trig ? el('div', { class: 'muted', style: 'margin:4px 0 8px', text: '연결 OUT(2번째): ' + trig }) : null, dateIn, fc]);
      function refresh() { if (sheet) sheet.buttons[1].disabled = busy || !content.value.trim() || !dateIn.getValue() || (minYmd && dateIn.getValue() < minYmd); }
      content.addEventListener('input', refresh);
      dateIn.querySelector('input[type=date]').addEventListener('change', function () { if (minYmd && dateIn.getValue() < minYmd) dateIn.setError('면담 날짜는 ' + dayKo(minYmd) + ' 이후여야 합니다.'); else dateIn.setError(''); refresh(); });
      sheet = UI.bottomSheet({ title: '학부모 면담 기록', content: body, actions: [
        { text: '닫기', kind: 'secondary', onclick: function () { sheet.close(); } },
        { text: '면담 기록 저장', kind: 'primary', disabled: true, onclick: function () {
          if (busy) return; busy = true; refresh(); dateIn.setError(''); fc.setError('');
          call('saveOutMeeting', { studentId: x.studentId, date: dateIn.getValue(), content: content.value.trim() }).then(function (r) {
            busy = false;
            if (!r.ok) { refresh(); r.errors.forEach(function (e) { (e.field === 'date' ? dateIn : fc).setError(e.message); }); return; }
            sheet.close(); UI.toast('면담을 기록했습니다.'); loadList('면담을 기록했습니다. 관리자가 퇴실을 확정할 수 있습니다.'); window.scrollTo(0, 0);
          }).catch(function (e) { busy = false; refresh(); fc.setError((e && e.message) || String(e)); });
        } }] });
      sheet.open(); refresh();
    }
    function openMeetingCancel(x) {
      var sheet = null, busy = false;
      var reason = el('textarea', { maxlength: '200', 'aria-label': '취소 사유' });
      var rf = UI.field('취소 사유(2~200자)', reason);
      var body = el('div', {}, [el('div', { text: UI.util.studentLabel(x.student) + ' 면담을 취소합니다.' }), el('div', { class: 'muted', style: 'margin:8px 0', text: '기록은 지워지지 않고 취소로 남습니다. 취소하면 퇴실 확정이 다시 막힙니다. 상담 내용은 적지 마세요(사유는 변경 기록에 남습니다).' }), rf]);
      function refresh() { if (sheet) sheet.buttons[1].disabled = busy || reason.value.trim().length < 2; }
      reason.addEventListener('input', refresh);
      sheet = UI.bottomSheet({ title: '면담 취소', content: body, actions: [
        { text: '돌아가기', kind: 'secondary', onclick: function () { sheet.close(); } },
        { text: '취소하기', kind: 'danger', disabled: true, onclick: function () {
          if (busy) return; busy = true; refresh(); rf.setError('');
          call('cancelOutMeeting', x.meeting.noteId, reason.value.trim()).then(function (r) {
            busy = false;
            if (!r.ok) { refresh(); rf.setError(r.errors.map(function (e) { return e.message; }).join(' ')); return; }
            sheet.close(); UI.toast('면담을 취소했습니다.'); loadList('면담을 취소했습니다.'); window.scrollTo(0, 0);
          }).catch(function (e) { busy = false; refresh(); rf.setError((e && e.message) || String(e)); });
        } }] });
      sheet.open(); refresh();
    }
    function confirmDismissal(x) {
      var tomorrow = dayKo(addDaysYmd(state.ctx ? state.ctx.today : (state.list && state.list.date) || '', 1));
      UI.confirmSheet({ title: '퇴실을 확정합니다', lead: UI.util.studentLabel(x.student) + ' · 2OUT 퇴실',
        lines: ['면담이 기록되어 있습니다(' + dayKo(x.meeting.date) + ' · ' + x.meeting.teacher + ')', '확정하면 입퇴실 신청서가 미리 채워집니다', '적용일은 확정 다음 날, ' + tomorrow + '이고 다음 화면에서 고칠 수 있습니다', '유예는 없습니다'],
        confirmText: '퇴실 확정', danger: true,
        onconfirm: function () {
          call('confirmOutDismissal', x.studentId).then(function (r) {
            if (!r.ok) { if (state.tab === 'dismiss') loadList(r.reason + ' — 상태가 바뀌었습니다. 새로 고쳤습니다.', true); return; }
            // 이동은 사용자가 직접 누르는 링크로(콜백 안에서 top을 옮기면 막힐 수 있다)
            var back = document.querySelector('a.back'), base = back ? back.href : '';
            state.afterConfirm = { who: UI.util.studentLabel(x.student), href: base + '?page=moves&student=' + encodeURIComponent(x.studentId) + '&prefill=out2' };
            if (state.tab === 'dismiss') drawList();
            window.scrollTo(0, 0);
          }).catch(function (e) { UI.toast((e && e.message) || String(e), { kind: 'warn', ms: 5000 }); });
        } });
    }

    function studentRow(x, r) {
      var open = !!state.open[x.studentId];
      var pill = x.left ? UI.statusPill('mute', '퇴실 처리됨') : x.count >= 2 ? UI.statusPill('out2') : UI.statusPill('out1');
      var li = el('li', { class: 'out-item' }, [
        el('button', { type: 'button', class: 'out-rowbtn', 'aria-expanded': open ? 'true' : 'false', onclick: function () { toggleRow(x.studentId); } }, [
          el('span', { class: 'out-line' }, [el('b', { class: 'out-who', text: UI.util.studentLabel(x.student) }), pill]),
          x.latest ? el('span', { class: 'muted', text: '가장 최근: ' + dayKo(x.latest.occurredAt) + ' ' + x.latest.ruleName + (x.latest.source === 'F1자동' ? '(자동)' : '') }) : null
        ])
      ]);
      if (open) {
        var mine = r.items.filter(function (i) { return i.studentId === x.studentId; });
        li.appendChild(el('ul', { class: 'list out-sub' }, mine.map(function (i) { return itemRow(i); })));
      }
      return li;
    }
    function drawToday(r) {
      var live = r.items.filter(function (i) { return i.status === '유효'; }).length;
      var card = el('div', { class: 'card' }, [el('h2', { style: 'word-break:keep-all', text: dayKo(r.date || state.ctx && state.ctx.today || r.term.start_date) + ' ' + live + '건' + (live !== r.items.length ? ' · 취소 ' + (r.items.length - live) + '건' : '') })]);
      if (!r.items.length) {
        card.appendChild(UI.emptyState('오늘 기록된 OUT이 없습니다.', state.ctx && state.ctx.canRecord ? { text: 'OUT 기록하기', onclick: function () { state.tab = 'record'; drawTabs(); showTab(); } } : null));
      } else {
        var ul = el('ul', { class: 'list' });
        r.items.forEach(function (i) { ul.appendChild(itemRow(i, true)); });
        card.appendChild(ul);
      }
      listBox.appendChild(card);
    }
    /** 기록 한 줄. withStudent: 오늘 탭처럼 학생 이름을 앞에 */
    function itemRow(i, withStudent) {
      var gone = i.status === '취소';
      var li = el('li', { class: 'out-item' }, [
        el('div', { class: 'out-line' }, [
          el('b', { class: 'out-who' + (gone ? ' out-cancelled' : ''), text: withStudent ? i.occurredAt.slice(11, 16) + ' · ' + UI.util.studentLabel(i.student) : hm(i.occurredAt) }),
          gone ? UI.statusPill('canceled') : null,
          UI.statusPill('mute', i.source === 'F1자동' ? '자동' : '직접')
        ]),
        el('div', { class: gone ? 'out-cancelled' : '', text: i.ruleName }),
        i.memo ? el('div', { class: 'muted', text: '메모: ' + i.memo }) : null,
        el('div', { class: 'muted', text: '적발 ' + i.detectedBy + ' · 입력 ' + i.enteredBy }),
        gone ? el('div', { class: 'muted', text: '취소 사유: ' + (i.cancelReason || '') }) : null
      ]);
      if (i.canCancel) li.appendChild(el('button', { type: 'button', class: 'btn secondary row-btn', text: '취소 처리', 'aria-label': UI.util.studentLabel(i.student) + ' ' + hm(i.occurredAt) + ' OUT 취소', onclick: function () { openCancel(i); } }));
      return li;
    }
    function openCancel(i) {
      var sheet = null, busy = false;
      var reason = el('textarea', { maxlength: '200', 'aria-label': '취소 사유' });
      var rf = UI.field('취소 사유(2~200자)', reason, { hint: '0/200' });
      var hint = rf.querySelector('.hint');
      var auto = i.source === 'F1자동';
      var content = el('div', {}, [
        el('div', { text: UI.util.studentLabel(i.student) + ' · ' + hm(i.occurredAt) + ' · ' + i.ruleName }),
        el('div', { class: 'muted', style: 'margin:8px 0', text: '기록은 지워지지 않고 취소로 남으며, OUT 수에서만 빠집니다.' }),
        auto ? el('div', { class: 'notice warn', text: '자동 OUT은 그 특이사항을 취소하면 함께 취소됩니다. 여기서 취소하면 특이사항을 다시 확정해도 OUT이 다시 생기지 않습니다.' }) : null,
        rf
      ]);
      function refresh() { if (hint) hint.textContent = reason.value.length + '/200'; if (sheet) sheet.buttons[1].disabled = busy || reason.value.trim().length < 2; }
      reason.addEventListener('input', refresh);
      sheet = UI.bottomSheet({ title: 'OUT 취소 처리', content: content, actions: [
        { text: '돌아가기', kind: 'secondary', onclick: function () { sheet.close(); } },
        { text: '취소 처리', kind: 'danger', disabled: true, onclick: function () {
          if (busy) return; busy = true; refresh(); rf.setError('');
          call('cancelOut', i.termId, i.id, reason.value.trim()).then(function (r) {
            busy = false;
            if (!r.ok) { refresh(); rf.setError(r.errors.map(function (e) { return e.message; }).join(' ')); return; }
            sheet.close(); UI.toast('취소했습니다.');
            loadList('취소했습니다. 이 학생은 ' + (r.after.label ? '지금 ' + r.after.label + '입니다.' : '이제 OUT이 없습니다.'));
            window.scrollTo(0, 0);
          }).catch(function (e) { busy = false; refresh(); rf.setError((e && e.message) || String(e)); });
        } }] });
      sheet.open(); refresh();
    }

    load('');
  }
</script>
