<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <?!= include('ui/Styles') ?>
</head>
<body data-role="<?= role ?>"<? if (role === 'student' || role === 'parent') { ?> class="tone-soft"<? } ?>>
  <header class="top">
    <h1>신한1학사 · <span style="white-space:nowrap"><?= roleLabel ?></span></h1>
    <div class="who"><?= userName ?></div>
  </header>
  <main class="home">
    <? if (roleTabs.length > 1) { ?>
      <nav class="tabs" aria-label="역할 전환">
        <? for (var i = 0; i < roleTabs.length; i++) { ?>
          <a class="tab <?= roleTabs[i].code === role ? 'on' : '' ?>"
             href="<?= appUrl ?>?role=<?= roleTabs[i].code ?>"><?= roleTabs[i].label ?></a>
        <? } ?>
      </nav>
    <? } ?>
    <div id="home"><div class="loading">불러오는 중…</div></div>
  </main>
  <footer>
    <a href="<?= appUrl ?>">처음으로</a>
    <? if (diagEnabled) { ?> · <a href="<?= appUrl ?>?page=diag">접속 진단</a><? } ?>
  </footer>

  <?!= include('ui/Client') ?>
  <?!= include('ui/Components') ?>
  <? if (role === 'student' || role === 'parent') { ?><?!= include('ui/Portal') ?><? } ?>
  <?!= include(homeFileFor_(role)) ?>
  <script>
    (function () {
      var root = document.getElementById('home');
      var role = document.body.getAttribute('data-role');
      var teacherHome = role !== 'student' && role !== 'parent';
      // 확인함(getInbox)의 종류별 건수를 관리자·출결 담당 홈 '오늘 처리할 것'과 배지가 같이 쓴다 — 숫자 출처를 하나로(실패해도 홈은 그대로 그린다)
      var wantInbox = role === 'admin' || role === 'attendance';
      function load() {
        Promise.all([call('getHomeData', role), wantInbox ? call('getInbox').catch(function () { return null; }) : null])
          .then(function (both) {
            var data = both[0];
            if (wantInbox && both[1] && both[1].counts) data.inbox = both[1].counts;
            clear(root); renderHome(data, root); if (teacherHome) UI.layoutHome(root);
            if (teacherHome) root.insertBefore(UI.refreshStamp(load), root.firstChild);   // 학생·학부모 홈은 Portal이 같은 줄을 넣는다
          })
          .catch(function (err) { clear(root); showError(root, err); });
      }
      load();
    })();
  </script>
</body>
</html>
