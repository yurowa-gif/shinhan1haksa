<script>
  /** 학생 홈(F14, C36): 본인 OUT·출결 특이사항·자리·방·급식·월별 일정(읽기만). 본문은 ui/Portal의 renderPortal */
  function renderHome(d, root) {
    if (!d.me) {
      root.appendChild(el('div', { class: 'error', text: '학생 명단에서 내 계정을 찾지 못했습니다. 담당 선생님께 알려 주세요.' }));
      root.appendChild(accountHelp(d.accountEmail));
      return;
    }
    window.PORTAL_APP_URL = d.appUrl;
    var body = el('div');
    root.appendChild(body);
    Nav.bind(function (k) { renderPortal(body, d.me.id, '', k || 'home'); });   // 뒤로 가기(C39)
    renderPortal(body, d.me.id);
    // 진로 프로필 카드(C50, F15): 안 냈으면 '할 일' 자리(포털 카드들 위), 냈으면 아래에 보기·고쳐서 다시 내기
    if (d.career) {
      var cr = d.career, url = d.appUrl + '?page=career&role=student', todo = !cr.submitted && cr.active;
      var crCard = el('div', { class: UI.cardClass(todo ? 'todo' : '') }, [
        el('h2', { text: cr.submitted ? '내 진로 프로필' : '진로 프로필을 내 주세요' }),
        el('div', { class: 'muted', style: 'word-break:keep-all', text: cr.submitted ? cr.version + '번째 기록 · ' + UI.util.formatDateKo(cr.at) + '에 냄' : (cr.dueKo ? (cr.duePassed ? '마감(' + cr.dueKo + ')이 지났습니다. 지금 내도 됩니다.' : '이번 학기 제출 마감: ' + cr.dueKo) : '희망 진로와 목표 진학을 적어 냅니다.') }),
        UI.rowLink({ href: url, text: cr.submitted ? '내 진로 프로필 보기' : '진로 프로필 쓰기' })
      ]);
      if (todo) root.insertBefore(crCard, body); else root.appendChild(crCard);
    }
    // 상담 신청 카드(C49-A, F17): 신청·내 신청은 ?page=counselreq
    var cqLine = el('div', { style: 'margin:8px 0;word-break:keep-all' });   // 신청 상태 한 줄(신청 화면을 다시 열지 않아도 알 수 있게). 서버가 보는 사람에 맞게 준 칸만 쓴다
    var cqCard = el('div', { class: 'card' }, [
      el('h2', { text: '상담' }),
      cqLine,
      el('div', { class: 'muted', style: 'word-break:keep-all', text: '담당 선생님과 이야기하고 싶으면 날짜와 주제를 알려 주세요.' }),
      UI.rowLink({ href: d.appUrl + '?page=counselreq&tab=form', text: '상담 신청하기' }),
      UI.rowLink({ href: d.appUrl + '?page=counselreq', text: '내 상담 신청 보기' })
    ]);
    root.appendChild(cqCard);
    call('getCounselRequestsOfStudent', '').then(function (r) {
      var cur = (r.requests || [])[0];   // 가장 최근 신청(새 신청이 위)
      if (!cur) return;
      var day = function (ymd) { return UI.util.formatDateKo(ymd, false); };
      if (cur.status === '신청') cqLine.appendChild(el('span', {}, [UI.statusPill('requested', '신청 중'), ' ' + cur.topic + ' 상담 — 선생님이 날짜를 정하면 알려 드립니다.']));
      else if (cur.status === '확정') { cqLine.appendChild(el('b', { text: day(cur.decided_date) + '에 상담합니다.' })); cqCard.className = UI.cardClass('key'); }
      else if (cur.status === '반려') cqLine.appendChild(el('span', {}, [UI.statusPill('canceled', '반려'), ' ' + cur.topic + ' 상담 신청이 반려되었습니다. 사유는 내 상담 신청에서 볼 수 있습니다.']));
    }).catch(function () { /* 상태 줄만 빠진다 — 카드와 링크는 그대로 */ });
    // 시설 일지 카드(C35, F10): 포털 본문 아래에 한 카드. 쓰기·내 기록은 ?page=facility
    root.appendChild(el('div', { class: 'card' }, [
      el('h2', { text: '시설 일지' }),
      el('div', { class: 'muted', style: 'word-break:keep-all', text: '특강실·원형테이블 같은 시설을 쓰면 근무 선생님께 말씀드린 뒤 여기에 적습니다.' }),
      UI.rowLink({ href: d.appUrl + '?page=facility', text: '시설 일지 쓰기' }),
      UI.rowLink({ href: d.appUrl + '?page=facility&tab=mine', text: '내가 쓴 일지 보기' })
    ]));
  }
</script>
