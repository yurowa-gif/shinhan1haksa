<script>
  /** 학생 홈(F14, C36): 본인 OUT·출결 특이사항·자리·방·급식·월별 일정(읽기만). 본문은 ui/Portal의 renderPortal */
  function renderHome(d, root) {
    if (!d.me) {
      root.appendChild(el('div', { class: 'error', text: '학생 명단에서 내 계정을 찾지 못했습니다. 담당 선생님께 알려 주세요.' }));
      root.appendChild(accountHelp(d.accountEmail));
      return;
    }
    window.PORTAL_APP_URL = d.appUrl;
    var body = el('div');
    root.appendChild(body);
    Nav.bind(function (k) { renderPortal(body, d.me.id, '', k || 'home'); });   // 뒤로 가기(C39)
    renderPortal(body, d.me.id);
    // 진로 프로필 카드(C50, F15): 안 냈으면 할 일 칸, 냈으면 보기·고쳐서 다시 내기
    if (d.career) {
      var cr = d.career, url = d.appUrl + '?page=career&role=student';
      root.appendChild(el('div', { class: UI.cardClass(cr.submitted || !cr.active ? '' : 'todo') }, [
        el('h2', { text: cr.submitted ? '내 진로 프로필' : '진로 프로필을 내 주세요' }),
        el('div', { class: 'muted', style: 'word-break:keep-all', text: cr.submitted ? cr.version + '번째 기록 · ' + UI.util.formatDateKo(cr.at) + '에 냄' : (cr.dueKo ? (cr.duePassed ? '마감(' + cr.dueKo + ')이 지났습니다. 지금 내도 됩니다.' : '이번 학기 제출 마감: ' + cr.dueKo) : '희망 진로와 목표 진학을 적어 냅니다.') }),
        UI.rowLink({ href: url, text: cr.submitted ? '내 진로 프로필 보기' : '진로 프로필 쓰기' })
      ]));
    }
    // 시설 일지 카드(C35, F10): 포털 본문 아래에 한 카드. 쓰기·내 기록은 ?page=facility
    root.appendChild(el('div', { class: 'card' }, [
      el('h2', { text: '시설 일지' }),
      el('div', { class: 'muted', style: 'word-break:keep-all', text: '특강실·원형테이블 같은 시설을 쓰면 근무 선생님께 말씀드린 뒤 여기에 적습니다.' }),
      UI.rowLink({ href: d.appUrl + '?page=facility', text: '시설 일지 쓰기' }),
      UI.rowLink({ href: d.appUrl + '?page=facility&tab=mine', text: '내가 쓴 일지 보기' })
    ]));
  }
</script>
