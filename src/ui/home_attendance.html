<script>
  /** 출결 담당 홈 (PRD 8절): 오늘·내일 특이사항, 요청 배지, 격자 정리 남은 날짜 */
  function renderHome(d, root) {
    root.appendChild(el('div', { class: 'card' }, [
      el('h2', { text: '오늘 ' + d.today }),
      el('div', { class: 'muted', text: d.termName + ' · 학사생 ' + d.studentCount + '명' })
    ]));
    root.appendChild(soonCard('오늘·내일 사전 특이사항 · 담임·담당교사 요청', '1단계(F1)에서 만듭니다.'));
    root.appendChild(el('div', { class: 'card' }, [
      el('h2', { text: '출석부' }),
      el('div', { class: 'muted', text: '날짜를 고르면 그날 출석부를 미리 보고 PDF로 받습니다.' }),
      el('a', { class: 'btn', style: 'margin-top:12px', href: d.appUrl + '?page=sheet', text: '출석부 열기' })
    ]));
    root.appendChild(soonCard('출결 결과 격자 정리', '5단계(F11)에서 만듭니다.'));
  }
</script>
