<script>
  /** 2단계 A 카드(CODING-A: 근무·OUT·면담). 이 함수의 몸통만 고친다(docs/plan/stage2.md 1절). 오늘 카드의 #home-duty 줄(내 근무, screens.md 학사 교사)도 여기서 채운다 */
  function renderStage2A(d, root) {
    var x = d.duty, line = document.getElementById('home-duty');
    if (!x) return;
    if (line) {
      if (x.error) line.textContent = '근무 정보를 불러오지 못했습니다.';
      else {
        var nx = x.next ? ' · 다음 근무 ' + (+x.next.date.slice(5, 7)) + '월 ' + (+x.next.date.slice(8, 10)) + '일(' + x.next.label + ')' : '';
        line.textContent = (x.today ? '오늘 내 근무: ' + x.today : '오늘 내 근무 없음') + nx;
      }
    }
    root.appendChild(el('div', { class: 'card' }, [
      el('h2', { text: '근무표' }),
      el('div', { class: 'muted', text: '내 근무와 이번 달 근무표를 봅니다.' }),
      el('a', { class: 'btn', style: 'margin-top:12px', href: d.appUrl + '?page=duty', text: '근무표 보기' })
    ]));
  }

  /** 학사 교사 홈: 오늘, 내가 보낸 특이사항 요청 상태, 내 담당 학생 (PRD 8절) */
  function renderHome(d, root) {
    var m = (d.exc && d.exc.mine) || { requested: 0, confirmed: 0, canceled: 0 };
    root.appendChild(el('div', { class: 'card' }, [
      el('h2', { text: '오늘 ' + d.today }),
      el('div', { class: 'muted', text: d.termName }),
      el('div', { class: 'muted', id: 'home-duty' })
    ]));
    root.appendChild(el('div', { class: 'card' }, [
      el('h2', { text: '내가 보낸 특이사항 요청' }),
      el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap;margin:8px 0' }, [
        UI.statusPill('requested', '요청 ' + m.requested), UI.statusPill('confirmed', '확정 ' + m.confirmed), UI.statusPill('canceled', '취소 ' + m.canceled)
      ]),
      el('div', { class: 'muted', text: '요청은 출결 담당 선생님이 확인하면 출석부에 반영됩니다. 내 담당 학생에게만 보낼 수 있습니다.' }),
      el('a', { class: 'btn', style: 'margin-top:12px', href: d.appUrl + '?page=exceptions', text: '요청 보내기' })
    ]));
    root.appendChild(el('div', { class: 'card' }, [
      el('h2', { text: '내 담당 학생 (' + d.students.length + '명)' }),
      studentList(d.students, '이번 기간 담당 학생이 없습니다.')
    ]));
    root.appendChild(el('div', { class: 'card' }, [
      el('h2', { text: '출석부' }),
      el('div', { class: 'muted', text: '날짜를 고르면 그날 출석부를 미리 보고 PDF로 받습니다.' }),
      el('a', { class: 'btn', style: 'margin-top:12px', href: d.appUrl + '?page=sheet', text: '출석부 열기' })
    ]));
    root.appendChild(el('div', { class: 'card' }, [
      el('h2', { text: '좌석표' }),
      el('div', { class: 'muted', text: '학생을 빈 자리에 앉히고 두 자리를 맞바꿉니다.' }),
      el('a', { class: 'btn', style: 'margin-top:12px', href: d.appUrl + '?page=seats', text: '좌석표 열기' })
    ]));
    try { renderStage2A(d, root); } catch (e) { showError(root, e); }   // 2단계 카드가 실패해도 나머지 카드는 그린다
    try { renderStage2B(d, root); } catch (e) { showError(root, e); }
  }

  /** 2단계 B 카드(CODING-B: 입퇴실·급식·서류). 이 함수의 몸통만 고친다(docs/plan/stage2.md 1절) */
  function renderStage2B(d, root) {
    return;
  }
</script>
