<script>
  /** 2단계 A 카드(CODING-A: 근무·OUT·면담). 이 함수의 몸통만 고친다(docs/plan/stage2.md 1절). 오늘 카드의 #home-duty 줄(내 근무, screens.md 학사 교사)도 여기서 채운다 */
  function renderStage2A(d, root) {
    if (d.out && d.out.canRecord) {
      root.appendChild(el('div', { class: UI.cardClass(d.out.out1 || d.out.out2 ? 'key' : '') }, [
        el('h2', { text: 'OUT 기록' }),
        el('div', { class: 'muted', text: '숫자와 이름은 내 담당 학생 기준입니다.' }),
        el('div', { class: 'muted', text: '오늘 적발한 학생의 OUT을 30초 안에 기록합니다.' }),
        el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap;margin:8px 0' }, [
          (d.out.out1 ? UI.statusPill('out1', '1OUT ' + d.out.out1 + '명') : UI.statusPill('mute', '1OUT 0명')), (d.out.out2 ? UI.statusPill('out2', '퇴실 대상 ' + d.out.out2 + '명') : UI.statusPill('mute', '퇴실 대상 0명')), UI.statusPill('mute', '오늘 ' + (d.out.today || 0) + '건')]),
        d.out.list && d.out.list.length ? el('ul', { class: 'list' }, d.out.list.map(function (r) { return el('li', {}, [el('span', { text: UI.util.studentLabel(r.student) }), r.count >= 2 ? UI.statusPill('out2') : UI.statusPill('out1')]); })) : null,
        UI.rowLink({ href: d.appUrl + '?page=outs&tab=record', text: 'OUT 기록하기' }),
        UI.rowLink({ href: d.appUrl + '?page=outs&tab=term', text: (d.out.periodWord || '이번 학기') + ' 보기' })
      ]));
    }
    var x = d.duty, line = document.getElementById('home-duty');
    if (!x) return;
    if (line) {
      clear(line);
      if (x.error) line.textContent = '근무 정보를 불러오지 못했습니다.';
      else {
        // 승인된 시안: "● 내 근무 21:30조 (21:30까지)" + "다음 근무: 3월 6일(토) 근무", 없으면 "오늘은 근무가 없습니다"
        if (x.today) {
          line.appendChild(el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0' }, [
            UI.statusPill('todo', '내 근무'), el('b', { text: x.today.label + (x.today.end ? ' (' + x.today.end + '까지)' : '') })]));
        } else line.appendChild(el('div', { text: '오늘은 근무가 없습니다.' }));
        if (x.next) line.appendChild(el('div', { class: 'muted', text: '다음 근무: ' + (+x.next.date.slice(5, 7)) + '월\u00a0' + (+x.next.date.slice(8, 10)) + '일(' + x.next.weekdayKo + ')\u00a0' + x.next.label }));
        if (x.today || x.next) line.appendChild(UI.rowLink({ href: d.appUrl + '?page=duty&date=' + (x.today ? d.today : x.next.date), text: '내 근무 교대' }));
      }
    }
    root.appendChild(el('div', { class: 'card' }, [
      el('h2', { text: '근무표' }),
      el('div', { class: 'muted', text: '내 근무와 이번 달 근무표를 봅니다.' }),
      UI.rowLink({ href: d.appUrl + '?page=duty', text: '근무표 보기' }),
      UI.rowLink({ href: d.appUrl + '?page=duty&tab=record', text: '내 근무 기록' })
    ]));
  }

  /** 오늘·내일 빠지는 학생 카드(D17 ⑨, 레퍼런스 BambooHR Who's out). 기존 listExceptions(범위) 호출을 그대로 쓴다 — 홈 데이터에는 명단이 없어서 카드만 나중에 채운다 */
  function whosOutCard_(d) {
    var box = el('div', { class: 'card out-card' }, [el('h2', { text: '오늘 빠지는 학생' }), el('div', { class: 'muted', text: '불러오는 중…' })]);
    if (typeof call !== 'function') return box;
    var tomorrow = UI.util.addDays(d.today, 1);
    call('listExceptions', { scope: 'range', from: d.today, to: tomorrow }).then(function (r) {
      var w = UI.util.whosOut(r.groups, d.today, tomorrow);
      clear(box); box.appendChild(el('h2', { text: '오늘 빠지는 학생 ' + w.today.length + '명' }));
      function day(label, list) {
        box.appendChild(el('div', { class: 'out-day', text: label + ' · ' + list.length + '명' }));
        if (!list.length) { box.appendChild(el('div', { class: 'muted', text: '없습니다.' })); return; }
        list.forEach(function (x) {
          var kind = /^병/.test(x.type) ? 'byung' : /^학원/.test(x.type) ? 'hak' : /^가정/.test(x.type) ? 'ga' : 'mute';
          box.appendChild(el('div', { class: 'out-row' }, [el('span', { class: 'out-when', text: x.blocksText }), el('span', { class: 'out-who', text: x.display }), UI.statusPill(kind, x.short)]));
        });
      }
      day('오늘 ' + UI.util.formatDateKo(d.today), w.today); day('내일 ' + UI.util.formatDateKo(tomorrow), w.tomorrow);
      box.appendChild(el('div', { class: 'muted', text: '확정된 특이사항만 나옵니다. 요청 중인 것은 출결 담당 선생님이 확정하면 들어옵니다.' }));
    }).catch(function () { clear(box); box.appendChild(el('h2', { text: '오늘 빠지는 학생' })); box.appendChild(el('div', { class: 'muted', text: '불러오지 못했습니다. 위의 새로고침을 눌러 주세요.' })); });
    return box;
  }

  /** 학사 교사 홈: 오늘, 내가 보낸 특이사항 요청 상태, 내 담당 학생 (PRD 8절) */
  function renderHome(d, root) {
    var m = (d.exc && d.exc.mine) || { requested: 0, confirmed: 0, canceled: 0 };
    root.appendChild(el('div', { class: 'card' }, [
      el('h2', { text: '오늘 ' + UI.util.formatDateKo(d.today) }),
      el('div', { class: 'muted', text: d.termName }),
      el('div', { class: 'muted', id: 'home-duty' }),
      UI.rowLink({ href: d.appUrl + '?page=inbox', text: '확인함 — 내가 처리할 것 모아 보기' })
    ]));
    root.appendChild(whosOutCard_(d));   // 오늘 빠지는 학생(D17 ⑨): 감독 중 출석부와 대조하기 쉽게 시간대 순 한 줄 목록
    root.appendChild(el('div', { class: 'card' }, [
      el('h2', { text: '내가 보낸 특이사항 요청' }),
      el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap;margin:8px 0' }, [
        UI.statusPill('requested', '요청 ' + m.requested), UI.statusPill('confirmed', '확정 ' + m.confirmed), UI.statusPill('canceled', '취소 ' + m.canceled)
      ]),
      el('div', { class: 'muted', text: '요청은 출결 담당 선생님이 확인하면 출석부에 반영됩니다. 내 담당 학생에게만 보낼 수 있습니다.' }),
      UI.rowLink({ href: d.appUrl + '?page=exceptions', text: '요청 보내기' }),
      UI.rowLink({ href: d.appUrl + '?page=programs', text: '학사 프로그램 열기' })
    ]));
    root.appendChild(el('div', { class: 'card' }, [
      el('h2', { text: '내 담당 학생 (' + d.students.length + '명)' }),
      studentList(d.students, '이번 운영 기간 담당 학생이 없습니다.')
    ]));
    if (d.docs && !d.docs.error) {
      root.appendChild(el('div', { class: UI.cardClass(d.docs.items ? 'todo' : '') }, [
        el('h2', { text: '서류 체크리스트' }),
        el('div', { style: 'margin:8px 0' }, [d.docs.items ? UI.statusPill('todo', '미제출 ' + d.docs.items + '건 · 학생 ' + d.docs.students + '명') : UI.statusPill('confirmed', d.docs.types ? '모두 제출' : '서류 종류 없음')]),
        el('div', { class: 'muted', text: '학기 초 서류(동의서 등)를 냈는지 표시합니다.' }),
        UI.rowLink({ href: d.appUrl + '?page=docs', text: '서류 체크리스트 열기' })
      ]));
    }
    if (d.counsel && !d.counsel.error) {
      var cn = d.counsel;
      root.appendChild(el('div', { class: UI.cardClass(cn.withoutNote ? 'todo' : '') }, [
        el('h2', { text: '상담일지' }),
        el('div', { style: 'margin:8px 0' }, [cn.withoutNote ? UI.statusPill('todo', '이번 운영 기간 상담 기록 없는 학생 ' + cn.withoutNote + '명') : UI.statusPill('confirmed', cn.total ? '담당 학생 모두 기록 있음' : '담당 학생 없음')]),
        el('div', { class: 'muted', style: 'word-break:keep-all', text: '최근 30일 내가 쓴 상담 ' + cn.mine30 + '건 · 내용은 담당교사·담임·관리자 선생님만 봅니다.' }),
        UI.rowLink({ href: d.appUrl + '?page=counsel', text: '상담일지 열기' })
      ]));
    }
    if (d.counselreq && !d.counselreq.error) {   // 상담 신청(C49-A): 날짜를 아직 안 정한 신청이 있을 때만 '할 일' 카드(메모·이름 없음, 숫자만)
      var cq = d.counselreq;
      root.appendChild(el('div', { class: UI.cardClass(cq.open ? 'todo' : '') }, [
        el('h2', { text: '상담 신청' }),
        el('div', { style: 'margin:8px 0' }, [cq.open ? UI.statusPill('todo', '날짜를 정할 신청 ' + cq.open + '건') : UI.statusPill('confirmed', '처리할 신청 없음')]),
        cq.earliest ? el('div', { class: 'muted', style: 'word-break:keep-all', text: '가장 빠른 희망 날짜: ' + UI.util.formatDateKo(cq.earliest, false) }) : null,
        cq.fixed ? el('div', { class: 'muted', text: '날짜가 정해진 상담 ' + cq.fixed + '건 — 상담을 마치면 상담일지를 써 주세요.' }) : null,
        UI.rowLink({ href: d.appUrl + '?page=requests', text: '상담 신청 처리 열기' })
      ]));
    }
    if (d.timetable && !d.timetable.error) {
      var tt = d.timetable;
      root.appendChild(el('div', { class: UI.cardClass(tt.todo ? 'todo' : '') }, [
        el('h2', { text: tt.monthKo + ' 시간표' }),
        el('div', { style: 'margin:8px 0' }, [tt.todo ? UI.statusPill('todo', '확인 필요 ' + tt.todo + '명') : UI.statusPill('confirmed', '확인할 시간표 없음')]),
        el('div', { class: 'muted', style: 'word-break:keep-all', text: (tt.open ? '제출 마감까지 ' + tt.daysLeft + '일(' + tt.endKo + ')' : '지금은 제출 기간이 아닙니다') + ' · 미제출 ' + tt.missing + '명(담당 ' + tt.total + '명)' }),
        UI.rowLink({ href: d.appUrl + '?page=timetable&role=hall_teacher', text: '시간표 열기' })
      ]));
    }
    root.appendChild(el('div', { class: 'card' }, [
      el('h2', { text: '출석부' }),
      el('div', { class: 'muted', text: '날짜를 고르면 그날 출석부를 미리 보고 PDF로 받습니다.' }),
      UI.rowLink({ href: d.appUrl + '?page=sheet', text: '출석부 열기' })
    ]));
    root.appendChild(el('div', { class: 'card' }, [
      el('h2', { text: '좌석표' }),
      el('div', { class: 'muted', text: '학생을 빈 좌석에 앉히고 좌석 2개를 맞바꿉니다.' }),
      UI.rowLink({ href: d.appUrl + '?page=seats', text: '좌석표 열기' }),
      UI.rowLink({ href: d.appUrl + '?page=avoid', text: '떨어뜨릴 짝' }),
      UI.rowLink({ href: d.appUrl + '?page=contacts', text: '연락처' })
    ]));
    try { renderStage2A(d, root); } catch (e) { showError(root, e); }   // 2단계 카드가 실패해도 나머지 카드는 그린다
    try { renderStage2B(d, root); } catch (e) { showError(root, e); }
  }

  /** 2단계 B 카드(CODING-B: 입퇴실·급식·서류). 이 함수의 몸통만 고친다(docs/plan/stage2.md 1절) */
  function renderStage2B(d, root) {
    var f = d.food;
    if (!f || f.error) return;
    if (f.dorm) {   // 기숙사 빈 자리(남·여) — 방 배정·정원 현황으로 들어가는 입구(C23). 학생 이름 없음
      var dm = f.dorm;
      root.appendChild(el('div', { class: 'card' }, [
        el('h2', { text: '기숙사 빈 자리' }),
        el('div', { class: 'stats', style: 'margin:4px 0 12px' }, [statBox(dm.male.vacant, '남 빈 자리(정원 ' + dm.male.capacity + ')'), statBox(dm.female.vacant, '여 빈 자리(정원 ' + dm.female.capacity + ')')]),
        el('div', { class: 'muted', style: 'word-break:keep-all', text: '기숙 ' + dm.dormCount + '명 · 방 배정 안 됨 ' + dm.unassignedCount + '명' }),
        UI.rowLink({ href: d.appUrl + '?page=rooms&tab=stats', text: '정원 현황판 열기' }),
        UI.rowLink({ href: d.appUrl + '?page=rooms', text: '방 배정 열기' })
      ]));
    }
    if (f.tempLeave && f.tempLeave.n) {   // 복귀 예정일이 지난 건강상 임시 퇴실(결정 77④): 담당교사가 [일반 퇴실로 바꾸기]로 정리한다
      var tk = [el('h2', { text: '복귀 예정일 지남' }), el('div', { style: 'word-break:keep-all', text: '임시 퇴실 중인 학생 ' + f.tempLeave.n + '명의 복귀 예정일이 지났습니다.' })];
      f.tempLeave.list.forEach(function (x) {
        tk.push(el('a', { style: 'display:block;padding:10px 0;border-bottom:1px solid var(--line);color:var(--accent)', href: d.appUrl + '?page=moves&tab=history&student=' + encodeURIComponent(x.studentId), text: x.label + ' · 복귀 예정 ' + x.returnKo + ' (' + x.daysLate + '일 지남)' }));
      });
      if (f.tempLeave.n > f.tempLeave.list.length) tk.push(el('div', { class: 'muted', style: 'margin-top:8px', text: '그 밖에 ' + (f.tempLeave.n - f.tempLeave.list.length) + '명이 더 있습니다.' }));
      tk.push(el('div', { class: 'muted', style: 'margin-top:8px;word-break:keep-all', text: '학생을 눌러 기록에서 [일반 퇴실로 바꾸기]를 누를 수 있습니다. 복귀했다면 입퇴실 신청에서 학사 입실을 기록해 주세요.' }));
      root.appendChild(el('div', { class: UI.cardClass('todo') }, tk));
    }
    var n = f.docMissing || 0;
    var kids = [el('h2', { text: '급식·입퇴실 서류' }),
      el('div', { class: n ? '' : 'muted', text: n ? '서류 미제출 ' + n + '건이 남아 있습니다.' : '서류 미제출 기록이 없습니다.' })];
    (f.docList || []).forEach(function (x) {
      kids.push(el('a', { style: 'display:block;padding:10px 0;border-bottom:1px solid var(--line);color:var(--accent)', href: d.appUrl + '?page=moves&tab=history&student=' + encodeURIComponent(x.studentId) + (x.ymd ? '&date=' + x.ymd : ''), text: x.label + ' ' + x.kind }));
    });
    if (f.docMore) kids.push(el('div', { class: 'muted', style: 'margin-top:8px', text: '그 밖에 ' + f.docMore + '건이 더 있습니다.' }));
    kids.push(UI.rowLink({ href: d.appUrl + '?page=moves&tab=meal', text: '급식 변경 신청' }));
    kids.push(UI.rowLink({ href: d.appUrl + '?page=moves', text: '입퇴실 신청' }));
    root.appendChild(el('div', { class: UI.cardClass(n ? 'todo' : '') }, kids));
  }
  /** 월별 일정 카드(C34, 결정 80): 오늘 일정과 다음 일정. 맨 아래에 붙인다 */
  (function () {
    var base = renderHome;
    renderHome = function (d, root) {
      base(d, root);
      var e = d.events;
      if (!e || e.error) return;
      var md = function (ymd) { return (+ymd.slice(5, 7)) + '월 ' + (+ymd.slice(8, 10)) + '일'; };
      var lines = [];
      e.today.forEach(function (x) { lines.push(el('div', {}, [UI.statusPill('mute', '오늘'), ' ' + x.title + ' (' + x.kind + ')'])); });
      e.next.forEach(function (x) { lines.push(el('div', { class: 'muted' }, [md(x.start) + ' ' + x.title + ' (' + x.kind + ')'])); });
      if (!lines.length) lines.push(el('div', { class: 'muted', text: '오늘과 앞으로 2주 안에 등록된 일정이 없습니다.' }));
      root.appendChild(el('div', { class: 'card' }, [el('h2', { text: '월별 일정' })].concat(lines, [
        UI.rowLink({ href: d.appUrl + '?page=calendar', text: '월별 일정 열기' })])));
    };
  })();
  /** 시설 일지 카드(C35, F10): 오늘 일지 수와 링크. 학사 교사는 오늘 근무일 때만(서버가 판정), 이름은 없다 */
  (function () {
    var base = renderHome;
    renderHome = function (d, root) {
      base(d, root);
      var f = d.facility;
      if (!f || f.error || !f.onDuty) return;
      var kids = [el('h2', { text: '시설 일지' }), el('div', { style: 'margin:8px 0' }, [f.count ? UI.statusPill('todo', '오늘 일지 ' + f.count + '건') : UI.statusPill('mute', '오늘 쓴 일지 없음')]),
        el('div', { class: 'muted', style: 'word-break:keep-all', text: f.isAdmin ? '학생이 쓴 시설 사용 일지와 학생 × 날짜 누적표를 봅니다.' : '오늘 학생들이 말씀드리고 쓴 시설 사용 일지입니다.' }),
        UI.rowLink({ href: d.appUrl + '?page=facilityday', text: '오늘 시설 일지 보기' })];
      if (f.isAdmin) kids.push(UI.rowLink({ href: d.appUrl + '?page=facilityday&tab=stats', text: '누적표 보기' }));
      root.appendChild(el('div', { class: UI.cardClass(f.count ? 'key' : '') }, kids));
    };
  })();
</script>
