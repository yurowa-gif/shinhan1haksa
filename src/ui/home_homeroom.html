<script>
  /** 담임 홈: 우리 반 학사생 목록과 특이사항 요청 (PRD 8절) */
  function renderHome(d, root) {
    var m = (d.exc && d.exc.mine) || { requested: 0, confirmed: 0, canceled: 0 };
    root.appendChild(el('div', { class: 'card' }, [
      el('h2', { text: d.homeroomClass + ' 학사생 (' + d.students.length + '명)' }),
      el('div', { class: 'muted', text: d.termName }),
      studentList(d.students, '이번 기간 우리 반 학사생이 없습니다.')
    ]));
    root.appendChild(el('div', { class: 'card' }, [
      el('h2', { text: '특이사항 요청' }),
      el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap;margin:8px 0' }, [
        UI.statusPill('requested', '요청 ' + m.requested), UI.statusPill('confirmed', '확정 ' + m.confirmed), UI.statusPill('canceled', '취소 ' + m.canceled)
      ]),
      el('div', { class: 'muted', text: '우리 반 학생에게만 보낼 수 있고, 출결 담당 선생님이 확인하면 출석부에 반영됩니다.' }),
      el('a', { class: 'btn', style: 'margin-top:12px', href: d.appUrl + '?page=exceptions', text: '요청 보내기' })
    ]));
    root.appendChild(soonCard('학생별 OUT·급식·기숙사·상담 열람', '이후 단계에서 추가합니다.'));
  }
</script>
