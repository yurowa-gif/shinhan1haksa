<script>
  /** 2단계 A 카드(CODING-A: 근무·OUT·면담). 이 함수의 몸통만 고친다(docs/plan/stage2.md 1절) */
  function renderStage2A(d, root) {
    if (!d.out || d.out.error) return;
    root.appendChild(el('div', { class: 'card' }, [
      el('h2', { text: '우리 반 OUT' }),
      el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap;margin:8px 0' }, [
        d.out.out1 ? UI.statusPill('out1', '1OUT ' + d.out.out1 + '명') : UI.statusPill('mute', '1OUT 0명'),
        d.out.out2 ? UI.statusPill('out2', '퇴실 대상 ' + d.out.out2 + '명') : UI.statusPill('mute', '퇴실 대상 0명')]),
      d.out.mailOn ? el('div', { class: 'muted', style: 'word-break:keep-all', text: '우리 반 학생에게 새 OUT이 기록되면 메일로도 알려 드립니다.' }) : null,
      el('a', { class: 'btn secondary', style: 'margin-top:4px', href: d.appUrl + '?page=outs&tab=term', text: (d.out.periodWord === '이번 기간' ? '이번 기간 보기' : '이번 학기 보기') })
    ]));
  }

  /** 담임 홈: 우리 반 학사생 목록(요청 상태 pill)과 특이사항 요청 (PRD 8절, docs/design/screens.md 1절) */
  function renderHome(d, root) {
    var m = (d.exc && d.exc.mine) || { requested: 0, confirmed: 0, canceled: 0 };
    var per = (d.exc && d.exc.perStudent) || {};
    var outN = (d.out && d.out.perStudent) || {};   // 학생별 이번 기간 OUT 수(1이면 1OUT, 2 이상이면 퇴실 대상)
    var listCard = el('div', { class: 'card' }, [
      el('h2', { text: d.homeroomClass + ' 학사생 (' + d.students.length + '명)' }),
      el('div', { class: 'muted', text: d.termName })
    ]);
    var listBox = el('div');
    var filter = 'all';
    function drawList() {
      clear(listBox);
      var items = d.students.filter(function (s) { return filter === 'all' || per[s.id]; });
      if (!items.length) { listBox.appendChild(el('div', { class: 'muted', text: filter === 'all' ? '이번 기간 우리 반 학사생이 없습니다.' : '요청 중인 학생이 없습니다.' })); return; }
      var ul = el('ul', { class: 'list' });
      items.forEach(function (s) {
        // 이름을 누르면 그 학생의 특이사항 기록(학생별 목록)으로 간다
        ul.appendChild(el('li', {}, [
          el('a', { href: d.appUrl + '?page=exceptions&tab=list&student=' + encodeURIComponent(s.id), text: s.name }),
          el('span', { class: 'muted' }, [s.number + '번 ', outN[s.id] ? UI.statusPill(outN[s.id] >= 2 ? 'out2' : 'out1') : null, per[s.id] ? UI.statusPill('requested', '요청 ' + per[s.id]) : null])
        ]));
      });
      listBox.appendChild(ul);
    }
    listCard.appendChild(UI.segmented({ label: '보기', value: filter, options: [{ value: 'all', label: '모두' }, { value: 'req', label: '요청 중' }],
      onchange: function (v) { filter = v; drawList(); } }));
    listCard.appendChild(listBox);
    root.appendChild(listCard);
    drawList();
    root.appendChild(el('div', { class: 'card' }, [
      el('h2', { text: '특이사항 요청' }),
      el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap;margin:8px 0' }, [
        UI.statusPill('requested', '요청 ' + m.requested), UI.statusPill('confirmed', '확정 ' + m.confirmed), UI.statusPill('canceled', '취소 ' + m.canceled)
      ]),
      el('div', { class: 'muted', text: '우리 반 학생에게만 보낼 수 있고, 출결 담당 선생님이 확인하면 출석부에 반영됩니다.' }),
      el('a', { class: 'btn', style: 'margin-top:12px', href: d.appUrl + '?page=exceptions', text: '요청 보내기' })
    ]));
    root.appendChild(el('div', { class: 'card' }, [
      el('h2', { text: '좌석표' }),
      el('div', { class: 'muted', text: '우리 반 학생의 자리를 확인합니다.' }),
      el('a', { class: 'btn', style: 'margin-top:12px', href: d.appUrl + '?page=seats', text: '좌석표 열기' })
    ]));
    try { renderStage2A(d, root); } catch (e) { showError(root, e); }   // 2단계 카드가 실패해도 나머지 카드는 그린다
    try { renderStage2B(d, root); } catch (e) { showError(root, e); }
  }

  /** 2단계 B 카드(CODING-B: 입퇴실·급식·서류). 이 함수의 몸통만 고친다(docs/plan/stage2.md 1절) */
  function renderStage2B(d, root) {
    if (!d.food || d.food.error) return;
    var kids = [el('h2', { text: '우리 반 입퇴실·급식 변경' }), el('div', { class: 'muted', text: '이번 주 신청만 보입니다. 변경은 담당교사가 합니다.' })];
    var week = d.food.week || [];
    if (!week.length) kids.push(el('div', { style: 'margin-top:8px', text: '이번 주 신청이 없습니다.' }));
    week.forEach(function (x) {
      kids.push(el('div', { style: 'display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)' }, [
        el('a', { style: 'flex:1 1 auto;min-width:0', href: d.appUrl + '?page=moves&tab=history&student=' + encodeURIComponent(x.studentId) + (x.ymd ? '&date=' + x.ymd : ''), text: x.label + ' ' + x.what + '(' + x.dateKo + '부터)' }),
        el('span', { style: 'flex:0 0 auto;white-space:nowrap' }, [x.missing ? UI.statusPill('todo', '서류 미제출') : (x.done ? UI.statusPill('mute', '서류 제출') : null)])]));
    });
    root.appendChild(el('div', { class: 'card' }, kids));
  }
</script>
